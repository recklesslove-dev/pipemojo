<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pipe Mojo Kids Edition</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2b1559">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mojo Kids">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#2b1559;   /* basement purple, lighter than the main site */
  --deep:#170a33;
  --water:#3ee3ff;   /* bath water */
  --brass:#ffd447;   /* fittings and stars */
  --copper:#e5894a;
  --cream:#fff4df;
  --kid:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  --brand:'Pirata One',Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--kid);color:var(--cream);background:var(--deep);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--brass);outline-offset:4px;border-radius:20px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.screen[hidden]{display:none}

/* ---------- home ---------- */
#home{
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(62,227,255,.22) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 105%, rgba(255,212,71,.16) 0%, transparent 70%),
    linear-gradient(180deg,var(--night),var(--deep));
  align-items:center;justify-content:space-between;
}
.brand{text-align:center;margin-top:clamp(14px,4vh,40px)}
.brand img{width:clamp(56px,10vh,96px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.brand h1{font-family:var(--brand);font-weight:400;line-height:.9;color:var(--brass);
  font-size:clamp(2.4rem,7.5vh,4.6rem);text-shadow:0 4px 0 #6b3a12,0 0 28px rgba(255,212,71,.35)}
.brand h1 small{display:block;font-family:var(--kid);font-weight:700;font-size:.42em;color:var(--water);
  letter-spacing:.04em;text-shadow:0 3px 0 #0b4b5c;margin-top:.15em}
.games{display:flex;gap:clamp(14px,3vw,34px);padding:0 18px;width:100%;max-width:980px;justify-content:center;flex:1;align-items:center}
@media (orientation:portrait){.games{flex-direction:column}}
@media (orientation:landscape){.games .game{min-height:min(46vh,380px)}}
.game{position:relative;flex:1;max-width:420px;width:100%;min-height:clamp(150px,26vh,320px);border-radius:34px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:14px 14px 18px;overflow:hidden;
  box-shadow:0 10px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.25);transition:transform .12s}
.game:active{transform:translateY(6px) scale(.98);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.25)}
.game.pop{background:radial-gradient(circle at 30% 25%,#7ff1ff 0%,#1fb6d6 55%,#0f7f9e 100%)}
.game.flow{background:radial-gradient(circle at 30% 25%,#ffb27a 0%,#d9692b 55%,#9c4317 100%)}
.game img{position:absolute;bottom:56px;height:68%;width:auto;max-width:70%;object-fit:contain;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.game .label{position:relative;font-weight:700;font-size:clamp(1.6rem,4.4vh,2.4rem);background:rgba(23,10,51,.82);
  padding:.15em .8em;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.game .b{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,255,255,.08) 60%)}
.shelf{width:100%;max-width:980px;padding:0 18px 28px;display:flex;align-items:center;gap:12px}
.stickers{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden;min-height:64px;
  background:rgba(255,255,255,.07);border-radius:24px;padding:8px 14px}
.stickers .count{font-weight:700;font-size:1.25rem;color:var(--brass);white-space:nowrap;margin-right:4px}
.stickers .st{width:52px;height:56px;flex:none;display:block}
.stickers .st img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.stickers .none{font-weight:600;color:rgba(255,244,223,.75)}
.grown{position:relative;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--brass) calc(var(--p,0)*1%),rgba(255,255,255,.12) 0);opacity:.75}
.grown span{position:absolute;inset:5px;border-radius:50%;background:var(--deep);display:grid;place-items:center}
.grown svg{width:26px;height:26px}
.grown em{position:absolute;bottom:-18px;font-style:normal;font-size:.7rem;white-space:nowrap;color:rgba(255,244,223,.6)}

/* ---------- gold stickers, trophy, finale ---------- */
.st.gold{position:relative}
.stickers .st.gold img,#yay .got .st.gold img,#yay .prog .gold img{filter:drop-shadow(0 0 4px #ffe680) drop-shadow(0 0 10px #ffb300)}
.st.gold::after{content:'✦';position:absolute;right:-4px;top:-6px;color:#ffd447;font-size:1.2rem;text-shadow:0 0 6px #fff3b8}
#yay .got .st.gold::after{font-size:2.6rem}
.stickers .st.trophy svg{width:100%;height:100%;display:block}
#finale{z-index:15;background:rgba(23,10,51,.88);align-items:center;justify-content:center;text-align:center}
#finale .fin{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}
#finale h2{font-weight:700;font-size:clamp(2.6rem,8vh,4.6rem);color:var(--brass);text-shadow:0 5px 0 #6b3a12}
#finale .trophy svg{height:clamp(150px,28vh,260px);width:auto;animation:spinIn .9s cubic-bezier(.2,1.5,.4,1);filter:drop-shadow(0 0 22px rgba(255,212,71,.6))}
.finCrew{display:flex;gap:6px;align-items:flex-end}
.finCrew img{height:clamp(60px,11vh,110px);width:auto;animation:bounce .6s ease-in-out infinite alternate}
.finCrew img:nth-child(2){animation-delay:.15s}.finCrew img:nth-child(3){animation-delay:.3s;height:clamp(80px,14vh,140px)}.finCrew img:nth-child(4){animation-delay:.45s}.finCrew img:nth-child(5){animation-delay:.6s}
#finale .unlock{font-weight:700;font-size:1.2rem;color:var(--water)}
@media (prefers-reduced-motion:reduce){.finCrew img,#finale .trophy svg{animation:none}}

/* ---------- start, players, parent menu ---------- */
#splash,#who{
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(62,227,255,.22) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 105%, rgba(255,212,71,.16) 0%, transparent 70%),
    linear-gradient(180deg,var(--night),var(--deep));
  align-items:center;justify-content:center;gap:clamp(12px,3vh,30px);text-align:center}
#splash .hero{height:clamp(200px,42vh,420px);width:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));animation:bounce 1.1s ease-in-out infinite alternate}
#splash .tap{font-weight:700;font-size:clamp(1.6rem,4.4vh,2.4rem);background:var(--water);color:#062a33;padding:.35em 1.2em;border-radius:999px;box-shadow:0 7px 0 #138aa1;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#who h2{font-weight:700;font-size:clamp(2.2rem,6.5vh,3.6rem);color:var(--brass);text-shadow:0 4px 0 #6b3a12}
.whoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.5vw,22px);width:min(92vw,660px)}
.whoGrid.one{grid-template-columns:minmax(0,320px);justify-content:center}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;border-radius:30px;
  box-shadow:0 8px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.25)}
.pl:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pl img{height:clamp(110px,19vh,200px);width:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.pl b{font-weight:700;font-size:clamp(1.4rem,3.6vh,2.1rem);background:rgba(23,10,51,.82);padding:.1em .7em;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-ganja{background:radial-gradient(circle at 30% 25%,#ffc28f,#d9692b 60%,#9c4317)}
.c-fly{background:radial-gradient(circle at 30% 25%,#9fc2ff,#3d6fd6 60%,#1f3f8f)}
.c-roux{background:radial-gradient(circle at 30% 25%,#ffa08f,#e8473e 60%,#9c1f17)}
.c-maggot{background:radial-gradient(circle at 30% 25%,#e9d8ff,#a985d6 60%,#6b4a9c)}
.chip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);z-index:2;display:flex;align-items:center;gap:8px;
  padding:5px 16px 5px 5px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:700;font-size:1.25rem;max-width:46vw}
.chip img{width:54px;height:54px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,.14)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#parent{z-index:20;background:rgba(10,4,24,.88);align-items:center;justify-content:center;padding:20px}
#parent .panel{width:min(94vw,620px);max-height:calc(100% - 20px);overflow:auto;background:#2b1559;border-radius:26px;padding:20px;box-shadow:0 12px 0 rgba(0,0,0,.4);text-align:left}
#parent h3{font-weight:700;font-size:1.5rem;color:var(--brass);margin:4px 0 12px}
#parent h4{font-weight:700;font-size:1.15rem;margin:18px 0 8px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border-radius:18px;background:rgba(255,255,255,.07);margin-bottom:10px}
.prow img{width:52px;height:52px;object-fit:contain}
.prow .meta{font-size:.95rem;color:rgba(255,244,223,.75);flex:1;min-width:110px}
#parent input{font:inherit;font-size:1.15rem;color:#170a33;background:var(--cream);border:0;border-radius:12px;padding:8px 12px;width:150px;
  -webkit-user-select:text;user-select:text}
.pbtn{font-weight:700;font-size:1rem;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.14)}
.pbtn.warn{background:#a8322a}
.pbtn.armed{background:#ff5a4a;color:#fff}
.pbtn.go{background:var(--water);color:#062a33}
.pbtn.gold{background:var(--brass);color:#3a2506}
.pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pick button{width:76px;height:76px;border-radius:18px;background:rgba(255,255,255,.08);border:3px solid transparent;padding:4px}
.pick button img{width:100%;height:100%;object-fit:contain}
.pick button.on{border-color:var(--brass);background:rgba(255,212,71,.18)}
.pfoot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}

/* ---------- game screens ---------- */
.play{background:var(--deep)}
.play canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 14px;pointer-events:none}
.bar>*{pointer-events:auto}
.homeBtn{width:72px;height:72px;border-radius:24px;background:var(--brass);display:grid;place-items:center;flex:none;
  box-shadow:0 6px 0 #a3741a}
.homeBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a3741a}
.homeBtn svg{width:40px;height:40px}
.dots{display:flex;flex-wrap:wrap;gap:6px;background:rgba(23,10,51,.6);padding:8px 12px;border-radius:999px;max-width:calc(100% - 100px)}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);transition:background .2s,transform .2s}
.dots i.on{background:var(--water);transform:scale(1.15);box-shadow:0 0 8px var(--water)}
.lvl{font-weight:700;font-size:1.5rem;background:rgba(23,10,51,.6);padding:8px 18px;border-radius:999px;color:var(--brass)}

/* ---------- celebration ---------- */
#yay{z-index:10;background:rgba(23,10,51,.72);align-items:center;justify-content:center;text-align:center}
#yay canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#yay .card{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}
#yay .mojo{height:clamp(140px,30vh,280px);width:auto;animation:bounce 1s ease-in-out infinite alternate;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
@keyframes bounce{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-16px) rotate(3deg)}}
#yay h2{font-weight:700;font-size:clamp(2.6rem,8vh,4.4rem);color:var(--brass);text-shadow:0 5px 0 #6b3a12}
#yay .got{display:flex;align-items:center;gap:12px;font-weight:600;font-size:1.4rem}
#yay .got{flex-direction:column;gap:4px}
#yay .got .st{width:clamp(130px,24vh,200px);height:clamp(130px,24vh,200px);display:block;animation:spinIn .7s cubic-bezier(.2,1.5,.4,1)}
#yay .got .st img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
#yay .got[hidden],#yay .prog[hidden]{display:none}
#yay .prog{display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.1)}
#yay .prog i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.35)}
#yay .prog i.on{background:var(--brass);border-color:#fff3b8;box-shadow:0 0 12px rgba(255,212,71,.7)}
#yay .prog i.now{animation:dotIn .6s cubic-bezier(.2,1.6,.4,1)}
#yay .prog img{height:52px;width:auto;opacity:.45;filter:grayscale(.6)}
@keyframes dotIn{from{transform:scale(0)}to{transform:scale(1)}}
.sceneTitle{position:absolute;left:50%;top:40%;z-index:3;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;
  font-weight:700;font-size:clamp(2.4rem,7vh,4.2rem);color:var(--brass);background:rgba(23,10,51,.82);padding:.2em .8em;border-radius:999px;
  text-shadow:0 4px 0 #6b3a12;box-shadow:0 8px 0 rgba(0,0,0,.3);opacity:0}
.sceneTitle.show{animation:titleIn 2.6s ease forwards}
@keyframes titleIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
@keyframes spinIn{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
.choices{display:flex;gap:16px;margin-top:10px}
.big{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.6rem;padding:16px 26px;border-radius:28px;min-height:84px;
  background:var(--water);color:#062a33;box-shadow:0 7px 0 #138aa1}
.big.alt{background:var(--brass);color:#3a2506;box-shadow:0 7px 0 #a3741a}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.big svg{width:36px;height:36px}
@media (prefers-reduced-motion:reduce){#yay .mojo,#yay .got .st,#yay .prog i.now{animation:none}}
</style>
</head>
<body>

<!-- ============ START ============ -->
<section class="screen" id="splash" aria-label="Start">
  <div class="brand"><h1>Pipe Mojo<small>Kids Edition</small></h1></div>
  <img class="hero" src="/assets/kid-mojo-wave.png" alt="">
  <span class="tap">Tap to play!</span>
</section>

<!-- ============ WHO'S PLAYING ============ -->
<section class="screen" id="who" hidden aria-label="Who's playing?">
  <h2>Who's playing?</h2>
  <div class="whoGrid" id="whoGrid"></div>
</section>

<!-- ============ HOME ============ -->
<section class="screen" id="home" hidden aria-label="Pick a game">
  <button class="chip" id="chip" aria-label="Switch player"></button>
  <div class="brand">
    <img src="/assets/kid-mojo-wave.png" alt="">
    <h1>Pipe Mojo<small>Kids Edition</small></h1>
  </div>
  <div class="games">
    <button class="game pop" data-go="pop" aria-label="Bubble Pop">
      <span class="b" style="width:46px;height:46px;left:12%;top:14%"></span>
      <span class="b" style="width:30px;height:30px;right:16%;top:22%"></span>
      <span class="b" style="width:22px;height:22px;left:24%;top:40%"></span>
      <img src="/assets/kid-ganja.png" alt="">
      <span class="label">Bubble Pop</span>
    </button>
    <button class="game flow" data-go="flow" aria-label="Big Flow">
      <img src="/assets/kid-mojo-wave.png" alt="">
      <span class="label">Big Flow</span>
    </button>
  </div>
  <div class="shelf">
    <div class="stickers" id="shelf"></div>
    <button class="grown" id="grown" aria-label="Grown-ups: press and hold for the menu">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="#ffd447" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <em>Grown-ups: hold</em>
    </button>
  </div>
</section>

<!-- ============ BUBBLE POP ============ -->
<section class="screen play" id="pop" hidden aria-label="Bubble Pop">
  <canvas id="popc"></canvas>
  <div class="bar">
    <button class="homeBtn" data-home aria-label="Home"><svg viewBox="0 0 24 24" fill="#3a2506"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg></button>
  </div>
  <div class="sceneTitle" id="popTitle"></div>
</section>

<!-- ============ BIG FLOW ============ -->
<section class="screen play" id="flow" hidden aria-label="Big Flow">
  <canvas id="flowc"></canvas>
  <div class="bar">
    <button class="homeBtn" data-home aria-label="Home"><svg viewBox="0 0 24 24" fill="#3a2506"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg></button>
    <div class="lvl" id="lvl">★ 1</div>
  </div>
  <div class="sceneTitle" id="sceneTitle"></div>
</section>

<!-- ============ CELEBRATION ============ -->
<section class="screen" id="yay" hidden aria-live="polite">
  <canvas id="confetti"></canvas>
  <div class="card">
    <img class="mojo" src="/assets/kid-mojo-cheer.png" alt="">
    <h2>Great job!</h2>
    <div class="got" id="got"><div class="st" id="newSticker"></div></div>
    <div class="prog" id="prog" hidden></div>
    <div class="choices">
      <button class="big" id="again"><svg viewBox="0 0 24 24" fill="none" stroke="#062a33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg><span id="againTxt">Again</span></button>
      <button class="big alt" data-home><svg viewBox="0 0 24 24" fill="#3a2506"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</button>
    </div>
  </div>
</section>

<!-- ============ FINALE ============ -->
<section class="screen" id="finale" hidden aria-live="polite">
  <div class="card fin">
    <h2>Master Plumber!</h2>
    <div class="trophy" id="finTrophy"></div>
    <div class="finCrew"><img src="/assets/kid-ganja-jump.png" alt=""><img src="/assets/kid-zydeco.png" alt=""><img src="/assets/kid-mojo-cheer.png" alt=""><img src="/assets/kid-roux.png" alt=""><img src="/assets/kid-beignet.png" alt=""></div>
    <p class="unlock">New world unlocked: The Sewer!</p>
    <button class="big" id="finOk">Keep playing!</button>
  </div>
</section>

<!-- ============ GROWN-UPS ============ -->
<section class="screen" id="parent" hidden aria-label="Grown-ups">
  <div class="panel" id="panel"></div>
</section>

<script>
(function(){
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- art (already on the site) ---------- */
const IMG={};
// Kids Edition has its own flat 2D cast (the main-site games keep the 3D renders)
const SRC={mojo:'/assets/kid-mojo-wave.png',mojoCheer:'/assets/kid-mojo-cheer.png',ganja:'/assets/kid-ganja.png',ganjaJump:'/assets/kid-ganja-jump.png',
  roux:'/assets/kid-roux.png',fly:'/assets/kid-zydeco.png',maggot:'/assets/kid-beignet.png'};
for(const k in SRC){const im=new Image();im.src=SRC[k];IMG[k]=im}
const ready=im=>im&&im.complete&&im.naturalWidth>0;
const CREW=['ganja','fly','maggot','roux'];
// stickers: 3 per background, earned every 3 Flow levels (Bubble Pop rounds give a random one)
const STICKERS={sink:['s01','s02','s03'],bath:['s04','s05','s06'],dirt:['s07','s08','s09'],sewer:['s10','s11','s12']};
const BASE=[].concat(STICKERS.sink,STICKERS.bath,STICKERS.dirt);   // all 9 = Master Plumber

/* ---------- voice ----------
   Real recorded clips live in /assets/ (count-, cheer-, squeal-, instr- files). Any line without a clip yet falls back to the iPad's voice.
   To add more: drop the mp3 in /assets/ and add its name below. */
const CLIP_BASE='/assets/';
const CLIPS={
  yay:['cheer-yay','cheer-you-did-it'], sticker:['cheer-sticker'], stickerTime:['cheer-sticker-time'], newSticker:['cheer-new-sticker'],
  flowIntro:['instr-turn-pipes'], sceneSink:['scene-sink'], sceneBath:['scene-bath'], sceneDirt:['scene-dirt'],
  hi:['instr-pick-game'], whos:['instr-whos-playing'], popStart:['instr-pop-bubbles'],
  popBath:['scene-bubble-bath'], popLaundry:['scene-laundry'], popFish:['scene-fish-tank'], popDish:['scene-dish-time'],
  master:['cheer-master-plumber'], gold:['cheer-gold-sticker'], sceneSewer:['scene-sewer'],
  // Big Flow win cheers: recorded ones get used first; record more with these names and they join in
  c1:['cheer-yay'], c2:['cheer-you-did-it'], nice:['cheer-nice'], goodjob:['cheer-good-job'], greatjob:['cheer-great-job'], awesome:['cheer-awesome']
};
const CHEERS=['c1','c2','nice','goodjob','greatjob','awesome'];
const STICKER_LINES=['sticker','stickerTime','newSticker'];
for(let i=1;i<=20;i++)CLIPS['n'+i]=['count-'+String(i).padStart(2,'0')];
const SQUEALS=['squeal-woohoo','squeal-giggle','squeal-wheee'];
const BUF={};let clipsLoading=false,voiceSrc=[];
function loadClips(){
  if(clipsLoading||!Snd.ac)return;clipsLoading=true;
  const names=new Set(SQUEALS);for(const k in CLIPS)CLIPS[k].forEach(n=>names.add(n));
  names.forEach(n=>fetch(CLIP_BASE+n+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject())
    .then(a=>new Promise((res,rej)=>Snd.ac.decodeAudioData(a,res,rej))).then(b=>{BUF[n]=b}).catch(()=>{}));
}
function playBuf(name,at,vol){
  const c=Snd.ac,src=c.createBufferSource(),g=c.createGain();src.buffer=BUF[name];g.gain.value=vol||1;
  src.connect(g);g.connect(Snd.m);src.start(at);return src;
}
const LINES={
  hi:'Pick a game!', whos:'Who\'s playing?',
  popStart:'Pop the bubbles!', popBath:'Bubble bath!', popLaundry:'Laundry day!', popFish:'Fish tank!', popDish:'Dish time!',
  master:'Master Plumber!', gold:'Wow, a gold sticker!', sceneSewer:'Down in the sewer!',
  ganja:'Hi! I\'m Ganja!', fly:'Bzzz! I\'m Zydeco!', maggot:'Hi hi! I\'m Beignet!',
  c1:'Yay!', c2:'You did it!', nice:'Nice!', goodjob:'Good job!', greatjob:'Great job!', awesome:'Awesome!',
  yay:'You did it! Great job!', sticker:'You got a sticker!', stickerTime:'Sticker time!', newSticker:'Ooh, a new sticker!',
  flowIntro:'Turn the pipes! Help the water get to Ganja!', sceneSink:'Under the sink!', sceneBath:'Bath time fun!', sceneDirt:'Down in the dirt!'
};
const NUMS=['one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
NUMS.forEach((w,i)=>{LINES['n'+(i+1)]=w.charAt(0).toUpperCase()+w.slice(1)+'!'});
let voice=null;
function chooseVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  const en=vs.filter(v=>/^en(-|_|$)/i.test(v.lang));
  const want=['Samantha','Ava','Allison','Susan','Zoe','Karen','Tessa','Moira','Victoria','Google US English'];
  for(const w of want){const v=en.find(v=>v.name.indexOf(w)===0);if(v){voice=v;return}}
  voice=en.find(v=>/en-US/i.test(v.lang))||en[0]||null;
}
if(window.speechSynthesis){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice}
const CLIP_ONLY=new Set(['sceneSewer']);
function say(key,cut){
  const text=LINES[key];
  const clip=CLIPS[key];
  if(clip&&Snd.ac&&clip.every(n=>BUF[n])){ // real recording
    if(cut){voiceSrc.forEach(x=>{try{x.stop()}catch(e){}});voiceSrc=[];if(window.speechSynthesis)speechSynthesis.cancel()}
    let t=Snd.ac.currentTime+.02;
    for(const n of clip){voiceSrc.push(playBuf(n,t,1.6));t+=BUF[n].duration+.05}
    return;
  }
  if(CLIP_ONLY.has(key))return; // no recording yet: stay quiet rather than use the iPad voice
  if(text)speak(text,cut); // no clip yet: iPad voice
}
function clipLen(k){const c=CLIPS[k];return c&&c.every(n=>BUF[n])?c.reduce((t,n)=>t+BUF[n].duration,0):1.6}
function sayChain(keys){let t=0;keys.forEach((k,i)=>{setTimeout(()=>say(k,i===0),t*1000);t+=clipLen(k)+.35})} // lines back to back
function cheer(){const have=CHEERS.filter(k=>Snd.ac&&CLIPS[k].every(n=>BUF[n]));say(pick(have.length?have:CHEERS),true)}
function speak(text,cut){
  if(!window.speechSynthesis)return;
  if(cut)speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-US';
  u.pitch=1.45;u.rate=0.95;u.volume=1;
  speechSynthesis.speak(u);
}

/* ---------- sounds (made in code, no files) ---------- */
const Snd={
  ac:null,
  unlock(){
    if(!this.ac){const AC=window.AudioContext||window.webkitAudioContext;if(AC){this.ac=new AC();this.m=this.ac.createGain();this.m.gain.value=.6;this.m.connect(this.ac.destination)}}
    if(this.ac&&this.ac.state==='suspended')this.ac.resume();
  },
  tone(f,d,type,v,slide,delay){
    if(!this.ac)return;const c=this.ac,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.05);
  },
  noise(d,f,v,delay){
    if(!this.ac)return;const c=this.ac,t=c.currentTime+(delay||0),len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();s.buffer=b;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=.8;
    g.gain.value=v||.3;s.connect(bp);bp.connect(g);g.connect(this.m);s.start(t);
  },
  pop(k){const f=380+Math.min(k,20)*28;this.tone(f,.12,'sine',.35,f*2.4);this.noise(.06,3000,.25)},
  // cute "wheee" / "woohoo" squeals for the characters (made in code, no voice)
  slideV(f1,f2,d,delay,type,v){
    if(!this.ac)return;const c=this.ac,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
    l.frequency.value=11;lg.gain.value=f1*.05;l.connect(lg);lg.connect(o.frequency); // a little wobble so it sounds alive
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.22,t+.04);g.gain.setValueAtTime(v||.22,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.m);o.start(t);l.start(t);o.stop(t+d+.05);l.stop(t+d+.05);
  },
  wee(hi){const b=hi?720:560;this.slideV(b,b*2.6,.55,0,'triangle',.24)},
  woohoo(hi){const b=hi?640:520;this.slideV(b*1.25,b,.2,0,'triangle',.22);this.slideV(b*1.1,b*2.2,.42,.22,'triangle',.24)},
  buzz(){this.slideV(260,330,.35,0,'sawtooth',.05)},
  squeal(who){
    const real=SQUEALS.filter(n=>BUF[n]);
    if(real.length&&this.ac){playBuf(pick(real),this.ac.currentTime+.01,1.5);if(who==='fly')this.buzz();return}
    const hi=who==='maggot';
    Math.random()<.5?this.wee(hi):this.woohoo(hi);
    if(who==='fly')this.buzz();
  },
  giggle(){[0,1,2,3].forEach(i=>this.tone(900+(i%2)*260,.09,'triangle',.12,null,.12+i*.09))},
  clunk(){this.tone(220,.09,'square',.06,110);this.tone(120,.12,'sine',.3,70)},
  boop(){this.tone(300,.08,'sine',.12,260)},
  bloop(){this.tone(240,.11,'sine',.32,640)},
  squeak(){this.tone(1100,.12,'sine',.2,1600);this.tone(1500,.14,'sine',.18,1000,.13)},
  boing(){this.slideV(220,660,.35,0,'triangle',.18)},
  clink(){this.tone(2400,.12,'triangle',.14);this.tone(3100,.14,'triangle',.11,null,.1)},
  squirt(){this.noise(.25,1800,.25);this.tone(400,.2,'sine',.1,900)},
  whoosh(){this.noise(.45,900,.22)},
  ding(){this.tone(1568,.5,'triangle',.18);this.tone(2093,.6,'triangle',.14,null,.12)},
  zoom(){this.tone(420,.18,'triangle',.07,1300,.03);this.noise(.16,2600,.07,.02)},
  chime(){this.tone(1046,.25,'triangle',.18);this.tone(1568,.4,'triangle',.15,null,.09)},
  gurgle(){for(let i=0;i<4;i++)this.tone(rand(180,320),.09,'sine',.14,rand(380,520),i*.08)},
  splash(){this.noise(.6,1200,.35);this.tone(500,.4,'sine',.12,1400,.05)},
  cheer(){[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.32,'triangle',.18,null,i*.1));this.tone(1568,.9,'sine',.12,2093,.5)}
};

const CHARS={ganja:'Ganja',fly:'Zydeco',roux:'Roux',maggot:'Beignet'};
const PKEY='pmk-players';
function saveP(d){try{localStorage.setItem(PKEY,JSON.stringify(d||PL))}catch(e){}}
function loadP(){
  try{const d=JSON.parse(localStorage.getItem(PKEY)||'null');if(d&&Array.isArray(d.list))return d}catch(e){}
  const d={list:[],cur:null};let lv=0,st=[]; // first open after this update: old progress becomes player 1
  try{lv=parseInt(localStorage.getItem('pmk-flow-level')||'0',10)||0;st=JSON.parse(localStorage.getItem('pmk-stickers')||'[]')}catch(e){}
  st=st.filter(k=>ALL_ST.includes(k));
  if(lv>1||st.length){d.list.push({id:'p'+Date.now(),char:'ganja',name:'',level:Math.max(1,lv),stickers:st});d.cur=d.list[0].id;saveP(d)}
  return d;
}
let PL=loadP();
function me(){return PL.list.find(p=>p.id===PL.cur)||null}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pname=p=>p.name||CHARS[p.char];
function stickers(){const p=me();return p?p.stickers.slice():[]}
function nextSticker(pool){ // a new one he doesn't have yet first, then gold repeats in turn
  const s=stickers(),fresh=pool.filter(k=>!s.includes(k));
  return fresh.length?fresh[0]:pool[s.filter(isGold).length%pool.length]+'g';
}
function popPool(){const p=me();return p&&p.trophy?ALL_ST:BASE}
function stickerSpan(k,cls){return '<span class="st'+(isGold(k)?' gold':'')+(cls?' '+cls:'')+'">'+stickerHTML(k)+'</span>'}
function trophySVG(name){return '<svg viewBox="0 0 200 230" role="img" aria-label="Master Plumber trophy"><path d="M45 35H20c0 35 15 50 32 52M155 35h25c0 35-15 50-32 52" fill="none" stroke="#e8b830" stroke-width="12" stroke-linecap="round"/>'+
  '<path d="M45 18h110v42c0 45-25 75-55 80-30-5-55-35-55-80z" fill="#ffd447" stroke="#a3741a" stroke-width="6"/><path d="M72 38c-3 30 3 55 18 72" stroke="#fff3b8" stroke-width="8" fill="none" stroke-linecap="round" opacity=".7"/>'+
  '<text x="100" y="92" text-anchor="middle" font-size="40" fill="#a3741a">★</text><rect x="88" y="138" width="24" height="34" fill="#e8b830"/><rect x="50" y="170" width="100" height="22" rx="6" fill="#7a4a2a"/>'+
  '<rect x="34" y="190" width="132" height="34" rx="8" fill="#5a341b"/><text x="100" y="214" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="18" fill="#ffd447">'+esc(name)+'</text></svg>'}
function checkFinale(game){ // all 9 stickers, from either game: Master Plumber + the Sewer opens in Big Flow
  const p=me();if(!p||p.trophy||!BASE.every(k=>p.stickers.includes(k)))return false;
  let l=game==='flow'?Flow.level+1:p.level;while((l-1)%3)l++;
  p.trophy=true;p.sewerFrom=l;saveP();return true;
}
function addSticker(pool){
  const p=me(),k=nextSticker(pool);
  if(p){p.stickers.push(k);p.stickers=p.stickers.slice(-200);saveP()}
  return k;
}
function stickerHTML(k){return '<img src="'+stSrc(k)+'" alt="">'}
function drawShelf(){
  const p=me(),s=stickers().filter(k=>ALL_ST.includes(stBase(k))),el=$('shelf'); // old placeholder stickers are skipped
  const trophy=p&&p.trophy?'<span class="st trophy">'+trophySVG(pname(p))+'</span>':'';
  if(!s.length&&!trophy){el.innerHTML='<span class="none">Play a game to win stickers!</span>';return}
  el.innerHTML='<span class="count">⭐ '+s.length+'</span>'+trophy+[...new Set(s.slice().reverse())].map(k=>stickerSpan(k)).join('');
}

let addChar=null,armT=0;
function openParent(){addChar=null;$('parent').hidden=false;drawParent()}
function closeParent(){
  if(!PL.list.length)return; // need at least one player
  if(!me()){PL.cur=PL.list[0].id;saveP()}
  $('parent').hidden=true;
  if(current==='splash'||current==='who')show('who');else show('home');
}
function drawParent(){
  const free=Object.keys(CHARS).filter(c=>!PL.list.some(p=>p.char===c));
  if(addChar&&!free.includes(addChar))addChar=null;if(!addChar)addChar=free[0]||null;

    '<input data-name="'+p.id+'" value="'+esc(p.name)+'" placeholder="Name" maxlength="12" aria-label="Name">'+
    '<span class="meta">Level '+p.level+' · '+p.stickers.length+' stickers'+(p.trophy?' · 🏆':'')+'</span>'+
    '<button class="pbtn warn" data-reset="'+p.id+'">Start over</button><button class="pbtn" data-remove="'+p.id+'">Remove</button></div>').join('')}
  else h+='<p class="meta" style="margin-bottom:6px">Add a player to get started. Each kid gets their own level and stickers.</p>';
  if(free.length){
    h+='<h4>Add a player</h4><div class="pick">'+free.map(c=>'<button data-pick="'+c+'" class="'+(c===addChar?'on':'')+'" aria-label="'+CHARS[c]+'"><img src="'+SRC[c]+'" alt=""></button>').join('')+'</div>'+

  }
  h+='<div class="pfoot"><button class="pbtn" data-leave>Leave Kids Edition</button>'+(PL.list.length?'<button class="pbtn gold" data-done>Done</button>':'')+'</div>';

function armed(b,act){ // tap once to arm, tap again within 3s to confirm
  if(b.classList.contains('armed')){clearTimeout(armT);act();return}
  document.querySelectorAll('.pbtn.armed').forEach(x=>{x.classList.remove('armed');x.textContent=x.dataset.label});
  b.dataset.label=b.textContent;b.classList.add('armed');b.textContent='Tap again';
  clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove('armed');b.textContent=b.dataset.label},3000);

$('panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.pick){const nm=$('newName')?$('newName').value:'';addChar=b.dataset.pick;drawParent();$('newName').value=nm;return}
  if(b.hasAttribute('data-add')){const id='p'+Date.now();
    PL.list.push({id,char:addChar,name:($('newName').value||'').trim().slice(0,12),level:1,stickers:[]});if(!me())PL.cur=id;saveP();addChar=null;drawParent();return}
  if(b.dataset.reset)return armed(b,()=>{const p=PL.list.find(p=>p.id===b.dataset.reset);if(p){p.level=1;p.stickers=[];p.popRound=0;p.trophy=false;delete p.sewerFrom;saveP()}drawParent()});
  if(b.dataset.remove)return armed(b,()=>{PL.list=PL.list.filter(p=>p.id!==b.dataset.remove);if(!me())PL.cur=PL.list.length?PL.list[0].id:null;saveP();drawParent()});
  if(b.hasAttribute('data-leave')){location.href='/play';return}
  if(b.hasAttribute('data-done'))closeParent();
});
$('panel').addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.name;if(!id)return;

/* grown-ups only: hold for 3 seconds to open the grown-ups menu */
(function(){
  const b=$('grown');let t0=0,raf=0;
  const stop=()=>{t0=0;cancelAnimationFrame(raf);b.style.setProperty('--p',0)};
  const tick=now=>{if(!t0)return;const p=Math.min(1,(now-t0)/3000);b.style.setProperty('--p',p*100);
    if(p>=1){stop();openParent();return}raf=requestAnimationFrame(tick)};
  b.addEventListener('pointerdown',e=>{e.preventDefault();t0=performance.now();raf=requestAnimationFrame(tick)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('contextmenu',e=>e.preventDefault());
})();

/* ---------- canvas helper ---------- */
function fit(cv){
  const d=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=Math.round(w*d);cv.height=Math.round(h*d);
  const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return {ctx,w,h};
}
function drawImg(ctx,im,x,y,h,ang){
  if(!ready(im))return;const w=h*im.naturalWidth/im.naturalHeight;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang||0);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();
}
function wall(ctx,w,h,top,bottom){ // friendly bathroom tiles
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,top);g.addColorStop(1,bottom);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const s=Math.max(56,Math.min(w,h)/7);ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=2;
  for(let x=0;x<w;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=0;y<h;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
}

/* ================= BUBBLE POP ================= */
const Pop=(function(){
  const cv=$('popc'),GOAL=10;
  // solid glossy bubbles: [highlight, body, edge]
  const COLORS=[['#b8fbff','#19bfdc','#0a7690'],['#a8f7e6','#16b39d','#0b7365'],['#c2ddff','#3a82ea','#1c4aa3'],['#e6d2ff','#9358e6','#5b2ca0'],['#ffd2ec','#e8579f','#9e2766']];

  /* ---------- round flow ---------- */

  }

      ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(d.x-d.r*.35,d.y-d.r*.4,d.r*.35,d.r*.18,-.6,0,6.28);ctx.fill();ctx.restore();

    for(let y=0,row=0;y<wy;y+=bh,row++)for(let x=-(row%2)*bw/2;x<w;x+=bw){const v=srand();g.fillStyle=v<.33?'#3e4659':v<.66?'#465068':'#394154';rr(g,x+2,y+2,bw-4,bh-4,4);g.fill()}
    const vg=g.createRadialGradient(w/2,h*.45,Math.min(w,h)*.2,w/2,h*.45,Math.max(w,h)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=vg;g.fillRect(0,0,w,h);
    g.fillStyle='#596277';g.fillRect(0,wy-14,w,14);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,wy-14,w,3);
    const wg=g.createLinearGradient(0,wy,0,h);wg.addColorStop(0,'#2bb9d8');wg.addColorStop(1,'#0b4f68');g.fillStyle=wg;g.fillRect(0,wy,w,h-wy);
    geo.water=wy;geo.floor=wy;
    geo.pipes=[{x:w*.1,y:h*.3,r:34},{x:w*.9,y:h*.42,r:30},{x:w*.12,y:h*.68,r:28},{x:w*.88,y:h*.72,r:32}];
    for(const o of geo.pipes){g.fillStyle='#8b93a3';g.beginPath();g.arc(o.x,o.y,o.r+9,0,6.28);g.fill();g.fillStyle='#5f6779';g.beginPath();g.arc(o.x,o.y,o.r+3,0,6.28);g.fill();g.fillStyle='#07090d';g.beginPath();g.arc(o.x,o.y,o.r,0,6.28);g.fill()}
    geo.drip={x:geo.pipes[1].x,y:geo.pipes[1].y+geo.pipes[1].r};
  }
  function peekPipe(im,o,t,period,offset){ // a friend peeks out of a round pipe
    const s=((t+offset)%period)/1000;let up;
    if(s<.5)up=s/.5;else if(s<2.4)up=1;else if(s<2.9)up=1-(s-2.4)/.5;else return;
    const hgt=o.r*2.3;ctx.save();ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.28);ctx.clip();
    drawImg(ctx,im,o.x,o.y+o.r+hgt*.5-ease(up)*(hgt*.7+o.r*.5),hgt,up>=1?Math.sin(t/150)*.14:0);ctx.restore();
  }
  function setupLife(){
    seed=99;
    life={t0:performance.now(),drip:{y:null,v:0,wait:1,splash:0},bubs:[],
      worms:[0,1,2].map(k=>({x:srand()*Wd,y:Hd*(.32+k*.22),sp:(k%2?-1:1)*(14+srand()*10),len:55+srand()*30}))};
  }
  function peek(im,x,y,hgt,t,period,offset){ // a critter pops up, wiggles, and ducks back down
    const s=((t+offset)%period)/1000;let up;
    if(s<.5)up=s/.5;else if(s<2.4)up=1;else if(s<2.9)up=1-(s-2.4)/.5;else return;
    ctx.save();ctx.beginPath();ctx.rect(x-hgt,y-hgt*2,hgt*2,hgt*2);ctx.clip();
    drawImg(ctx,im,x,y+hgt*.55-ease(up)*hgt*.95,hgt,up>=1?Math.sin(t/150)*.14:0);
    ctx.restore();
  }
  function drawLife(t,dt){
    const L=life,cs=Math.max(60,cell*.7);
    if(scene==='sink'||scene==='sewer'){
      const d=L.drip,o=geo.drip;
      if(d.y===null){d.wait-=dt;const grow=Math.max(0,1-d.wait/.8);
        ctx.fillStyle='#7feaff';ctx.beginPath();ctx.arc(o.x,o.y+grow*4,2+grow*5,0,6.28);ctx.fill();
        if(d.wait<=0){d.y=o.y+4;d.v=0}}
      else{d.v+=900*dt;d.y+=d.v*dt;
        ctx.fillStyle='#7feaff';ctx.beginPath();ctx.arc(o.x,d.y,7,0,6.28);ctx.fill();
        ctx.beginPath();ctx.moveTo(o.x-6,d.y-2);ctx.lineTo(o.x,d.y-15);ctx.lineTo(o.x+6,d.y-2);ctx.fill();
        if(d.y>=geo.floor){d.y=null;d.wait=1.8+Math.random()*1.6;d.splash=1}}
      if(d.splash>0){d.splash-=dt*2;ctx.strokeStyle='rgba(127,234,255,'+Math.max(0,d.splash)+')';ctx.lineWidth=3;
        ctx.beginPath();ctx.ellipse(o.x,geo.floor+4,(1-d.splash)*44+6,(1-d.splash)*9+2,0,0,6.28);ctx.stroke()}
      if(scene==='sink'){const zx=Wd/2+Wd*.42*Math.sin(t*.00045),zy=Hd*.55+Hd*.34*Math.sin(t*.0011+1);
      drawImg(ctx,IMG.fly,zx,zy,cs*.75,Math.cos(t*.00045)*.25+Math.sin(t/60)*.05)}
    }
    if(scene==='bath'){
      if(L.bubs.length<9&&Math.random()<dt*2)L.bubs.push({x:Math.random()*Wd,y:geo.rim,r:6+Math.random()*12,sp:30+Math.random()*30,ph:Math.random()*6});
      for(const b of L.bubs){b.y-=b.sp*dt;b.ph+=dt*2;const x=b.x+Math.sin(b.ph)*12;
        ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,b.y,b.r,0,6.28);ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(x-b.r*.35,b.y-b.r*.35,b.r*.22,0,6.28);ctx.fill()}
      L.bubs=L.bubs.filter(b=>b.y>-30);
      peek(IMG.roux,Wd*.15,geo.rim+4,cs,t,6500,0);
      const dx=Wd*.85,dy=geo.rim+2;ctx.save();ctx.translate(dx,dy);ctx.rotate(Math.sin(t/450)*.1);
      ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(0,-16,32,19,0,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(18,-42,15,0,6.28);ctx.fill();
      ctx.fillStyle='#f39a1e';ctx.beginPath();ctx.ellipse(35,-39,10,5,0,0,6.28);ctx.fill();
      ctx.fillStyle='#e6b72c';ctx.beginPath();ctx.ellipse(-4,-18,15,9,-.3,0,6.28);ctx.fill();
      ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(22,-46,2.8,0,6.28);ctx.fill();ctx.restore();
    }
    if(scene==='sewer'){
      ctx.strokeStyle='rgba(170,245,255,.35)';ctx.lineWidth=3;
      for(let k=0;k<4;k++){const y=geo.water+12+k*18,off=t*.06*(k%2?1:-1);ctx.beginPath();
        for(let x=-20;x<=Wd+20;x+=16)ctx.lineTo(x,y+Math.sin((x+off)/40)*3);ctx.stroke()}
      for(let k=0;k<14;k++){const x=(k*137+t*.01*(k%3+1))%Wd,y=geo.water-30-((k*53)%120)+Math.sin(t/700+k)*8;
        ctx.globalAlpha=.3+.3*Math.sin(t/300+k*2);ctx.fillStyle='#8ff6ff';ctx.beginPath();ctx.arc(x,y,2.5,0,6.28);ctx.fill()}
      ctx.globalAlpha=1;
      peekPipe(IMG.roux,geo.pipes[0],t,7000,0);peekPipe(IMG.maggot,geo.pipes[1],t,7000,1750);
      peekPipe(IMG.fly,geo.pipes[2],t,7000,3500);peekPipe(IMG.ganja,geo.pipes[3],t,7000,5250);
    }
    if(scene==='dirt'){
      ctx.lineCap='round';ctx.lineJoin='round';
      for(const w of L.worms){
        w.x+=w.sp*dt;if(w.x>Wd+w.len)w.x=-w.len;if(w.x<-w.len)w.x=Wd+w.len;
        const dir=Math.sign(w.sp),pts=[];
        for(let k=0;k<=8;k++)pts.push([w.x-dir*k*w.len/8,w.y+Math.sin(t/220+k*.9)*5]);
        for(const [c,lw] of [['#a8485f',15],['#f39ab0',10]]){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();
          pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pts[0][0],pts[0][1]-2,4,0,6.28);ctx.fill();
        ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(pts[0][0]+dir*1.2,pts[0][1]-2,2,0,6.28);ctx.fill();
      }
      peek(IMG.maggot,geo.holes[0].x,geo.holes[0].y,cs*.85,t,7000,0);
      peek(IMG.maggot,geo.holes[1].x,geo.holes[1].y,cs*.85,t,7000,3500);
    }
  }

  /* ---------- play ---------- */
  const TITLES={sink:['Under the sink!','sceneSink'],bath:['Bath time fun!','sceneBath'],dirt:['Down in the dirt!','sceneDirt'],sewer:['Down in the sewer!','sceneSewer']};
  let intro=false,titleT=0;
  function announce(withIntro){ // big title for each new background; the how-to line only when the game opens
    const el=$('sceneTitle'),[txt,key]=TITLES[scene];el.textContent=txt;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
    clearTimeout(titleT);titleT=setTimeout(()=>sayChain(withIntro?[key,"flowIntro"]:[key]),500);
  }
  function start(){
    intro=true;level=(me()&&me().level)||1;resize();generate();running=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  }
  function stop(){running=false;cancelAnimationFrame(raf);clearTimeout(titleT)}
  function next(){level++;const p=me();if(p){p.level=level;saveP()}generate()}
  function burst(i,now){
    const cx=ox+(i%n)*cell+cell/2,cy=oy+((i/n)|0)*cell+cell/2;
    for(let k=0;k<12;k++){const a=k/12*6.28;sparks.push({x:cx,y:cy,vx:Math.cos(a)*rand(140,260),vy:Math.sin(a)*rand(140,260),life:1,c:k%2?'#ffd447':'#ffffff'})}
  }
  cv.addEventListener('pointerdown',e=>{
    if(!running||won)return;
    const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-ox)/cell),y=Math.floor((e.clientY-r.top-oy)/cell);
    if(x<0||y<0||x>=n||y>=n)return;
    const i=y*n+x,now=performance.now();
    if(!sol[i]){Snd.boop();return}
    if(pathOk(i,cur[i])){shakes[i]=now;Snd.boop();return} // already right: a little wiggle, it stays put
    cur[i]=rot(cur[i]);anims[i]=now;Snd.bloop();Snd.zoom();
    if(pathOk(i,cur[i])){locks[i]=now+120;setTimeout(()=>{Snd.chime();burst(i)},120)}
    const flowT=refreshWet(now);
    if(flowT)setTimeout(()=>Snd.gurgle(),150);
    if(wet.ok){
      won=true;wonAt=now+flowT;
      setTimeout(()=>{Snd.splash();cheer()},flowT);
      setTimeout(()=>celebrate('flow'),flowT+1900);
    }
  });

  function pipe(cx,cy,m,ang,sc,wp,ent,t){
    const w=cell*.34,r=cell/2;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.scale(sc,sc);
    const arms=(width,color,len)=>{ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
      for(const d of DIRS){if(!(m&d.b))continue;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(d.dx*r*(len||1),d.dy*r*(len||1));ctx.stroke()}};
    arms(w+12,'#2a1206');arms(w,'#f08a3c');
    if(wp>0){ // water runs in from where it came, then out the other ends
      const lw=w*.56,a=Math.min(1,wp*2),b=Math.max(0,wp*2-1);
      ctx.strokeStyle='#3ee3ff';ctx.lineWidth=lw;ctx.lineCap='round';
      for(const d of DIRS){if(!(m&d.b))continue;ctx.beginPath();
        if(d.b===ent){ctx.moveTo(d.dx*r,d.dy*r);ctx.lineTo(d.dx*r*(1-a),d.dy*r*(1-a))}
        else{if(b<=0)continue;ctx.moveTo(0,0);ctx.lineTo(d.dx*r*b,d.dy*r*b)}
        ctx.stroke()}
      if(wp>=1){ctx.setLineDash([cell*.07,cell*.15]);ctx.lineDashOffset=-t*.05;arms(lw*.32,'rgba(255,255,255,.6)',.92);ctx.setLineDash([])}
    }
    ctx.restore();
  }
  function loop(t){
    if(!running)return;
    const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
    if(bg)ctx.drawImage(bg,0,0,Wd,Hd);
    drawLife(t,dt);
    ctx.fillStyle='rgba(20,8,40,.45)';rr(ctx,ox-14,oy-14,cell*n+28,cell*n+28,28);ctx.fill();
    const tg=won?-1:target(),pu=.5+.5*Math.sin(t/170);
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      const i=y*n+x,px=ox+x*cell,py=oy+y*cell;
      const wp=(wet&&wet.f[i]&&wetAt[i]!==undefined)?Math.max(0,Math.min(1,(t-wetAt[i])/FILL)):0;
      if(i===tg){ // the glowing pipe to tap
        for(let k=3;k>=1;k--){ctx.fillStyle='rgba(255,212,71,'+(.14+.14*pu)+')';const g=k*5+pu*6;rr(ctx,px+5-g,py+5-g,cell-10+g*2,cell-10+g*2,cell*.2+g);ctx.fill()}
      }
      ctx.fillStyle=!sol[i]?'rgba(255,255,255,.05)':i===tg?'#6b5418':wp>0?'#1b4a5a':'#3b2a52';
      rr(ctx,px+5,py+5,cell-10,cell-10,cell*.18);ctx.fill();
      if(i===tg){ctx.strokeStyle='rgba(255,212,71,'+(.55+.45*pu)+')';ctx.lineWidth=5;ctx.stroke()}
      if(!sol[i])continue;
      let a=0,sc=i===tg?1+pu*.05:1;
      const an=anims[i];if(an){const p=Math.min(1,(t-an)/180);a=-Math.PI/2*(1-ease(p));if(p>=1)delete anims[i]}
      const sh=shakes[i];if(sh){const p=Math.min(1,(t-sh)/320);a+=Math.sin(p*22)*.1*(1-p);if(p>=1)delete shakes[i]}
      const lk=locks[i];if(lk&&t>=lk){const p=Math.min(1,(t-lk)/300);sc*=1+.16*Math.sin(p*Math.PI);if(p>=1)delete locks[i]}
      pipe(px+cell/2,py+cell/2,cur[i],a,sc,wp,wet?wet.ent[i]:0,t);
    }
    // valve on the left
    const vy=oy+sr*cell+cell/2,vx=ox-cell*.45;
    ctx.lineCap='round';ctx.strokeStyle='#2a1206';ctx.lineWidth=cell*.36;ctx.beginPath();ctx.moveTo(vx,vy);ctx.lineTo(ox+2,vy);ctx.stroke();
    ctx.strokeStyle='#3ee3ff';ctx.lineWidth=cell*.18;ctx.stroke();
    ctx.save();ctx.translate(vx,vy);ctx.rotate(won?t*.006:0);ctx.strokeStyle='#e8281e';ctx.lineWidth=cell*.07;
    ctx.beginPath();ctx.arc(0,0,cell*.24,0,6.28);ctx.stroke();for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(cell*.24,0);ctx.stroke()}ctx.restore();
    // Ganja waiting at the drain on the right
    const gy=oy+er*cell+cell/2,gx=ox+cell*n+cell*.42,splashed=won&&t>=wonAt;
    ctx.strokeStyle='#2a1206';ctx.lineWidth=cell*.36;ctx.beginPath();ctx.moveTo(ox+cell*n-2,gy);ctx.lineTo(gx,gy);ctx.stroke();
    if(splashed){ctx.strokeStyle='#3ee3ff';ctx.lineWidth=cell*.18;ctx.stroke()}
    ctx.fillStyle='#0c0620';ctx.beginPath();ctx.arc(gx,gy,cell*.2,0,6.28);ctx.fill();ctx.strokeStyle='#c9c3d6';ctx.lineWidth=4;ctx.stroke();
    if(!splashed)drawImg(ctx,IMG.ganja,gx,gy-cell*.28,cell*.9,Math.sin(t/300)*.08);
    else{const e=t-wonAt;drawImg(ctx,ready(IMG.ganjaJump)?IMG.ganjaJump:IMG.ganja,gx,gy-cell*.32-Math.abs(Math.sin(e/240))*cell*.55,cell*.95,Math.sin(e/120)*.08)} // happy bouncing
    // sparkles when a pipe clicks into place
    for(const s of sparks){s.life-=dt*1.8;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.92;s.vy*=.92;
      ctx.globalAlpha=Math.max(0,s.life);ctx.fillStyle=s.c;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(t/200);
      const z=7*s.life+3;ctx.beginPath();ctx.moveTo(0,-z);ctx.lineTo(z*.35,0);ctx.lineTo(0,z);ctx.lineTo(-z*.35,0);ctx.closePath();ctx.fill();ctx.restore()}
    ctx.globalAlpha=1;sparks=sparks.filter(s=>s.life>0);
    raf=requestAnimationFrame(loop);
  }
  window.addEventListener('resize',()=>{if(running)resize()});
  return {start,stop,next,get level(){return level},sceneOf:sceneFor};
})();

/* ================= CELEBRATION ================= */
let lastGame='pop',confettiRaf=0;
function celebrate(game){
  lastGame=game;const p=me();
  const n=game==='flow'?Flow.level:((p&&p.popRound)||1);           // Flow levels / Pop rounds
  const pool=game==='flow'?STICKERS[Flow.sceneOf(n)]:popPool();
  const earn=n%3===0;                                                // a sticker every 3
  $('got').hidden=!earn;$('prog').hidden=earn;
  let k=null,fin=false;
  if(earn){k=addSticker(pool);$('newSticker').innerHTML=stickerHTML(k);$('newSticker').className='st'+(isGold(k)?' gold':'');fin=checkFinale(game)}
  else{const d=n%3,nx=nextSticker(pool);
    $('prog').innerHTML=[1,2,3].map(i=>'<i class="'+(i<=d?'on':'')+(i===d?' now':'')+'"></i>').join('')+'<span class="'+(isGold(nx)?'gold':'')+'">'+stickerHTML(nx)+'</span>'}
  $('againTxt').textContent=game==='flow'?'Next':'Again';
  $('yay').hidden=false;Snd.cheer();
  const stLine=()=>say(isGold(k)?'gold':pick(STICKER_LINES),true);
  if(game==='flow'){if(earn)setTimeout(stLine,700)}                  // Flow already cheered at the splash
  else{cheer();if(earn)setTimeout(stLine,1500)}
  confetti();
  if(fin)setTimeout(showFinale,3200);
}
function showFinale(){
  if($('yay').hidden)return;const p=me();
  $('finTrophy').innerHTML=trophySVG(p?pname(p):'');$('finale').hidden=false;
  Snd.cheer();say('master',true);confetti();
}
$('finOk').addEventListener('click',()=>{$('finale').hidden=true});
$('again').addEventListener('click',()=>{
  $('yay').hidden=true;$('finale').hidden=true;cancelAnimationFrame(confettiRaf);
  if(lastGame==='flow')Flow.next();else Pop.next();
});
function confetti(){
  const cv=$('confetti'),f=fit(cv),c=f.ctx,colors=['#3ee3ff','#ffd447','#e5894a','#ff7bc8','#8fe36b','#fff4df'];
  const ps=Array.from({length:reduced?30:140},()=>({x:rand(0,f.w),y:rand(-f.h,0),vx:rand(-40,40),vy:rand(120,260),r:rand(0,6.28),vr:rand(-6,6),s:rand(8,16),c:pick(colors)}));
  let last=performance.now();const t0=last;
  cancelAnimationFrame(confettiRaf);
  (function step(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;c.clearRect(0,0,f.w,f.h);
    for(const p of ps){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
      c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()}
    if(now-t0<4000)confettiRaf=requestAnimationFrame(step);else c.clearRect(0,0,f.w,f.h);
  })(last);
}

show('splash');
window.__kids={Pop,Flow,show,celebrate,BUF};
})();
</script>
