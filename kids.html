<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pipe Mojo Kids Edition</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2b1559">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mojo Kids">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/kids-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/kids-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#2b1559;   /* basement purple, lighter than the main site */
  --deep:#170a33;
  --water:#3ee3ff;   /* bath water */
  --brass:#ffd447;   /* fittings and stars */
  --copper:#e5894a;
  --cream:#fff4df;
  --kid:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  --brand:'Pirata One',Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--kid);color:var(--cream);background:var(--deep);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--brass);outline-offset:4px;border-radius:20px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.screen[hidden]{display:none}

/* ---------- home ---------- */
#home{
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(62,227,255,.22) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 105%, rgba(255,212,71,.16) 0%, transparent 70%),
    linear-gradient(180deg,var(--night),var(--deep));
  align-items:center;justify-content:space-between;
}
.brand{text-align:center;margin-top:clamp(14px,4vh,40px)}
.brand img{width:clamp(56px,10vh,96px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.brand h1{font-family:var(--brand);font-weight:400;line-height:.9;color:var(--brass);
  font-size:clamp(2.4rem,7.5vh,4.6rem);text-shadow:0 4px 0 #6b3a12,0 0 28px rgba(255,212,71,.35)}
.brand h1 small{display:block;font-family:var(--kid);font-weight:700;font-size:.42em;color:var(--water);
  letter-spacing:.04em;text-shadow:0 3px 0 #0b4b5c;margin-top:.15em}
.games{display:flex;gap:clamp(14px,3vw,34px);padding:0 18px;width:100%;max-width:980px;justify-content:center;flex:1;align-items:center}
@media (orientation:portrait){.games{flex-direction:column}}
@media (orientation:landscape){.games .game{min-height:min(46vh,380px)}}
.game{position:relative;flex:1;max-width:420px;width:100%;min-height:clamp(150px,26vh,320px);border-radius:34px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:14px 14px 18px;overflow:hidden;
  box-shadow:0 10px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.25);transition:transform .12s}
.game:active{transform:translateY(6px) scale(.98);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.25)}
.game.pop{background:radial-gradient(circle at 30% 25%,#7ff1ff 0%,#1fb6d6 55%,#0f7f9e 100%)}
.game.flow{background:radial-gradient(circle at 30% 25%,#ffb27a 0%,#d9692b 55%,#9c4317 100%)}
.game img{position:absolute;bottom:56px;height:68%;width:auto;max-width:70%;object-fit:contain;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.game .label{position:relative;font-weight:700;font-size:clamp(1.6rem,4.4vh,2.4rem);background:rgba(23,10,51,.82);
  padding:.15em .8em;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.game .b{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,255,255,.08) 60%)}
.shelf{width:100%;max-width:980px;padding:0 18px 28px;display:flex;align-items:center;gap:12px}
.stickers{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden;min-height:64px;
  background:rgba(255,255,255,.07);border-radius:24px;padding:8px 14px}
.stickers .count{font-weight:700;font-size:1.25rem;color:var(--brass);white-space:nowrap;margin-right:4px}
.stickers .st{width:52px;height:56px;flex:none;display:block}
.stickers .st img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.stickers .none{font-weight:600;color:rgba(255,244,223,.75)}
.grown{position:relative;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--brass) calc(var(--p,0)*1%),rgba(255,255,255,.12) 0);opacity:.75}
.grown span{position:absolute;inset:5px;border-radius:50%;background:var(--deep);display:grid;place-items:center}
.grown svg{width:26px;height:26px}
.grown em{position:absolute;bottom:-18px;font-style:normal;font-size:.7rem;white-space:nowrap;color:rgba(255,244,223,.6)}

/* ---------- gold stickers, trophy, finale ---------- */
.st.gold{position:relative}
.stickers .st.gold img,#yay .got .st.gold img,#yay .prog .gold img{filter:drop-shadow(0 0 4px #ffe680) drop-shadow(0 0 10px #ffb300)}
.st.gold::after{content:'✦';position:absolute;right:-4px;top:-6px;color:#ffd447;font-size:1.2rem;text-shadow:0 0 6px #fff3b8}
#yay .got .st.gold::after{font-size:2.6rem}
.stickers .st.trophy svg{width:100%;height:100%;display:block}
#finale{z-index:15;background:rgba(23,10,51,.88);align-items:center;justify-content:center;text-align:center}
#finale .fin{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}
#finale h2{font-weight:700;font-size:clamp(2.6rem,8vh,4.6rem);color:var(--brass);text-shadow:0 5px 0 #6b3a12}
#finale .trophy svg{height:clamp(150px,28vh,260px);width:auto;animation:spinIn .9s cubic-bezier(.2,1.5,.4,1);filter:drop-shadow(0 0 22px rgba(255,212,71,.6))}
.finCrew{display:flex;gap:6px;align-items:flex-end}
.finCrew img{height:clamp(60px,11vh,110px);width:auto;animation:bounce .6s ease-in-out infinite alternate}
.finCrew img:nth-child(2){animation-delay:.15s}.finCrew img:nth-child(3){animation-delay:.3s;height:clamp(80px,14vh,140px)}.finCrew img:nth-child(4){animation-delay:.45s}.finCrew img:nth-child(5){animation-delay:.6s}
#finale .unlock{font-weight:700;font-size:1.2rem;color:var(--water)}
@media (prefers-reduced-motion:reduce){.finCrew img,#finale .trophy svg{animation:none}}

/* ---------- start, players, parent menu ---------- */
#splash,#who{
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(62,227,255,.22) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 105%, rgba(255,212,71,.16) 0%, transparent 70%),
    linear-gradient(180deg,var(--night),var(--deep));
  align-items:center;justify-content:center;gap:clamp(12px,3vh,30px);text-align:center}
#splash .hero{height:clamp(200px,42vh,420px);width:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));animation:bounce 1.1s ease-in-out infinite alternate}
#splash .tap{font-weight:700;font-size:clamp(1.6rem,4.4vh,2.4rem);background:var(--water);color:#062a33;padding:.35em 1.2em;border-radius:999px;box-shadow:0 7px 0 #138aa1;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#who h2{font-weight:700;font-size:clamp(2.2rem,6.5vh,3.6rem);color:var(--brass);text-shadow:0 4px 0 #6b3a12}
.whoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.5vw,22px);width:min(92vw,660px)}
.whoGrid.one{grid-template-columns:minmax(0,320px);justify-content:center}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;border-radius:30px;
  box-shadow:0 8px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.25)}
.pl:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pl img{height:clamp(110px,19vh,200px);width:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.pl b{font-weight:700;font-size:clamp(1.4rem,3.6vh,2.1rem);background:rgba(23,10,51,.82);padding:.1em .7em;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-ganja{background:radial-gradient(circle at 30% 25%,#ffc28f,#d9692b 60%,#9c4317)}
.c-fly{background:radial-gradient(circle at 30% 25%,#9fc2ff,#3d6fd6 60%,#1f3f8f)}
.c-roux{background:radial-gradient(circle at 30% 25%,#ffa08f,#e8473e 60%,#9c1f17)}
.c-maggot{background:radial-gradient(circle at 30% 25%,#e9d8ff,#a985d6 60%,#6b4a9c)}
.chip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);z-index:2;display:flex;align-items:center;gap:8px;
  padding:5px 16px 5px 5px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:700;font-size:1.25rem;max-width:46vw}
.chip img{width:54px;height:54px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,.14)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#parent{z-index:20;background:rgba(10,4,24,.88);align-items:center;justify-content:center;padding:20px}
#parent .panel{width:min(94vw,620px);max-height:calc(100% - 20px);overflow:auto;background:#2b1559;border-radius:26px;padding:20px;box-shadow:0 12px 0 rgba(0,0,0,.4);text-align:left}
#parent h3{font-weight:700;font-size:1.5rem;color:var(--brass);margin:4px 0 12px}
#parent h4{font-weight:700;font-size:1.15rem;margin:18px 0 8px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border-radius:18px;background:rgba(255,255,255,.07);margin-bottom:10px}
.prow img{width:52px;height:52px;object-fit:contain}
.prow .meta{font-size:.95rem;color:rgba(255,244,223,.75);flex:1;min-width:110px}
#parent input{font:inherit;font-size:1.15rem;color:#170a33;background:var(--cream);border:0;border-radius:12px;padding:8px 12px;width:150px;
  -webkit-user-select:text;user-select:text}
.pbtn{font-weight:700;font-size:1rem;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.14)}
.pbtn.warn{background:#a8322a}
.pbtn.armed{background:#ff5a4a;color:#fff}
.pbtn.go{background:var(--water);color:#062a33}
.pbtn.gold{background:var(--brass);color:#3a2506}
.pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pick button{width:76px;height:76px;border-radius:18px;background:rgba(255,255,255,.08);border:3px solid transparent;padding:4px}
.pick button img{width:100%;height:100%;object-fit:contain}
.pick button.on{border-color:var(--brass);background:rgba(255,212,71,.18)}
.pfoot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.swap{position:relative;width:60px;height:60px;flex:none;border-radius:16px;background:rgba(255,255,255,.12);padding:4px}
.swap img{width:100%;height:100%}
.swap::after{content:'⇄';position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--brass);color:#3a2506;font-size:.9rem;font-weight:700;display:grid;place-items:center}
.swap.wig{animation:wig .4s}
.pcode{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
#parent textarea{display:block;width:100%;min-height:70px;font:inherit;font-size:.85rem;color:#170a33;background:var(--cream);border:0;border-radius:12px;padding:8px 10px;margin-bottom:8px;
  -webkit-user-select:text;user-select:text;word-break:break-all}
#parent textarea[hidden],#restoreBox[hidden]{display:none}
#restoreBox{margin-bottom:6px}
#restoreBox .meta{display:block;margin-top:6px}

/* ---------- game screens ---------- */
.play{background:var(--deep)}
.play canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 14px;pointer-events:none}
.bar>*{pointer-events:auto}
.homeBtn{width:72px;height:72px;border-radius:24px;background:var(--brass);display:grid;place-items:center;flex:none;
  box-shadow:0 6px 0 #a3741a}
.homeBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a3741a}
.homeBtn svg{width:40px;height:40px}
.dots{display:flex;flex-wrap:wrap;gap:6px;background:rgba(23,10,51,.6);padding:8px 12px;border-radius:999px;max-width:calc(100% - 100px)}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);transition:background .2s,transform .2s}
.dots i.on{background:var(--water);transform:scale(1.15);box-shadow:0 0 8px var(--water)}
.lvl{font-weight:700;font-size:1.5rem;background:rgba(23,10,51,.6);padding:8px 18px;border-radius:999px;color:var(--brass)}

/* ---------- celebration ---------- */
#yay{z-index:10;background:rgba(23,10,51,.72);align-items:center;justify-content:center;text-align:center}
#yay canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#yay .card{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}
#yay .mojo{height:clamp(140px,30vh,280px);width:auto;animation:bounce 1s ease-in-out infinite alternate;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
@keyframes bounce{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-16px) rotate(3deg)}}
#yay h2{font-weight:700;font-size:clamp(2.6rem,8vh,4.4rem);color:var(--brass);text-shadow:0 5px 0 #6b3a12}
#yay .got{display:flex;align-items:center;gap:12px;font-weight:600;font-size:1.4rem}
#yay .got{flex-direction:column;gap:4px}
#yay .got .st{width:clamp(130px,24vh,200px);height:clamp(130px,24vh,200px);display:block;animation:spinIn .7s cubic-bezier(.2,1.5,.4,1)}
#yay .got .st img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
#yay .got[hidden],#yay .prog[hidden]{display:none}
#yay .prog{display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.1)}
#yay .prog i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.35)}
#yay .prog i.on{background:var(--brass);border-color:#fff3b8;box-shadow:0 0 12px rgba(255,212,71,.7)}
#yay .prog i.now{animation:dotIn .6s cubic-bezier(.2,1.6,.4,1)}
#yay .prog img{height:52px;width:auto;opacity:.45;filter:grayscale(.6)}
@keyframes dotIn{from{transform:scale(0)}to{transform:scale(1)}}
.sceneTitle{position:absolute;left:50%;top:40%;z-index:3;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;
  font-weight:700;font-size:clamp(2.4rem,7vh,4.2rem);color:var(--brass);background:rgba(23,10,51,.82);padding:.2em .8em;border-radius:999px;
  text-shadow:0 4px 0 #6b3a12;box-shadow:0 8px 0 rgba(0,0,0,.3);opacity:0}
.sceneTitle.show{animation:titleIn 2.6s ease forwards}
@keyframes titleIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
@keyframes spinIn{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
.choices{display:flex;gap:16px;margin-top:10px}
.big{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.6rem;padding:16px 26px;border-radius:28px;min-height:84px;
  background:var(--water);color:#062a33;box-shadow:0 7px 0 #138aa1}
.big.alt{background:var(--brass);color:#3a2506;box-shadow:0 7px 0 #a3741a}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.big svg{width:36px;height:36px}
@media (prefers-reduced-motion:reduce){#yay .mojo,#yay .got .st,#yay .prog i.now{animation:none}}

/* ---------- Pop & Build card, sticker book button, holiday badge ---------- */
.game.build{background:radial-gradient(circle at 30% 25%,#c8f58a 0%,#5bbf4a 55%,#2f7d27 100%)}
.game .bal{position:absolute;top:9%;right:13%;width:46px;height:56px;border-radius:50% 50% 47% 47%;
  background:radial-gradient(circle at 35% 30%,#ffd2ec,#e8579f 60%,#9e2766);box-shadow:inset -5px -7px 0 rgba(0,0,0,.12)}
.game .bal::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:42px;background:rgba(255,255,255,.85);transform:translateX(-50%)}
.games .game .label{white-space:nowrap;font-size:clamp(1.3rem,3.9vh,2.2rem)}
@media (orientation:landscape) and (max-height:500px){#home .brand img{display:none}#home .brand{margin-top:8px}.games .game{min-height:min(40vh,300px)}}
@media (orientation:portrait){.games .game{min-height:clamp(120px,18.5vh,240px)}.games .game img{height:74%;bottom:50px}}
.bookBtn{width:72px;height:72px;flex:none;border-radius:22px;background:var(--brass);display:grid;place-items:center;box-shadow:0 6px 0 #a3741a}
.bookBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a3741a}
.bookBtn svg{width:46px;height:46px}
.stickers{cursor:pointer}
.holi{display:inline-block;margin-top:8px;font-weight:700;font-size:clamp(1rem,2.6vh,1.35rem);color:var(--cream);
  background:rgba(255,255,255,.13);padding:.15em .9em;border-radius:999px}
.holi[hidden]{display:none}
.hols{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.hols .pbtn.on{background:var(--brass);color:#3a2506}

/* ---------- sticker book ---------- */
#book{background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(62,227,255,.22) 0%, transparent 70%),
    linear-gradient(180deg,var(--night),var(--deep));align-items:center}
.bookTop{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px}
.bookTop h2{flex:1;min-width:0;font-weight:700;font-size:clamp(1.5rem,4.6vh,2.5rem);color:var(--brass);text-shadow:0 4px 0 #6b3a12;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookTrophy{width:72px;height:72px;flex:none}
.bookTrophy svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px rgba(255,212,71,.55))}
.bookBody{flex:1;min-height:0;width:100%;display:flex;align-items:center;gap:10px;padding:0 10px}
.pgBtn{width:72px;height:72px;flex:none;border-radius:50%;background:var(--water);display:grid;place-items:center;box-shadow:0 6px 0 #138aa1}
.pgBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #138aa1}
.pgBtn:disabled{opacity:.25}
.pgBtn svg{width:38px;height:38px}
.page{position:relative;flex:1;height:100%;max-height:820px;min-width:0;background:var(--cream);color:#2b1559;border-radius:30px;
  box-shadow:0 10px 0 rgba(0,0,0,.35);padding:clamp(14px,2.6vh,28px);display:flex;flex-direction:column;align-items:center;
  gap:clamp(6px,1.6vh,16px);overflow:hidden;touch-action:none}
.page::before{content:'';position:absolute;inset:10px;border:3px dashed rgba(43,21,89,.16);border-radius:22px;pointer-events:none}
.page h3{font-weight:700;font-size:clamp(1.4rem,4vh,2.2rem);color:#6b3a12}
.page.in-l{animation:pgL .35s ease}.page.in-r{animation:pgR .35s ease}
@keyframes pgL{from{transform:translateX(-50px);opacity:0}}
@keyframes pgR{from{transform:translateX(50px);opacity:0}}
.sgrid{flex:1;min-height:0;width:100%;display:grid;gap:clamp(8px,2.2vw,24px);align-items:center;justify-items:center}
.sgrid.three{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.sgrid.six{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
@media (orientation:portrait){
  .sgrid.three{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
  .sgrid.six{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}}
.cell{position:relative;width:100%;height:100%;max-width:250px;max-height:250px;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;border-radius:24px}
.cell .st{position:relative;width:100%;flex:1;min-height:0;display:block}
.cell .st img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 6px rgba(43,21,89,.35))}
.cell .st.gold img{filter:drop-shadow(0 0 4px #ffe680) drop-shadow(0 0 12px #ffb300)}
.cell.locked .st img{filter:brightness(0);opacity:.15}
.cell.locked .st::before{content:'?';position:absolute;inset:0;display:grid;place-items:center;z-index:1;
  font-weight:700;font-size:clamp(2.4rem,7vh,4rem);color:rgba(43,21,89,.42)}
.cell.missing .st img{visibility:hidden}
.cell.missing .st::after{content:'';position:absolute;left:50%;top:12%;height:76%;aspect-ratio:1;transform:translateX(-50%);border:4px dashed rgba(43,21,89,.22);border-radius:50%}
.cell small{font-weight:700;font-size:.95rem;color:#6b3a12;white-space:nowrap}
.cell.wig{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.pgDots{display:flex;gap:10px;padding:14px 0 18px}
.pgDots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.22)}
.pgDots i.on{background:var(--brass);box-shadow:0 0 8px rgba(255,212,71,.7)}
#zoom{position:fixed;inset:0;z-index:30;background:rgba(10,4,24,.84);display:grid;place-items:center}
#zoom[hidden]{display:none}
.zin{position:relative;width:min(80vw,68vh);height:min(80vw,68vh);animation:spinIn .6s cubic-bezier(.2,1.5,.4,1)}
.zin>img,.zin>svg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
.zin.gold>img{filter:drop-shadow(0 0 8px #ffe680) drop-shadow(0 0 26px #ffb300)}
.zin i{position:absolute;left:50%;top:50%;font-style:normal;color:#ffd447;font-size:2.6rem;text-shadow:0 0 10px #fff3b8;
  animation:spark 1.2s ease-out forwards;pointer-events:none}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.zin,.zin i,.page.in-l,.page.in-r,.cell.wig{animation:none}}
.game.color{background:radial-gradient(circle at 30% 25%,#ffc4e6 0%,#e8579f 55%,#9e2766 100%)}
.game .sp{position:absolute;width:26px;height:26px;border-radius:50%;box-shadow:inset -3px -4px 0 rgba(0,0,0,.15)}
#home .games{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(12px,2.2vw,24px);
  flex:1;min-height:0;width:100%;max-width:1060px;padding:12px 18px;align-items:stretch}
#home .games .game{max-width:none;min-height:0;height:100%;grid-column:span 2}
#home .games .game:nth-child(4){grid-column:2/span 2}
#home .games .game img{height:70%;bottom:50px}
#home .games .game.truck img{height:auto;width:86%;max-width:86%;max-height:56%;bottom:74px}
@media (orientation:portrait){#home .games{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));max-width:720px}
  #home .games .game:nth-child(4){grid-column:span 2}#home .games .game:nth-child(5){grid-column:2/span 2}}
@media (orientation:landscape) and (max-height:500px){#home .games{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:minmax(0,1fr);max-width:none}
  #home .games .game,#home .games .game:nth-child(4){grid-column:auto}}
#truckTitle{top:20%}
.game.truck{background:radial-gradient(circle at 30% 25%,#fff3a6 0%,#ffc21f 55%,#c98a0a 100%)}
.game .road{position:absolute;left:0;right:0;bottom:66px;height:14px;background:#4f535e;
  background-image:repeating-linear-gradient(90deg,#ffd447 0 26px,transparent 26px 52px);background-size:100% 4px;background-position:0 6px;background-repeat:no-repeat}
.welcome{font-weight:700;font-size:1.2rem;color:var(--water);margin:0 0 4px}
</style>

<script>
(function(){
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- art (already on the site) ---------- */
const IMG={};
// Kids Edition has its own flat 2D cast (the main-site games keep the 3D renders)
const SRC={mojo:'/assets/kid-mojo-wave.png',mojoCheer:'/assets/kid-mojo-cheer.png',ganja:'/assets/kid-ganja.png',ganjaJump:'/assets/kid-ganja-jump.png',
  roux:'/assets/kid-roux.png',fly:'/assets/kid-zydeco.png',maggot:'/assets/kid-beignet.png'};
for(const k in SRC){const im=new Image();im.src=SRC[k];IMG[k]=im}
const ready=im=>im&&im.complete&&im.naturalWidth>0;
const CREW=['ganja','fly','maggot','roux'];
// stickers: 3 per background, earned every 3 Flow levels (Bubble Pop rounds give a random one)
const STICKERS={sink:['s01','s02','s03'],bath:['s04','s05','s06'],dirt:['s07','s08','s09'],sewer:['s10','s11','s12']};
const BASE=[].concat(STICKERS.sink,STICKERS.bath,STICKERS.dirt);   // all 9 = Master Plumber
const ALL_ST=BASE.concat(STICKERS.sewer);
const stBase=k=>k.replace(/g$/,''),isGold=k=>/g$/.test(k);         // 's04g' = gold version of s04
const stSrc=k=>HOL_BY_ST[k]?'/assets/sticker-'+HOL_BY_ST[k].file+'.png':'/assets/sticker-'+stBase(k).slice(1)+'.png';

/* ---------- holidays: each one runs for its month (by the iPad's date) ----------
   Decorations are drawn in code. Costume Mojo (kid-mojo-cheer-<holiday>.png) and the holiday sticker
   (sticker-<holiday>.png) are optional: drop them in /assets/ and they show up; until then that month just
   gets the decorations. */
const BC={orange:['#ffe0b8','#ff8a1f','#b4500a'],purple:['#e6d2ff','#9358e6','#5b2ca0'],lime:['#eaffc2','#7ed321','#3f7a0d'],
  night:['#cdb6ee','#4b2a7a','#22103d'],red:['#ffc9c4','#e8392e','#9c1f17'],silver:['#ffffff','#d6dde8','#8a96a8'],
  blue:['#c2ddff','#3a82ea','#1c4aa3'],gold:['#fff3b8','#ffc21f','#a3741a'],green:['#c9f5d2','#2fa84f','#17662c'],brown:['#f2cfa8','#a0642f','#5e3615']};
const HOL={
  newyear:{m:0,short:'New Year',name:'Happy New Year!',em:'🎉',st:'h01',file:'newyear',bunt:['#ffd447','#e9eef5','#9358e6','#3a82ea'],
    bub:[BC.gold,BC.silver,BC.purple,BC.blue],conf:['#ffd447','#fff3b8','#e9eef5','#c49bff'],bal:BC.gold,decal:'star',fx:'fireworks',fxc:['#ffd447','#fff3b8','#e9eef5','#c49bff']},
  mardigras:{m:1,short:'Mardi Gras',name:'Happy Mardi Gras!',em:'🎭',st:'h02',file:'mardigras',bunt:['#7b3fc4','#2fa84f','#ffd447'],
    bub:[BC.purple,BC.green,BC.gold],conf:['#9358e6','#2fa84f','#ffd447'],bal:BC.purple,decal:'diamond',fx:'confetti',fxc:['#9358e6','#2fa84f','#ffd447']},
  july4:{m:6,short:'July 4th',name:'Happy 4th of July!',em:'🎆',st:'h03',file:'july4',bunt:['#e8392e','#ffffff','#2f5fd0'],
    bub:[BC.red,BC.silver,BC.blue],conf:['#e8392e','#ffffff','#3a82ea'],bal:BC.blue,decal:'star',fx:'fireworks',fxc:['#ff4a3d','#ffffff','#5fa0ff']},
  halloween:{m:9,short:'Halloween',name:'Happy Halloween!',em:'🎃',st:'h04',file:'halloween',bunt:['#ff8a1f','#6b3fb0','#2a1a3a'],
    bub:[BC.orange,BC.purple,BC.lime,BC.night],conf:['#ff8a1f','#9358e6','#7ed321','#2a1a3a'],bal:BC.orange,decal:'pumpkin',fx:'bats'},
  thanksgiving:{m:10,short:'Thanksgiving',name:'Happy Thanksgiving!',em:'🦃',st:'h05',file:'thanksgiving',bunt:['#e8762a','#a0642f','#ffc21f','#c0392b'],
    bub:[BC.orange,BC.red,BC.gold,BC.brown],conf:['#e8762a','#c0392b','#ffc21f','#a0642f'],bal:BC.orange,decal:'leaf',fx:'leaves'},
  christmas:{m:11,short:'Christmas',name:'Merry Christmas!',em:'🎄',st:'h06',file:'christmas',bunt:'lights',lights:['#e8392e','#2fa84f','#ffd447','#3a82ea'],
    bub:[BC.red,BC.green,BC.gold,BC.silver],conf:['#e8392e','#2fa84f','#ffd447','#ffffff'],bal:BC.red,decal:'flake',fx:'snow'}
};
const HOL_ORDER=['newyear','mardigras','july4','halloween','thanksgiving','christmas'];
const HOL_BY_ST={};for(const k in HOL){HOL[k].key=k;HOL_BY_ST[HOL[k].st]=HOL[k]}
const HOL_KEYS=HOL_ORDER.map(k=>HOL[k].st);
const knownSticker=k=>ALL_ST.includes(stBase(k))||!!HOL_BY_ST[k];
function autoKey(){const m=new Date().getMonth();return HOL_ORDER.find(k=>HOL[k].m===m)||null}
let holPreview=null;                 // grown-ups preview: null = by the date, 'off', or a holiday
function theme(){const k=holPreview===null?autoKey():holPreview==='off'?null:holPreview;return k?HOL[k]:null}
function realTheme(){const k=autoKey();return k?HOL[k]:null}   // holiday stickers only in the real month
const HART={};
function holArt(h){
  if(!HART[h.key]){const a={mojo:new Image(),st:new Image()};a.mojo.src='/assets/kid-mojo-cheer-'+h.key+'.png';a.st.src=stSrc(h.st);HART[h.key]=a}
  return HART[h.key];
}
{const h=theme();if(h)holArt(h)}
function drawHoli(){const h=theme();for(const id of ['holi','holiS']){const el=$(id);el.hidden=!h;el.textContent=h?h.em+' '+h.name+' '+h.em:''}}

/* painted once into a background: bunting (or lights) across the top, plus a few props when there's a floor */
function jack(g,x,y,r,face){
  g.fillStyle='#3f7a0d';g.fillRect(x-r*.1,y-r*1.95,r*.2,r*.35);
  for(const [dx,c] of [[-.45,'#e8701a'],[.45,'#e8701a'],[0,'#ff8a1f']]){g.fillStyle=c;g.beginPath();g.ellipse(x+dx*r,y-r*.85,r*.62,r*.85,0,0,6.28);g.fill()}
  g.strokeStyle='rgba(150,60,0,.45)';g.lineWidth=2;for(const dx of [-.35,.35]){g.beginPath();g.ellipse(x+dx*r,y-r*.85,r*.25,r*.8,0,0,6.28);g.stroke()}
  if(!face)return;g.fillStyle='#ffd447';
  for(const s of [-1,1]){g.beginPath();g.moveTo(x+s*r*.45,y-r*1.15);g.lineTo(x+s*r*.15,y-r*.95);g.lineTo(x+s*r*.6,y-r*.92);g.closePath();g.fill()}
  g.beginPath();g.moveTo(x-r*.6,y-r*.65);for(let k=0;k<=6;k++)g.lineTo(x-r*.6+k*r*.2,y-r*(k%2?.55:.68));g.lineTo(x+r*.6,y-r*.65);
  g.quadraticCurveTo(x,y-r*.1,x-r*.6,y-r*.65);g.fill();
}
function gift(g,x,y,s,c){
  g.fillStyle=c;g.fillRect(x-s/2,y-s,s,s);g.fillStyle='#ffd447';g.fillRect(x-s*.08,y-s,s*.16,s);g.fillRect(x-s/2,y-s*.58,s,s*.14);
  g.strokeStyle='#ffd447';g.lineWidth=s*.09;g.beginPath();g.ellipse(x-s*.16,y-s*1.08,s*.17,s*.1,-.4,0,6.28);g.ellipse(x+s*.16,y-s*1.08,s*.17,s*.1,.4,0,6.28);g.stroke();
}
function paintHoliday(g,w,h,o){
  const H_=theme();if(!H_)return;o=o||{};
  const sp=Math.max(180,w/5),yAt=x=>4+Math.sin(Math.PI*((x%sp)/sp))*20;
  g.lineWidth=3;g.strokeStyle=H_.bunt==='lights'?'#1f3b2a':'rgba(255,244,223,.85)';g.beginPath();
  for(let x=0;x<=w;x+=6)x?g.lineTo(x,yAt(x)):g.moveTo(x,yAt(x));g.stroke();
  if(H_.bunt==='lights'){
    let i=0;for(let x=18;x<w;x+=36,i++){const y=yAt(x);g.fillStyle='#55606e';g.fillRect(x-4,y,8,7);
      g.fillStyle=H_.lights[i%H_.lights.length];g.beginPath();g.ellipse(x,y+17,8,12,0,0,6.28);g.fill();
      g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(x-3,y+13,2.5,4,0,0,6.28);g.fill()}
  }else{
    let i=0;for(let x=24;x<w;x+=46,i++){const y=yAt(x);g.fillStyle=H_.bunt[i%H_.bunt.length];
      g.beginPath();g.moveTo(x-17,y);g.lineTo(x+17,y);g.lineTo(x,y+32);g.closePath();g.fill();
      g.strokeStyle='rgba(0,0,0,.15)';g.lineWidth=2;g.stroke()}
  }

/* a little holiday life on top of each game: bats, snow, leaves, fireworks or confetti */
function HolFx(){
  let kind=null,ps=[],nextB=0,lw=0,lh=0;
  function init(h,w,H){
    kind=h?h.fx:null;ps=[];nextB=0;lw=w;lh=H;const n=reduced?.4:1;
    if(kind==='snow')for(let i=0;i<46*n;i++)ps.push({x:rand(0,w),y:rand(0,H),r:rand(2,5),v:rand(25,60),ph:rand(0,6.28)});
    if(kind==='leaves')for(let i=0;i<12*n;i++)ps.push({x:rand(0,w),y:rand(-H,H),s:rand(10,17),v:rand(35,65),ph:rand(0,6.28),rot:rand(0,6.28),c:pick(['#e8762a','#c0392b','#ffc21f','#a0642f'])});
    if(kind==='confetti')for(let i=0;i<34*n;i++)ps.push({x:rand(0,w),y:rand(-H,H),s:rand(7,12),v:rand(30,60),ph:rand(0,6.28),rot:rand(0,6.28),c:pick(h.fxc)});
    if(kind==='bats')for(let k=0;k<3;k++)ps.push({x:rand(0,w),by:H*(.14+k*.12),v:(k%2?-1:1)*rand(50,90),ph:rand(0,6.28),s:rand(16,24)});
  }
  function bat(ctx,b,t){
    const f=Math.sin(t/90+b.ph),s=b.s;ctx.fillStyle='#2a1a3a';
    for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(sd*s*.2,-s*.05);ctx.lineTo(sd*s*1.5,-s*(.15+.7*f));ctx.lineTo(sd*s*1.2,s*.25);
      ctx.lineTo(sd*s*.75,s*.05);ctx.lineTo(sd*s*.5,s*.3);ctx.lineTo(sd*s*.2,s*.2);ctx.closePath();ctx.fill()}
    ctx.beginPath();ctx.ellipse(0,0,s*.32,s*.42,0,0,6.28);ctx.fill();
    ctx.beginPath();ctx.moveTo(-s*.28,-s*.25);ctx.lineTo(-s*.18,-s*.62);ctx.lineTo(-s*.05,-s*.3);ctx.moveTo(s*.28,-s*.25);ctx.lineTo(s*.18,-s*.62);ctx.lineTo(s*.05,-s*.3);ctx.fill();
    ctx.fillStyle='#ffd447';ctx.beginPath();ctx.arc(-s*.11,-s*.1,s*.07,0,6.28);ctx.arc(s*.11,-s*.1,s*.07,0,6.28);ctx.fill();
  }
  return {draw(ctx,t,dt,w,H){
    const h=theme(),want=h?h.fx:null;if(want!==kind||w!==lw||H!==lh)init(h,w,H);if(!kind)return;
    ctx.save();
    if(kind==='snow'){ctx.fillStyle='rgba(255,255,255,.85)';
      for(const p of ps){p.y+=p.v*dt;p.x+=Math.sin(t/1000+p.ph)*15*dt;if(p.y>H+8){p.y=-8;p.x=rand(0,w)}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()}}
    if(kind==='leaves'||kind==='confetti'){
      for(const p of ps){p.y+=p.v*dt;p.x+=Math.sin(t/900+p.ph)*24*dt;p.rot+=dt*(kind==='leaves'?1.2:3);if(p.y>H+20){p.y=-20;p.x=rand(0,w)}
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
        if(kind==='leaves'){ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.55,0,0,6.28);ctx.fill();ctx.strokeStyle='rgba(80,30,0,.45)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-p.s*1.2,0);ctx.lineTo(p.s*.9,0);ctx.stroke()}
        else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
        ctx.restore()}}
    if(kind==='bats'){for(const b of ps){b.x+=b.v*dt;if(b.v>0&&b.x>w+50)b.x=-50;if(b.v<0&&b.x<-50)b.x=w+50;
      ctx.save();ctx.translate(b.x,b.by+Math.sin(t/700+b.ph)*30);bat(ctx,b,t);ctx.restore()}}
    if(kind==='fireworks'){
      if(t>nextB){const c=pick(h.fxc),x=rand(w*.15,w*.85),y=rand(H*.12,H*.4),sp=[];
        for(let k=0;k<24;k++){const a=k/24*6.283,v=rand(110,190);sp.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v})}
        ps.push({t0:t,c,sp});nextB=t+rand(1300,2300)*(reduced?2:1)}
      ps=ps.filter(b=>t-b.t0<1500);
      for(const b of ps){const life=1-(t-b.t0)/1500;ctx.globalAlpha=Math.max(0,life);ctx.fillStyle=b.c;
        for(const s of b.sp){s.vy+=70*dt;s.vx*=.985;s.x+=s.vx*dt;s.y+=s.vy*dt;ctx.beginPath();ctx.arc(s.x,s.y,1.5+2.5*life,0,6.28);ctx.fill()}}
      ctx.globalAlpha=1}
    ctx.restore();
  }};
}

  const text=LINES[key];

    if(cut){voiceSrc.forEach(x=>{try{x.stop()}catch(e){}});voiceSrc=[];if(window.speechSynthesis)speechSynthesis.cancel()}
    let t=Snd.ac.currentTime+.02;

const Snd={
  ac:null,
  unlock(){
    if(!this.ac){const AC=window.AudioContext||window.webkitAudioContext;if(AC){this.ac=new AC();this.m=this.ac.createGain();this.m.gain.value=.6;this.m.connect(this.ac.destination)}}

  tone(f,d,type,v,slide,delay){

    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.05);
  },
  noise(d,f,v,delay){
    if(!this.ac)return;const c=this.ac,t=c.currentTime+(delay||0),len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),x=b.getChannelData(0);

    const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();s.buffer=b;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=.8;
    g.gain.value=v||.3;s.connect(bp);bp.connect(g);g.connect(this.m);s.start(t);
  },
  pop(k){const f=380+Math.min(k,20)*28;this.tone(f,.12,'sine',.35,f*2.4);this.noise(.06,3000,.25)},
  // cute "wheee" / "woohoo" squeals for the characters (made in code, no voice)
  slideV(f1,f2,d,delay,type,v){
    if(!this.ac)return;const c=this.ac,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
    l.frequency.value=11;lg.gain.value=f1*.05;l.connect(lg);lg.connect(o.frequency); // a little wobble so it sounds alive
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.22,t+.04);g.gain.setValueAtTime(v||.22,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);

function readCode(t){

  let d;try{d=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){return null}
  if(!d||!Array.isArray(d.list)||!d.list.length)return null;
  const seen=new Set(),list=[];
  for(const p of d.list.slice(0,4)){
    if(!p||typeof p!=='object'||!CHARS[p.char]||seen.has(p.char))continue;seen.add(p.char);
    list.push({id:String(p.id||'p'+Date.now()+list.length),char:p.char,name:String(p.name||'').slice(0,12),level:Math.max(1,parseInt(p.level,10)||1),
      stickers:Array.isArray(p.stickers)?p.stickers.filter(k=>typeof k==='string'&&knownSticker(k)).slice(-200):[],
      popRound:parseInt(p.popRound,10)||0,buildRound:parseInt(p.buildRound,10)||0,buildLast:OBJ[p.buildLast]?p.buildLast:undefined,
      colorRound:parseInt(p.colorRound,10)||0,colored:cleanColored(p.colored),colorLast:COLOR_KEYS.includes(p.colorLast)?p.colorLast:undefined,truckRound:parseInt(p.truckRound,10)||0,trophy:!!p.trophy,sewerFrom:p.sewerFrom?parseInt(p.sewerFrom,10):undefined})}

  function burst(i,now){
    const cx=ox+(i%n)*cell+cell/2,cy=oy+((i/n)|0)*cell+cell/2;
    for(let k=0;k<12;k++){const a=k/12*6.28;sparks.push({x:cx,y:cy,vx:Math.cos(a)*rand(140,260),vy:Math.sin(a)*rand(140,260),life:1,c:k%2?'#ffd447':'#ffffff'})}
  }

    if(!running||won)return;
    const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-ox)/cell),y=Math.floor((e.clientY-r.top-oy)/cell);
    if(x<0||y<0||x>=n||y>=n)return;

    if(!sol[i]){Snd.boop();return}
    if(pathOk(i,cur[i])){shakes[i]=now;Snd.boop();return} // already right: a little wiggle, it stays put
    cur[i]=rot(cur[i]);anims[i]=now;Snd.bloop();Snd.zoom();
    if(pathOk(i,cur[i])){locks[i]=now+120;setTimeout(()=>{Snd.chime();burst(i)},120)}

    if(wet.ok){

  });

  function pipe(cx,cy,m,ang,sc,wp,ent,t){
    const w=cell*.34,r=cell/2;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.scale(sc,sc);
    const arms=(width,color,len)=>{ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
      for(const d of DIRS){if(!(m&d.b))continue;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(d.dx*r*(len||1),d.dy*r*(len||1));ctx.stroke()}};
    arms(w+12,'#2a1206');arms(w,'#f08a3c');
    if(wp>0){ // water runs in from where it came, then out the other ends
      const lw=w*.56,a=Math.min(1,wp*2),b=Math.max(0,wp*2-1);
      ctx.strokeStyle='#3ee3ff';ctx.lineWidth=lw;ctx.lineCap='round';

        if(d.b===ent){ctx.moveTo(d.dx*r,d.dy*r);ctx.lineTo(d.dx*r*(1-a),d.dy*r*(1-a))}

  }
  function loop(t){
    try{
    if(!running)return;
    const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
    if(bg)ctx.drawImage(bg,0,0,Wd,Hd);
    drawLife(t,dt);
    flowFx.draw(ctx,t,dt,Wd,Hd);
    ctx.fillStyle='rgba(20,8,40,.45)';rr(ctx,ox-14,oy-14,cell*n+28,cell*n+28,28);ctx.fill();
    const tg=won?-1:target(),pu=.5+.5*Math.sin(t/170);
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      const i=y*n+x,px=ox+x*cell,py=oy+y*cell;
      const wp=(wet&&wet.f[i]&&wetAt[i]!==undefined)?Math.max(0,Math.min(1,(t-wetAt[i])/FILL)):0;
      if(i===tg){ // the glowing pipe to tap
        for(let k=3;k>=1;k--){ctx.fillStyle='rgba(255,212,71,'+(.14+.14*pu)+')';const g=k*5+pu*6;rr(ctx,px+5-g,py+5-g,cell-10+g*2,cell-10+g*2,cell*.2+g);ctx.fill()}
      }
      ctx.fillStyle=!sol[i]?'rgba(255,255,255,.05)':i===tg?'#6b5418':wp>0?'#1b4a5a':'#3b2a52';
      rr(ctx,px+5,py+5,cell-10,cell-10,cell*.18);ctx.fill();
      if(i===tg){ctx.strokeStyle='rgba(255,212,71,'+(.55+.45*pu)+')';ctx.lineWidth=5;ctx.stroke()}
      if(!sol[i])continue;

      const sh=shakes[i];if(sh){const p=Math.min(1,(t-sh)/320);a+=Math.sin(p*22)*.1*(1-p);if(p>=1)delete shakes[i]}
      const lk=locks[i];if(lk&&t>=lk){const p=Math.min(1,(t-lk)/300);sc*=1+.16*Math.sin(p*Math.PI);if(p>=1)delete locks[i]}
      pipe(px+cell/2,py+cell/2,cur[i],a,sc,wp,wet?wet.ent[i]:0,t);
    }

    ctx.strokeStyle='#2a1206';ctx.lineWidth=cell*.36;ctx.beginPath();ctx.moveTo(ox+cell*n-2,gy);ctx.lineTo(gx,gy);ctx.stroke();
    if(splashed){ctx.strokeStyle='#3ee3ff';ctx.lineWidth=cell*.18;ctx.stroke()}
    ctx.fillStyle='#0c0620';ctx.beginPath();ctx.arc(gx,gy,cell*.2,0,6.28);ctx.fill();ctx.strokeStyle='#c9c3d6';ctx.lineWidth=4;ctx.stroke();
    if(!splashed)drawImg(ctx,IMG.ganja,gx,gy-cell*.28,cell*.9,Math.sin(t/300)*.08);
    else{const e=t-wonAt;drawImg(ctx,ready(IMG.ganjaJump)?IMG.ganjaJump:IMG.ganja,gx,gy-cell*.32-Math.abs(Math.sin(e/240))*cell*.55,cell*.95,Math.sin(e/120)*.08)} // happy bouncing

    ctx.globalAlpha=1;sparks=sparks.filter(s=>s.life>0);
    }catch(err){if(window.console)console.error(err)}
    if(running)raf=requestAnimationFrame(loop);
  }
  window.addEventListener('resize',()=>{if(running)resize()});
  return {start,stop,next,get level(){return level},sceneOf:sceneFor};
})();

  duck:{file:'obj-rubber-duck',title:'Rubber duck!',say:'nameDuck'},
  hose:{file:'obj-garden-hose',title:'Garden hose!',say:'nameHose',spot:[.364,.43]},
  washer:{file:'obj-washing-machine',title:'Washing machine!',say:'nameWasher',spot:[.501,.519]},
  heater:{file:'obj-water-heater',title:'Water heater!',say:'nameHeater',spot:[.378,.012],spot2:[.626,.012]},
  toolbox:{file:'obj-toolbox',title:'Toolbox!',say:'nameToolbox',spot:[.499,.15]}

const COLOR_KEYS=['bathtub','duck','hose','washer','heater','toolbox'];
for(const k in OBJ){const im=new Image();im.src='/assets/'+OBJ[k].file+'.png';OBJ[k].img=im}
/* iPad Safari has a fixed budget for canvas memory and is slow to give it back, so every canvas made here
   is handed back (freeCanvas) as soon as it's not needed. Object pixels are read once into plain arrays. */
function freeCanvas(c){try{if(c){c.width=0;c.height=0}}catch(e){}}
function prepObj(k){
  const o=OBJ[k];if(o.d)return o.d;if(!ready(o.img))return null;
  const w=o.img.naturalWidth,h=o.img.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;
  let px;try{const g=c.getContext('2d');g.drawImage(o.img,0,0);px=g.getImageData(0,0,w,h).data}catch(e){freeCanvas(c);freeArt(null);return null}
  freeCanvas(c);
  const al=new Uint8Array(w*h);for(let i=0;i<w*h;i++)al[i]=px[i*4+3];
  o.d={w,h,img:o.img,px,al,cuts:{}};return o.d;           // draw from the original image, no copy
}
function shadowOf(k){ // dark silhouette for the shadow step, made when needed
  const o=OBJ[k],d=prepObj(k);if(!d)return null;if(o.shadow)return o.shadow;
  const sc=document.createElement('canvas');sc.width=d.w;sc.height=d.h;const sg=sc.getContext('2d');if(!sg)return null;const sd=sg.createImageData(d.w,d.h);
  for(let i=0;i<d.w*d.h;i++){if(!d.al[i])continue;sd.data[i*4]=40;sd.data[i*4+1]=22;sd.data[i*4+2]=78;sd.data[i*4+3]=d.al[i]}
  sg.putImageData(sd,0,0);return (o.shadow=sc);
}
function freeCuts(d){if(!d||!d.cuts)return;for(const n in d.cuts){const c=d.cuts[n];c.pieces.forEach(q=>{freeCanvas(q.img);freeCanvas(q.dark);freeCanvas(q.gold)});freeCanvas(c.ghost)}d.cuts={}}
function freeArt(keep){ // hand back everything except what the current round uses
  for(const k in OBJ){if(k===keep)continue;const o=OBJ[k];if(o.shadow){freeCanvas(o.shadow);o.shadow=null}if(o.grey){freeCanvas(o.grey);o.grey=null}if(o.white){freeCanvas(o.white);o.white=null}if(o.d)freeCuts(o.d)}
}
// sounds when an object comes alive
function aliveSound(k){

  ({wrench:()=>{Snd.zoom();T_(()=>Snd.clink(),500)},
    toilet:()=>{Snd.whoosh();Snd.gurgle();T_(()=>Snd.gurgle(),400)},

    duck:()=>{Snd.squeak();T_(()=>Snd.squeak(),520)},
    hose:()=>{Snd.noise(1.3,1800,.28);T_(()=>Snd.splash(),500)},
    washer:()=>{Snd.whoosh();for(let i=0;i<5;i++)Snd.tone(90+i*6,.22,'sawtooth',.05,null,i*.25);T_(()=>Snd.whoosh(),700)},

// the finished object comes to life (e = ms since it started)
function aliveDraw(c,k,x,y,S,e,t){
  const o=OBJ[k],d=o.d;if(!d)return;const K=S/Math.max(d.w,d.h),dw=d.w*K,dh=d.h*K,ez=p=>1-(1-p)*(1-p);
  const bump=e<400?1+.08*Math.sin(e/400*Math.PI):1;let ang=0,sx=bump,sy=bump,X=x,Y=y;
  if(k==='wrench'&&e<1100)ang=ez(e/1100)*Math.PI*2;
  if(k==='plunger'&&e<1300){sy=1-.2*Math.abs(Math.sin(e/1300*Math.PI*3));sx=1+(1-sy)*.6;Y=y+dh/2*(1-sy)}
  if(k==='toilet'&&e<1500)sx=sy=1+.03*Math.sin(e/90);
  if((k==='duck'||k==='toolbox')&&e<1400){Y=y-Math.abs(Math.sin(e/350*Math.PI))*S*.1;ang=k==='duck'?Math.sin(e/110)*.14:0}
  if(k==='washer'&&e<1800)X=x+Math.sin(e/28)*4;
  c.save();c.translate(X,Y);if(ang)c.rotate(ang);c.scale(sx,sy);c.drawImage(d.img,-dw/2,-dh/2,dw,dh);c.restore();
  const at=sp=>({x:X+(sp[0]-.5)*dw,y:Y+(sp[1]-.5)*dh}),h=(n)=>{const s=Math.sin(n*127.1)*43758.5;return s-Math.floor(s)};

  if(k==='toilet'&&e>100&&e<1700){const p=at(o.spot),q=(e-100)/1600,rad=S*.12*(1-q);
    c.translate(p.x,p.y);c.scale(1,.45);c.strokeStyle='rgba(62,227,255,.9)';c.lineWidth=7;
    for(let i=0;i<3;i++){const a0=t/120+i*2.09;c.beginPath();c.arc(0,0,Math.max(2,rad*(1-i*.22)),a0,a0+2.2);c.stroke()}}
  if(k==='faucet'&&e>100&&e<1800){const p=at(o.spot),bot=Y+dh/2+S*.08,len=Math.min(1,(e-100)/250);
    c.strokeStyle='rgba(62,227,255,.9)';c.lineWidth=Math.max(6,S*.035);c.beginPath();c.moveTo(p.x,p.y);
    for(let i=1;i<=8;i++)c.lineTo(p.x+Math.sin(t/60+i)*2,p.y+(bot-p.y)*len*i/8);c.stroke();
    if(len>=1){c.fillStyle='#9ff3ff';for(let i=0;i<8;i++){const q=((t/500)+i/8)%1;c.globalAlpha=1-q;c.beginPath();c.arc(p.x+(h(i)-.5)*S*.3*q,bot-Math.sin(q*Math.PI)*S*.08,4,0,6.28);c.fill()}}}
  if(k==='bathtub'&&run){const p=at(o.spot),sp=at(o.spot2);
    if(e<1300){c.strokeStyle='rgba(62,227,255,.9)';c.lineWidth=Math.max(5,S*.025);c.beginPath();c.moveTo(sp.x-dw*.06,sp.y+dh*.04);c.lineTo(sp.x-dw*.06,p.y);c.stroke()}
    for(let i=0;i<16;i++){const q=((e/1400)+i/16)%1,r=(5+h(i)*10)*S/400;c.globalAlpha=Math.min(1,(2200-e)/400)*(1-q*.6);
      const bx=p.x+(h(i+3)-.5)*dw*.75+Math.sin(t/300+i)*5,by=p.y-q*dh*.55;
      c.fillStyle='rgba(255,255,255,.75)';c.strokeStyle='rgba(120,190,230,.8)';c.lineWidth=2;c.beginPath();c.arc(bx,by,r,0,6.28);c.fill();c.stroke()}}
  if(k==='hose'&&run){const p=at(o.spot);c.fillStyle='#5fd8ff';
    for(let i=0;i<26;i++){const q=((t/550)+i/26)%1,vx=-(.5+h(i)*.5)*S,vy=-(.75+h(i+9)*.35)*S;
      c.globalAlpha=(1-q)*Math.min(1,(2200-e)/300);c.beginPath();c.arc(p.x+vx*q*.8,p.y+vy*q*.8+q*q*S*.6,Math.max(3,S*.012),0,6.28);c.fill()}}
  if(k==='washer'&&e<2000){const p=at(o.spot),r=dw*.2,sp=t/90;
    c.beginPath();c.arc(p.x,p.y,r,0,6.28);c.clip();c.fillStyle='rgba(30,110,200,.55)';c.fillRect(p.x-r,p.y-r,r*2,r*2);
    ['#ff7b9c','#ffd447','#ffffff','#9358e6'].forEach((col,i)=>{const a=sp+i*1.57;c.fillStyle=col;c.beginPath();c.ellipse(p.x+Math.cos(a)*r*.5,p.y+Math.sin(a)*r*.5,r*.28,r*.16,a,0,6.28);c.fill()});
    c.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<6;i++){c.beginPath();c.arc(p.x+Math.cos(sp*.7+i)*r*.7,p.y+Math.sin(sp*.7+i)*r*.7,r*.07,0,6.28);c.fill()}}
  if(k==='heater'&&run){for(const s of [o.spot,o.spot2]){const p=at(s);
    for(let i=0;i<5;i++){const q=((t/900)+i/5+(s===o.spot?0:.5))%1;c.globalAlpha=(1-q)*.85*Math.min(1,(2200-e)/300);c.fillStyle='#ffffff';

/* ================= POP & BUILD =================
   Zydeco floats in with a balloon, he pops it, the object breaks into pieces, he drags them into the outline,
   it comes alive, then he drags it onto its matching shadow. Pieces, outline and shadows are all cut in code
   from one image per object (/assets/obj-<name>.png), so the same art can feed Shadow Sort and Color It In later. */
const Build=(function(){
  const cv=$('buildc'),TOP=96;
  const KEYS=Object.keys(OBJ);                       // all 10 objects take turns
  const BAL=[['#ffd2ec','#e8579f','#9e2766'],['#c2ddff','#3a82ea','#1c4aa3'],['#fff3b8','#ffc21f','#a3741a'],['#ffc9c4','#e8392e','#9c1f17']];
  let ctx,W=0,H=0,running=false,raf=0,last=0,stage='',obj='',info=null,set=null,pcs=[],drag=null,
      S=0,K=1,oc={x:0,y:0},B=0,home={x:0,y:0},shadows=[],bal=null,bits=[],sparks=[],T={},idleAt=0,wrongs=0,
      rotMode=false,nPieces=3,intro=true,timers=[],bg=null,landscape=true,mt={x:0,y:0},zTop=0;
  const fx=HolFx();
  const ease=p=>1-(1-p)*(1-p),lerp=(a,b,p)=>a+(b-a)*p,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),cl01=v=>clamp(v,0,1);
  const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

  /* ---------- art prep: silhouette, then pieces ---------- */
  const prep=prepObj;

    if(d.cuts[n])return d.cuts[n];
    freeCuts(d);                                 // keep just one set in memory (iPad Safari is picky)
    const {w,h,al,px}=d,pts=[];
    for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4)if(al[y*w+x]>128)pts.push(x,y);
    const m=pts.length/2;let cx=0,cy=0;for(let i=0;i<m;i++){cx+=pts[2*i];cy+=pts[2*i+1]}cx/=m;cy/=m;
    const d2=(i,s)=>(pts[2*i]-s[0])**2+(pts[2*i+1]-s[1])**2;
    const seeds=[];let best=-1,bi=0;

    while(seeds.length<n){best=-1;for(let i=0;i<m;i++){let md=1e18;for(const s of seeds)md=Math.min(md,d2(i,s));if(md>best){best=md;bi=i}}seeds.push([pts[2*bi],pts[2*bi+1]])}

      const sx=new Float64Array(n),sy=new Float64Array(n),sc=new Float64Array(n);
      for(let i=0;i<m;i++){let md=1e18,mi=0;for(let s=0;s<n;s++){const v=d2(i,seeds[s]);if(v<md){md=v;mi=s}}sx[mi]+=pts[2*i];sy[mi]+=pts[2*i+1];sc[mi]++}

    }

      let md=1e18,mi=0;for(let s=0;s<n;s++){const v=(x-seeds[s][0])**2+(y-seeds[s][1])**2;if(v<md){md=v;mi=s}}

  /* ---------- round flow ---------- */

    if(bg)ctx.drawImage(bg,0,0,W,H);
    fx.draw(ctx,t,dt,W,H);

    if(stage==='reveal'){
      const e=t-T.pop;
      if(e<800){const p=ease(cl01(e/550)),sh=e>560?Math.sin(e/18)*5:0;

      // ---- build / honk / leave ----
      let X=tk.X;const st=buildState(t);
      const hintP=stage==='build'&&t-idleAt>7000&&!drag?parts.find(p=>p.st==='tray'):null; // stuck: the next part and its spot glow
      if(hintP)st.glow={k:hintP.k,slot:hintP.k==='wheel'?(placed('wheel',0)?1:0):0};
      if(stage==='honk'){const e=t-T.honk;st.mojoBob=-Math.abs(Math.sin(e/160))*14;st.tilt=Math.sin(e/90)*.012*(e<900?1:0)}
      if(stage==='leave'){const e=(t-T.leave)/1000;X+=e*e*W*.9;st.wa=e*e*20;if(X-406*tk.s>W+20){startDrive()}}
      if(stage!=='enter')drawTruck(ctx,X,tk.Y,tk.s,st,t);
      if(stage==='build'){
        for(const q of parts){
          if(q.st==='back'){const p=ease(cl01((t-q.t0)/350));q.x=lerp(q.fx,q.tx,p);q.y=lerp(q.fy,q.ty,p);if(p>=1)q.st='tray'}
          if(q.st==='snap'){const p=ease(cl01((t-q.t0)/220));q.x=lerp(q.fx,q.gx,p);q.y=lerp(q.fy,q.gy,p);
            if(p>=1){q.st='on';Snd.chime();if(q.k==='wheel')Snd.clunk();idleAt=t;
              for(let k=0;k<12;k++){const a=k/12*6.28;sparks.push({x:q.gx,y:q.gy,vx:Math.cos(a)*rand(100,220),vy:Math.sin(a)*rand(100,220),life:1,c:k%2?'#ffd447':'#fff'})}
              if(allOn())later(()=>{if(running&&stage==='build')built(performance.now())},500)}}
          if(q.st==='on')continue;
          const b=partBox(q.k,0),full=tk.s,trayS=Math.min(full,cell*.86/Math.max(b.w,b.h));
          let s=q.st==='drag'||q.st==='snap'?full:q.st==='back'?lerp(full,trayS,ease(cl01((t-q.t0)/350))):trayS;
          if(q.st==='tray'||q.st==='back'){ctx.fillStyle=q===hintP?'rgba(255,212,71,'+(.35+.3*Math.sin(t/180))+')':'rgba(122,74,42,.1)';ctx.beginPath();ctx.arc(q.tx,q.ty,cell*.48,0,6.28);ctx.fill()}
          let y=q.y;if(q.st==='tray')y+=Math.sin(t/320+q.tx)*3;
          drawPart(q,q.x,y,s);
        }
        if(drag)drawPart(drag.p,drag.p.x,drag.p.y,tk.s); // the one in his hand stays on top
      }
    }else{
      // ---- drive ----
      const s=dv.s,TH=GY*s,Hj=TH*1.35,T_=.95,g=8*Hj/(T_*T_);
      if(stage==='arrive'&&house){speed=0}
      else if(house){const tx=dv.X+406*s+GY*s*1.15,d=house.x-tx,a=v0*v0/(2*W*.38);speed=Math.min(v0,Math.sqrt(Math.max(0,2*a*d)));
        if(d<=2||speed<6){house.x=tx;speed=0;arrive(t)}}
      const mv=speed*dt;dist+=mv;
      scenery(t);if(bg)ctx.drawImage(bg,0,0,W,H);
      if(house){house.x-=mv;drawHouse(ctx,house,t)}
      if(stage==='drive'&&!house){
        if(dist>=nextAt)spawn();
        if(got.length===CREW.length&&dist>=trip&&!flights.length&&!ents.some(e=>e.kind!=='crew'&&e.x>dv.X-406*s)){house={x:W+GY*s*1.4}}
      }
      // truck: enter from the left, jump physics, bonks
      let X=dv.X;if(stage==='enter'){const p=ease(cl01((t-T.enter)/1100));X=lerp(-450*s,dv.X,p);if(p>=1)stage='drive'}
      if(jh>0||jv>0){jh+=jv*dt;jv-=g*dt;if(jh<=0){jh=0;jv=0;Snd.tone(140,.1,'sine',.18,90);if(t-tapAt<200){tapAt=-1e9;jump(t)}}}
      const air=jh>0;tilt=air?(jv>0?-.07:.04):0;wheelA+=mv/(WR*s);
      const fw=X+(WX[1]-GX)*s,rw=X+(WX[0]-GX)*s,wr=WR*s;
      for(const e of ents){e.x-=mv;
        if(e.kind==='crew'||e.kind==='fit'){if(e.got)continue;const ty=dv.lane-jh-474*s,by=dv.lane-jh,cy=dv.lane-e.h,rad=e.kind==='crew'?e.rc:e.r*1.2;
          const nx=Math.max(X-406*s,Math.min(e.x,X+406*s)),ny=Math.max(ty,Math.min(cy,by));
          if(Math.hypot(nx-e.x,ny-cy)<rad){if(e.kind==='crew')collect(e,t);else grabFit(e,t)}
          if(e.kind==='crew'&&e.x<-W*.25&&!e.missed){e.missed=true;crewDue.push(dist+W*.9);crewDue.sort((a,b)=>a-b)}}
        else{if(e.fly){e.fvy+=1400*dt;e.fy-=e.fvy*dt;e.x+=e.fvx*dt;e.rot+=dt*9;continue}
          if(!e.hit&&!e.clear&&Math.abs(fw-e.x)<wr*.6+e.w*.4&&jh<e.h*.8){e.hit=true;wob=t;Snd.boing();if(!air)jv=Hj*1.2;
            if(e.kind==='cone'){e.fly=true;e.fy=0;e.fvy=-520;e.fvx=v0*.4;e.rot=0}}
          if(!e.hit&&!e.clear&&e.x<rw-wr){e.clear=true;Snd.tone(660,.18,'triangle',.12,990);for(let k=0;k<6;k++)sparks.push({x:e.x,y:dv.lane-e.h,vx:rand(-80,80),vy:rand(-200,-60),life:1,c:'#ffd447'})}}}
      ents=ents.filter(e=>e.x>-W*.3&&!(e.got)&&(!e.fly||e.fy>-H));
      for(const e of ents)if(e.kind==='bump'||e.kind==='cone')drawObstacle(e,t);
      // exhaust puffs (and desert dust) behind the truck
      if(speed>0&&t-puffAt>120){puffAt=t;const p=toScr(X,dv.lane-jh,s,24,340);puffs.push({x:p.x,y:p.y,r:TH*.05,vx:-speed*.85-20,vy:-25,life:1,c:'205,205,215'});
        if(zoneOf(dist)===2&&!air){const q=toScr(X,dv.lane,s,110,396);puffs.push({x:q.x,y:q.y,r:TH*.09,vx:-speed*.9,vy:-40,life:1,c:'232,197,138'})}}
      for(const p of puffs){p.life-=dt*1.4;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*TH*.12;ctx.fillStyle='rgba('+p.c+','+Math.max(0,p.life*.55)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()}
      puffs=puffs.filter(p=>p.life>0);
      const st={wheels:[1,1],mojo:1,toolbox:1,rack:1,wa:wheelA,riders,bump:air?0:1,bob:air?0:Math.sin(t/90)*1.5,mojoBob:air?0:Math.sin(t/110)*2,
        tilt:tilt+(t-wob<700?Math.sin((t-wob)/45)*.05*(1-(t-wob)/700):0)};
      if(stage==='arrive'){const e=t-T.arrive;st.mojoBob=-Math.abs(Math.sin(e/160))*12}
      drawTruck(ctx,X,dv.lane-jh,s,st,t);
      for(const e of ents)if(e.kind==='fit')drawFit(e,t);
      for(const e of ents)if(e.kind==='crew')drawCrewFloat(e,t);
      for(const f of flights){const p=ease(cl01((t-f.t0)/550)),tp=toScr(X,dv.lane-jh,s,SLOTS[f.slot],152);
        drawImg(ctx,IMG[f.who],lerp(f.fx,tp.x,p),lerp(f.fy,tp.y,p)-Math.sin(p*Math.PI)*TH*.6,lerp(e2(f),104*s,p),p*6.28);
        if(p>=1){riders.push({who:f.who,slot:f.slot,ph:f.ph});f.done=true}}
      flights=flights.filter(f=>!f.done);
      for(const h of hopped){const p=ease(cl01((t-h.t0)/600));const x=lerp(h.fx,h.gx,p),y=lerp(h.fy,h.gy,p)-Math.sin(p*Math.PI)*TH*.7;
        drawImg(ctx,IMG[h.who],x,y-(p>=1?Math.abs(Math.sin(t/200+h.ph))*10:0),lerp(104*s,TH*.62,p),0)}
      // first drives: a little "tap!" hint when someone's coming
      if(stage==='drive'&&round<=2&&!air&&jumps<3&&ents.some(e=>e.kind==='crew'&&!e.got&&e.x>X&&e.x<X+W*.45)){
        ctx.font=Math.round(Math.min(64,W*.08))+'px sans-serif';ctx.textAlign='center';ctx.fillText('👆',W*.72,H*.5+Math.sin(t/160)*10)}
      hud(t);
    }
    fx.draw(ctx,t,dt,W,H);
    for(const s of sparks){s.life-=dt*1.6;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.93;s.vy*=.93;
      ctx.globalAlpha=Math.max(0,Math.min(1,s.life));ctx.fillStyle=s.c;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(t/200);
      const z=6*Math.min(1,s.life)+3;ctx.beginPath();ctx.moveTo(0,-z);ctx.lineTo(z*.35,0);ctx.lineTo(0,z);ctx.lineTo(-z*.35,0);ctx.closePath();ctx.fill();ctx.restore()}
    ctx.globalAlpha=1;sparks=sparks.filter(s=>s.life>0);
    }catch(err){if(window.console)console.error(err)}
    if(running)raf=requestAnimationFrame(loop);
  }
  function e2(f){return dv.s*GY*.3*1.7} // size of a floating crew member
  function arrive(t){ // pull up at the job site, the crew hops out
    if(stage==='arrive')return;stage='arrive';T.arrive=t;honk();
    const s=dv.s,u=GY*s,gy=dv.roadTop+H*.01-u*.31;
    riders.forEach((r,i)=>{const from=toScr(dv.X,dv.lane,s,SLOTS[r.slot],152);
      later(()=>{if(!running)return;hopped.push({who:r.who,fx:from.x,fy:from.y,gx:house.x+(i-1.5)*u*.5,gy,t0:performance.now(),ph:rand(0,6.28)});
        riders=riders.filter(q=>q!==r);Snd.squeal(r.who)},500+i*300)});
    later(()=>{if(!running)return;const el=$('truckTitle');el.textContent='Let\u2019s get to work!';el.classList.remove('show');void el.offsetWidth;el.classList.add('show');say('truckWork',true)},1900);
    later(finish,4300);
  }
  window.addEventListener('resize',()=>{if(running)resize()});
  return {start,next,stop,debug:()=>({stage,parts,got,ents,dist,speed,jh,house,round,tk,dv,cell,trip,fits,crewDue,hk,NZ}),warp:f=>{dist=trip*f;nextAt=dist;crewDue=crewDue.filter(d=>d>=dist)}};
})();

/* ================= STICKER BOOK ================= */
const Book=(function(){
  const PAGES=[{t:'Under the sink',keys:STICKERS.sink},{t:'Bath time fun',keys:STICKERS.bath},{t:'Down in the dirt',keys:STICKERS.dirt},
    {t:'Down in the sewer',keys:STICKERS.sewer},{t:'Holidays',keys:HOL_KEYS,hol:true},{t:'My pictures',keys:COLOR_KEYS,pic:true}];
  let pg=0,sx=null,swiped=false;
  const owned=(s,k)=>s.includes(k)||s.includes(k+'g');
  function open(){
    const p=me(),s=stickers(),lastK=s.length?stBase(s[s.length-1]):null;
    pg=Math.max(0,PAGES.findIndex(P=>P.keys.includes(lastK)));  // open on the page of the newest sticker
    $('bookTitle').textContent=p?pname(p)+'\u2019s stickers':'Stickers';
    const tb=$('bookTrophy');tb.innerHTML=p&&p.trophy?trophySVG(pname(p)):'';tb.style.visibility=p&&p.trophy?'visible':'hidden';
    $('zoom').hidden=true;draw(0);
  }
  function draw(dir){
    const P=PAGES[pg],s=stickers(),cnt=(me()&&me().colored)||{},pics=P.pic?myPics():{};
    let h='<h3>'+P.t+'</h3><div class="sgrid '+(P.keys.length>3?'six':'three')+'">';
    for(const k of P.keys){
      if(P.pic){const has=(cnt[k]||0)>0;  // pictures he colored in
        h+='<button class="cell'+(has?'':' locked')+'" data-k="'+k+'" data-pic="1" aria-label="'+(has?'Open picture':'Not colored yet')+'">'+
          '<span class="st"><img src="'+(has&&pics[k]?pics[k]:'/assets/'+OBJ[k].file+'.png')+'" alt=""></span><small>'+(has?OBJ[k].title.replace('!','')+(cnt[k]>1?' ×'+cnt[k]:''):'&nbsp;')+'</small></button>';continue}
      const has=owned(s,k),gold=s.includes(k+'g');
      h+='<button class="cell'+(has?'':' locked')+'" data-k="'+k+'" aria-label="'+(has?'Open sticker':'Not won yet')+'">'+
        '<span class="st'+(gold?' gold':'')+'"><img src="'+stSrc(k)+'" alt="" onerror="this.parentNode.parentNode.classList.add(\'missing\')"></span>'+
        (P.hol?'<small>'+HOL_BY_ST[k].short+'</small>':'')+'</button>'}
    const el=$('page');el.innerHTML=h+'</div>';el.classList.remove('in-l','in-r');if(dir){void el.offsetWidth;el.classList.add(dir<0?'in-l':'in-r')}
    $('pgPrev').disabled=pg===0;$('pgNext').disabled=pg===PAGES.length-1;
    $('pgDots').innerHTML=PAGES.map((_,i)=>'<i class="'+(i===pg?'on':'')+'"></i>').join('');
  }
  function go(d){const n=pg+d;if(n<0||n>=PAGES.length){Snd.boop();return}pg=n;Snd.bloop();draw(d)}
  $('pgPrev').addEventListener('click',()=>go(-1));$('pgNext').addEventListener('click',()=>go(1));
  $('page').addEventListener('pointerdown',e=>{sx=e.clientX;swiped=false});
  $('page').addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60){swiped=true;go(dx<0?1:-1)}});
  $('page').addEventListener('click',e=>{
    if(swiped){swiped=false;return}const b=e.target.closest('[data-k]');if(!b)return;
    if(b.classList.contains('locked')){b.classList.remove('wig');void b.offsetWidth;b.classList.add('wig');Snd.boop();return}
    zoom(b.dataset.pic?'<img src="'+(myPics()[b.dataset.k]||'/assets/'+OBJ[b.dataset.k].file+'.png')+'" alt="">':stickerHTML(b.dataset.k),!!b.querySelector('.st.gold'));
  });
  $('bookTrophy').addEventListener('click',()=>{const p=me();if(p&&p.trophy)zoom(trophySVG(pname(p)),false)});
  function zoom(html,gold){
    let sp='';for(let k=0;k<10;k++){const a=k/10*6.283+rand(-.2,.2),r=rand(28,46);sp+='<i style="--dx:'+(Math.cos(a)*r).toFixed(1)+'vmin;--dy:'+(Math.sin(a)*r).toFixed(1)+'vmin;animation-delay:'+(.1+k*.03).toFixed(2)+'s">✦</i>'}
    $('zoom').innerHTML='<div class="zin'+(gold?' gold':'')+'">'+html+sp+'</div>';$('zoom').hidden=false;
    Snd.chime();if(gold)say('gold',true);
  }
  $('zoom').addEventListener('click',()=>{$('zoom').hidden=true;Snd.boop()});
  return {open};
})();

/* ================= CELEBRATION ================= */
let lastGame='pop',confettiRaf=0;
function celebrate(game){
  lastGame=game;const p=me();
  const n=game==='flow'?Flow.level:game==='build'?((p&&p.buildRound)||1):game==='color'?((p&&p.colorRound)||1):game==='truck'?((p&&p.truckRound)||1):((p&&p.popRound)||1); // levels / rounds / pictures / drives
  const pool=game==='flow'?STICKERS[Flow.sceneOf(n)]:popPool();
  const hs=holidaySticker();
  {const h=theme(),cm=h&&holArt(h).mojo;$('yay').querySelector('.mojo').src=cm&&ready(cm)?cm.src:SRC.mojoCheer} // costume Mojo when there is one
  const earn=n%3===0;                                                // a sticker every 3
  $('got').hidden=!earn;$('prog').hidden=earn;
  let k=null,fin=false;
  if(earn&&hs){k=hs;p.stickers.push(k);saveP();$('newSticker').innerHTML=stickerHTML(k);$('newSticker').className='st'}
  else if(earn){k=addSticker(pool);$('newSticker').innerHTML=stickerHTML(k);$('newSticker').className='st'+(isGold(k)?' gold':'');fin=checkFinale(game)}
  else{const d=n%3,nx=hs||nextSticker(pool);
    $('prog').innerHTML=[1,2,3].map(i=>'<i class="'+(i<=d?'on':'')+(i===d?' now':'')+'"></i>').join('')+'<span class="'+(isGold(nx)?'gold':'')+'">'+stickerHTML(nx)+'</span>'}
  $('againTxt').textContent=game==='flow'?'Next':'Again';
  $('yay').hidden=false;Snd.cheer();
  const stLine=()=>say(isGold(k)?'gold':pick(STICKER_LINES),true);
  if(game==='flow'){if(earn)setTimeout(stLine,700)}                  // Flow already cheered at the splash
  else{cheer();if(earn)setTimeout(stLine,1500)}
  confetti();
  if(fin)setTimeout(showFinale,3200);
}
// this month's holiday sticker, once, if its art is on the site
function holidaySticker(){
  const h=realTheme(),p=me();if(!h||!p||p.stickers.includes(h.st))return null;
  return ready(holArt(h).st)?h.st:null;
}
function showFinale(){
  if($('yay').hidden)return;const p=me();
  $('finTrophy').innerHTML=trophySVG(p?pname(p):'');$('finale').hidden=false;
  Snd.cheer();say('master',true);confetti();
}
$('finOk').addEventListener('click',()=>{$('finale').hidden=true});
$('again').addEventListener('click',()=>{
  $('yay').hidden=true;$('finale').hidden=true;cancelAnimationFrame(confettiRaf);freeCanvas($('confetti'));
  if(lastGame==='flow')Flow.next();else if(lastGame==='build')Build.next();else if(lastGame==='color')Color.next();else if(lastGame==='truck')Truck.next();else Pop.next();
});
function confetti(){
  const cv=$('confetti'),f=fit(cv),c=f.ctx,ht=theme(),colors=ht?ht.conf:['#3ee3ff','#ffd447','#e5894a','#ff7bc8','#8fe36b','#fff4df'];
  const ps=Array.from({length:reduced?30:140},()=>({x:rand(0,f.w),y:rand(-f.h,0),vx:rand(-40,40),vy:rand(120,260),r:rand(0,6.28),vr:rand(-6,6),s:rand(8,16),c:pick(colors)}));
  let last=performance.now();const t0=last;
  cancelAnimationFrame(confettiRaf);
  (function step(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;c.clearRect(0,0,f.w,f.h);
    for(const p of ps){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
      c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()}
    if(now-t0<4000)confettiRaf=requestAnimationFrame(step);else{c.clearRect(0,0,f.w,f.h);freeCanvas(cv)}
  })(last);
}

show('splash');
window.__kids={Pop,Flow,Build,Color,Truck,Book,show,celebrate,BUF,setPreview:k=>{holPreview=k;drawHoli()},PL:()=>PL,me};
})();
</script>
