<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Whack-a-Pipe">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Whack-a-Pipe | Pipe Mojo</title>
<link rel="preload" as="image" href="/assets/mojo-34.png">
<link rel="preload" as="image" href="/assets/ganja-front.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#060606; --deep:#12100e; --cyan:#00e5ff; --red:#e8281e; --gold:#f5c842;
  --purple:#5b1aaa; --copper:#c97a3d;
  --title:'Pirata One',Georgia,serif; --body:'Nunito',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--black);color:#fff;font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;max-width:560px;width:100%;margin:0 auto}
.left{display:flex;align-items:center;gap:10px}
.back{font-weight:800;font-size:.9rem;color:rgba(255,255,255,.65);padding:6px 0;white-space:nowrap}
.sound{font:inherit;font-weight:800;font-size:.78rem;background:transparent;color:var(--cyan);
  border:1.5px solid rgba(0,229,255,.35);border-radius:8px;padding:5px 9px;cursor:pointer;white-space:nowrap}
#pause{padding:5px 11px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;align-self:stretch}
.left{gap:8px!important}
.stats{display:flex;gap:14px;align-items:baseline}
.stat{text-align:right}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.72rem;color:rgba(255,255,255,.5);font-weight:700}
.lives{display:flex;gap:5px}
.pin{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 6px rgba(232,40,30,.7)}
.pin.lost{background:#2a2226;box-shadow:none}
.stage{position:relative;flex:1;max-width:560px;width:100%;margin:0 auto 8px;border-radius:14px;overflow:hidden;
  background:radial-gradient(ellipse 90% 60% at 50% 100%, rgba(91,26,170,.35) 0%, transparent 70%),linear-gradient(180deg,#0d0610,#080508)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:24px;background:rgba(6,6,6,.84)}
.overlay[hidden]{display:none}
.overlay img{width:auto;height:min(30vh,230px);margin-bottom:6px;filter:drop-shadow(0 0 24px rgba(91,26,170,.6))}
.overlay h1{font-family:var(--title);font-weight:400;font-size:clamp(2.6rem,11vw,3.6rem);line-height:1;color:var(--cyan);
  text-shadow:0 0 22px rgba(0,229,255,.4)}
.overlay h1.cursed{color:var(--red);font-size:clamp(3.2rem,15vw,4.6rem);text-shadow:0 0 22px rgba(232,40,30,.45)}
.overlay p{color:rgba(255,255,255,.75);max-width:30ch;line-height:1.45;margin:8px 0 18px}
.overlay p strong{color:var(--gold)}
#over{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:22px;padding-bottom:28px}
#over img{height:min(18vh,140px)}
.lb-slot{width:100%}
.overlay p.who{margin:16px 0 0;font-size:.9rem;color:rgba(255,255,255,.6)}
.overlay p.who b{color:#fff}
.who button{font:inherit;font-weight:800;font-size:.85rem;background:none;border:0;padding:0 0 0 6px;color:var(--cyan);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button,.btn{font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:10px;padding:13px 22px;cursor:pointer}
.primary{background:var(--cyan);color:#000}
.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.22)}
.rankbox{display:flex;align-items:center;gap:12px;margin:6px 0 2px;text-align:left}
.rankbox[hidden]{display:none}
.rankbox .ch{width:64px;height:64px;flex:none}
.rankbox .ch svg{width:100%;height:100%}
.rankbox b{display:block;font-size:1.05rem}
.rankbox span{font-size:.85rem;color:rgba(255,255,255,.65)}
.rankbox .promo{color:var(--gold);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:.75rem}
.newtro{font-size:.9rem;color:var(--gold);font-weight:800;margin:6px 0 0}
.newtro[hidden]{display:none}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);z-index:20;background:#f5c842;color:#1a1004;font-weight:800;
  padding:9px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;font-size:.9rem}
.toast.on{transform:translate(-50%,0)}
.wver{position:fixed;right:8px;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:.65rem;color:rgba(255,255,255,.28)}
button:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="bar">
  <div class="left">
    <a class="back" href="/play">‹ Games</a>
    <button class="sound" id="sound" aria-pressed="true">Sound on</button>
    <button class="sound" id="pause" hidden aria-pressed="false" aria-label="Pause"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="3.6" height="12" rx="1"/><rect x="8.4" y="1" width="3.6" height="12" rx="1"/></svg></button>
  </div>
  <div class="stats">
    <div class="lives" id="lives" aria-label="Lives"></div>
    <div class="stat"><b id="score">0</b><span>Score</span></div>
    <div class="stat"><b id="best">0</b><span>Best</span></div>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="c" aria-label="Whack-a-Pipe game board"></canvas>

  <div class="overlay" id="start">
    <img src="/assets/mojo-front.png" alt="" width="638" height="1100">
    <h1>Whack-a-Pipe</h1>
    <p>Pipes are rising. Tap each one before it crosses the red line. Let three through and you're cursed. Hit a glowing <strong>voodoo pipe</strong> to wipe the board and slow things down.</p>
    <div class="btns"><button class="primary" id="go">Start</button></div>
    <p class="who" id="who"></p>
  </div>

  <div class="overlay" id="paused" hidden>
    <h1>Paused</h1>
    <p>Mojo's holding the pipes. Take your time.</p>
    <div class="btns"><button class="primary" id="resume">Resume</button></div>
  </div>

  <div class="overlay" id="over" hidden>
    <img src="/assets/mojo-34.png" alt="" width="716" height="1102">
    <h1 class="cursed">Cursed</h1>
    <div class="rankbox" id="rankBox" hidden><span class="ch" id="rankCh"></span><div><span class="promo" id="rankPromo"></span><b id="rankName"></b><span id="rankNext"></span></div></div>
    <p id="overText"></p>
    <p class="newtro" id="newTro" hidden></p>
    <div class="btns">
      <button class="primary" id="again">Play again</button>
      <a class="btn ghost" href="/play">Games</a>
    </div>
    <div class="lb-slot" id="lb"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<p class="wver">Whack v1.1</p>
<script src="/lb.js"></script>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,LANES=4,laneW=0,pipeW=0,dangerY=0;
let paused=false;
let phase='play',phaseT=0,nextBreak=100,banner='',bannerAt=0,roundVoodoo=0,lowLifeScore=-1,roundTro=[];
/* chevron rank (Whack-a-Pipe): a chevron for every 100 points of your best score */
const CTIERS=[{name:'Bronze',light:'#f3c08a',mid:'#c4813f',dark:'#6e3f17',edge:'#3b1f08'},{name:'Silver',light:'#ffffff',mid:'#c9ced6',dark:'#6b7280',edge:'#2b2f36'},
  {name:'Gold',light:'#fff1a8',mid:'#e9b93a',dark:'#8a5f10',edge:'#3d2804'},{name:'Diamond',light:'#ffffff',mid:'#9fe8ff',dark:'#3aa7d6',edge:'#0b3550'}];
function chevrons(r){
  const tier=Math.min(3,Math.floor(Math.max(0,r-1)/5)),count=r<=0?0:r>20?5:((r-1)%5)+1,t=CTIERS[tier];
  let s='<defs><linearGradient id="cg'+tier+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+t.light+'"/><stop offset=".55" stop-color="'+t.mid+'"/><stop offset="1" stop-color="'+t.dark+'"/></linearGradient></defs>';
  for(let i=0;i<5;i++){const y=150-i*28,d='M28 '+(y+38)+'L100 '+y+'L172 '+(y+38)+'L172 '+(y+58)+'L100 '+(y+20)+'L28 '+(y+58)+'Z';
    s+=i<count?'<path d="'+d+'" fill="url(#cg'+tier+')" stroke="'+t.edge+'" stroke-width="4" stroke-linejoin="round"/>':'<path d="'+d+'" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-dasharray="4 4"/>'}
  if(r>20)s+='<circle cx="100" cy="104" r="22" fill="#0b1f2e" stroke="'+t.mid+'" stroke-width="3"/><text x="100" y="112" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#fff">'+r+'</text>';
  return '<svg viewBox="0 0 200 200">'+s+'</svg>';
}
function chevName(r){if(!r)return 'No rank yet';const t=CTIERS[Math.min(3,Math.floor((r-1)/5))].name;return r>20?t+' '+r:t+' · '+(((r-1)%5)+1)+' chevron'+(((r-1)%5)?'s':'')}

/* trophies, kept on this device for each player */
const WTRO=[
  {id:'z100',name:'Swamp Smasher',desc:'Score 100'},{id:'z200',name:'Bone Breaker',desc:'Score 200'},
  {id:'z300',name:'Gold Digger',desc:'Score 300'},{id:'z400',name:'Fireproof',desc:'Score 400'},
  {id:'clean',name:'Clean Hands',desc:'Score 100 without losing a life'},{id:'streak50',name:'Hot Streak',desc:'50 whacks in a row'},
  {id:'voodoo5',name:'Voodoo Master',desc:'5 voodoo pipes in one round'},{id:'comeback',name:'Comeback Kid',desc:'Score 200 after dropping to your last life'},
  {id:'grinder',name:'Grinder',desc:'Play 100 rounds'}
];
const wkey=()=>{const a=window.PMLB&&PMLB.account();return a?String(a.name).toLowerCase().replace(/ /g,''):''};
function wTro(){try{return JSON.parse(localStorage.getItem('pm-whack-tro:'+wkey())||'[]')}catch(e){return[]}}
function wRounds(){try{return +localStorage.getItem('pm-whack-rounds:'+wkey())||0}catch(e){return 0}}
let toastQ=[],toastOn=false;
function toast(m){toastQ.push(m);if(!toastOn)nextToast()}
function nextToast(){const m=toastQ.shift();if(!m){toastOn=false;return}toastOn=true;const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');
  setTimeout(()=>{el.classList.remove('on');setTimeout(nextToast,350)},2200)}
function award(id){const have=wTro();if(have.includes(id))return;have.push(id);try{localStorage.setItem('pm-whack-tro:'+wkey(),JSON.stringify(have))}catch(e){}
  const t=WTRO.find(x=>x.id===id);roundTro.push(t.name);toast('🏆 '+t.name);Snd.cheer()}

/* Mojo's real voice (the boss clip) for the big moments */
const VOICE={};let voiceLoading=false;
function loadVoice(){if(voiceLoading||!Snd.ac)return;voiceLoading=true;
  for(const n of ['letswork','bayou','graveyard','voodoogold','hellfire','golden','voodoo','newrecord','cursed'])
    fetch('/assets/mojo-'+n+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(a=>new Promise((ok,no)=>Snd.ac.decodeAudioData(a,ok,no))).then(b=>{VOICE[n]=b}).catch(()=>{})}
function voice(n,delay){if(!Snd.on||!Snd.ac||!VOICE[n])return;const s=Snd.ac.createBufferSource(),g=Snd.ac.createGain();s.buffer=VOICE[n];g.gain.value=1.4;s.connect(g);g.connect(Snd.master);s.start(Snd.ac.currentTime+(delay||0))}

let pipes=[],bursts=[],flash=0,vflash=0,score=0,lives=3,best=0,running=false,spawnT=0,last=0,streak=0;
let heat=0,sinceVoodoo=0,voodoosUsed=0; // heat drives the pace; the voodoo pipe cools it down, a little less each time
/* zones every 100 points, like Flow: the pipes and backdrop change as you climb */
const WZ=[
  {name:'The Basement',copper:'#c97a3d',dark:'#8f4f22',hl:'rgba(255,214,170,.35)',water:'#00e5ff',
   bg:'radial-gradient(ellipse 90% 60% at 50% 100%, rgba(91,26,170,.35) 0%, transparent 70%),linear-gradient(180deg,#0d0610,#080508)'},
  {name:'The Bayou',copper:'#8a5a36',dark:'#5a3a22',hl:'rgba(220,170,120,.3)',water:'#7fbf3f',
   bg:'radial-gradient(ellipse 90% 60% at 50% 100%, rgba(80,130,40,.35) 0%, transparent 70%),linear-gradient(180deg,#0a0d08,#060805)'},
  {name:'The Graveyard',copper:'#d8d0c0',dark:'#968c7a',hl:'rgba(255,255,255,.5)',water:'#7fdcff',
   bg:'radial-gradient(ellipse 90% 60% at 50% 0%, rgba(150,170,200,.22) 0%, transparent 70%),linear-gradient(180deg,#0b0b12,#07070b)'},
  {name:'Voodoo Gold',copper:'#d9a73a',dark:'#8f6a1e',hl:'rgba(255,240,190,.5)',water:'#b45cff',
   bg:'radial-gradient(ellipse 90% 60% at 50% 100%, rgba(120,40,220,.45) 0%, transparent 70%),linear-gradient(180deg,#0e0616,#08040d)'},
  {name:'Hellfire',copper:'#3a3133',dark:'#1a1214',hl:'rgba(255,120,70,.35)',water:'#ff5a1f',
   bg:'radial-gradient(ellipse 90% 60% at 50% 100%, rgba(230,60,20,.40) 0%, transparent 70%),linear-gradient(180deg,#140505,#0a0303)'}
];
let zone=0,P=WZ[0];
function setZone(z){zone=z;P=WZ[z];stage.style.background=P.bg}
let mojoHitAt=-9999,mojoMissAt=-9999,ganjaHitAt=-9999,ganjaMissAt=-9999;
let quip='',quipAt=-9999,gpop='',gpopAt=-9999,gpopBad=false;
try{best=parseInt(localStorage.getItem('pm-whack-best')||'0',10)||0}catch(e){}
$('best').textContent=best;

/* ---------- leaderboard ---------- */
const LB=window.PMLB?PMLB.mount($('lb'),{game:'whack',title:'Top 10'}):null;
if(LB)LB.refresh();
function showWho(){
  const el=$('who');if(!el||!window.PMLB)return;
  const a=PMLB.account(),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  el.innerHTML=a?'Playing as <b>'+esc(a.name)+'</b><button type="button" id="whoSwitch">Switch player</button>'
               :'Not signed in. After your round you can claim a name or sign in to post your score.';
  const b=$('whoSwitch');if(b)b.addEventListener('click',()=>PMLB.switchPlayer());
}
showWho();
if(window.PMLB)PMLB.onChange(showWho);

/* ---------- character art ---------- */
const IMG={};
for(const k of['mojo-34','ganja-front']){const im=new Image();im.src='/assets/'+k+'.png';IMG[k]=im}
const ready=im=>im&&im.complete&&im.naturalWidth>0;

/* ---------- sound (synthesized, no files) ---------- */
const Snd={
  ac:null,on:true,master:null,noiseBuf:null,
  unlock(){
    if(this.ac){if(this.ac.state==='suspended')this.ac.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    this.ac=new AC();
    this.master=this.ac.createGain();this.master.gain.value=0.55;this.master.connect(this.ac.destination);
    const len=this.ac.sampleRate;this.noiseBuf=this.ac.createBuffer(1,len,this.ac.sampleRate);
    const d=this.noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  },
  tone(f,dur,type,vol,slide,delay){
    if(!this.on||!this.ac)return;
    const c=this.ac,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.03);
  },
  noise(dur,f1,f2,vol,delay,q){
    if(!this.on||!this.ac)return;
    const c=this.ac,t=c.currentTime+(delay||0),s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.noiseBuf;bp.type='bandpass';bp.Q.value=q||1.2;
    bp.frequency.setValueAtTime(f1,t);bp.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(bp);bp.connect(g);g.connect(this.master);s.start(t);s.stop(t+dur+0.03);
  },
  whack(k){
    this.tone(240,0.08,'square',0.08,120);this.tone(110,0.1,'sine',0.28,65);
    this.noise(0.06,3200,1400,0.16);
    const f=300+Math.min(k,20)*28;this.tone(f,0.12,'sine',0.16,f*2,0.03);
  },
  miss(){this.tone(170,0.35,'sawtooth',0.1,55);this.noise(0.3,500,120,0.22,0,0.8)},
  over(){[330,247,165].forEach((f,i)=>this.tone(f,0.32,'triangle',0.18,f*0.8,i*0.22));this.noise(0.9,900,90,0.2,0.5,0.7)},
  start(){this.tone(392,0.12,'triangle',0.15);this.tone(587,0.18,'triangle',0.14,null,0.1)},
  cheer(){[523,659,784].forEach((f,i)=>this.tone(f,0.14,'triangle',0.12,null,i*0.07))},
  voodoo(){this.noise(0.7,200,4000,0.3,0,0.7);[196,247,294,392].forEach((f,i)=>this.tone(f,0.6,'sawtooth',0.07,f*1.5,i*0.05));this.tone(784,0.5,'triangle',0.14,1568,0.3);[0,0.08,0.16,0.24].forEach(d=>this.tone(500+Math.random()*500,0.1,'sine',0.12,1400,0.25+d))}
};
try{Snd.on=localStorage.getItem('pm-sound')!=='off'}catch(e){}
function syncSoundBtn(){const b=$('sound');b.textContent=Snd.on?'Sound on':'Sound off';b.setAttribute('aria-pressed',String(Snd.on))}
syncSoundBtn();
$('sound').addEventListener('click',()=>{
  Snd.on=!Snd.on;syncSoundBtn();Snd.unlock();
  try{localStorage.setItem('pm-sound',Snd.on?'on':'off')}catch(e){}
  if(Snd.on)Snd.start();
});
document.addEventListener('pointerdown',()=>{Snd.unlock();loadVoice()},{passive:true});

function drawLives(){
  const el=$('lives');el.innerHTML='';
  for(let i=0;i<3;i++){const s=document.createElement('span');s.className='pin'+(i>=lives?' lost':'');el.appendChild(s)}
}
drawLives();

function resize(){
  const r=stage.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  laneW=W/LANES;pipeW=Math.min(laneW*0.5,64);dangerY=Math.max(96,Math.min(150,H*0.2));
}
window.addEventListener('resize',resize);
resize();

/* difficulty: faster ramp than before, more doubles, triples late */
function speed(){return (H*0.17)+heat*H*0.0078}
function spawnGap(){return Math.max(0.36,1.2-heat*0.033)}
function spawnCount(){
  if(heat>=25&&Math.random()<0.15)return 3;
  if(heat>=5&&Math.random()<Math.min(0.55,0.3+heat*0.01))return 2;
  return 1;
}
/* voodoo pipe: shows up after 15 points, roughly every 20-30 whacks, never two at once */
function wantVoodoo(){
  return score>=15&&sinceVoodoo>=20&&!pipes.some(p=>p.voodoo)&&Math.random()<0.35;
}

function freeLane(){
  const busy=new Set(pipes.filter(p=>p.y>H-pipeW*3).map(p=>p.lane));
  const open=[];for(let i=0;i<LANES;i++)if(!busy.has(i))open.push(i);
  return open.length?open[Math.floor(Math.random()*open.length)]:-1;
}
function spawn(){
  const n=spawnCount();
  for(let k=0;k<n;k++){
    const lane=freeLane();if(lane<0)return;
    const voodoo=k===0&&wantVoodoo();
    pipes.push({lane,voodoo,x:lane*laneW+laneW/2,y:H+10,len:H*(0.16+Math.random()*0.1),v:speed()*(voodoo?0.85:(0.9+Math.random()*0.25))});
    if(voodoo)sinceVoodoo=0;
  }
}

function drawVoodooPipe(p,t){
  const x=p.x-pipeW/2,y=p.y,w=pipeW,len=p.len,pulse=0.5+0.5*Math.sin(t/140);
  // aura
  ctx.fillStyle='rgba(155,80,255,'+(0.10+0.12*pulse)+')';ctx.fillRect(x-16,y-14,w+32,len+20);
  ctx.fillStyle='rgba(155,80,255,'+(0.08+0.08*pulse)+')';ctx.fillRect(x-26,y-24,w+52,len+40);
  // body
  ctx.fillStyle='#120a1a';ctx.fillRect(x-3,y,w+6,len);
  ctx.fillStyle='#6a22c4';ctx.fillRect(x,y,w,len);
  ctx.fillStyle='rgba(230,200,255,.35)';ctx.fillRect(x+w*0.18,y,w*0.14,len);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x+w*0.72,y,w*0.28,len);
  ctx.fillStyle='#f5c842';
  for(let b=y+len*0.3;b<y+len;b+=len*0.3)ctx.fillRect(x-2,b,w+4,5);
  // flange
  ctx.fillStyle='#120a1a';ctx.fillRect(x-9,y-4,w+18,18);
  ctx.fillStyle='#f5c842';ctx.fillRect(x-7,y-2,w+14,14);
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(x-7,y-2,w+14,3);
  // voodoo pin sticking out the top
  ctx.strokeStyle='#d9d4cc';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,y-4);ctx.lineTo(p.x,y-26);ctx.stroke();
  ctx.fillStyle='#e8281e';ctx.beginPath();ctx.arc(p.x,y-29,6+pulse*1.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(p.x-2,y-31,2,0,Math.PI*2);ctx.fill();
}
function drawPipe(p,t){
  if(p.voodoo){drawVoodooPipe(p,t);return}
  const x=p.x-pipeW/2,y=p.y,w=pipeW,len=p.len;
  ctx.fillStyle='#120a1a';ctx.fillRect(x-3,y,w+6,len);
  ctx.fillStyle=P.copper;ctx.fillRect(x,y,w,len);
  ctx.fillStyle=P.hl;ctx.fillRect(x+w*0.18,y,w*0.14,len);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(x+w*0.72,y,w*0.28,len);
  ctx.fillStyle=P.dark;
  for(let b=y+len*0.45;b<y+len;b+=len*0.45)ctx.fillRect(x-2,b,w+4,5);
  ctx.fillStyle='#120a1a';ctx.fillRect(x-9,y-4,w+18,18);
  ctx.fillStyle=P.dark;ctx.fillRect(x-7,y-2,w+14,14);
  ctx.fillStyle=P.hl;ctx.fillRect(x-7,y-2,w+14,3);
  ctx.fillStyle='#0b0710';ctx.fillRect(x+3,y-2,w-6,6);
  ctx.fillStyle=P.water;ctx.fillRect(x+5,y-1,w-10,3);
}

function drawDanger(t){
  const a=0.55+0.25*Math.sin(t/180);
  ctx.fillStyle='rgba(232,40,30,.07)';ctx.fillRect(0,0,W,dangerY);
  ctx.strokeStyle='rgba(232,40,30,'+a+')';ctx.lineWidth=3;ctx.setLineDash([12,9]);
  ctx.beginPath();ctx.moveTo(0,dangerY);ctx.lineTo(W,dangerY);ctx.stroke();ctx.setLineDash([]);
}

/* ---------- Mojo & Ganja on the ledge ---------- */
function drawSprite(im,cx,bottom,h,ang,ox){
  const w=h*im.naturalWidth/im.naturalHeight;
  ctx.save();ctx.translate(cx+(ox||0),bottom);ctx.rotate(ang||0);
  ctx.drawImage(im,-w/2,-h,w,h);
  ctx.restore();
}
function drawCrew(t){
  const floor=dangerY-6;
  // Mojo: idle bob, wrench swing on hit, shake on miss
  if(ready(IMG['mojo-34'])){
    const h=Math.min(dangerY-10,128);
    const sinceHit=(t-mojoHitAt)/1000,sinceMiss=(t-mojoMissAt)/1000;
    let ang=Math.sin(t/600)*0.02,ox=0,lift=0;
    if(sinceHit<0.28){const p=sinceHit/0.28;ang+=-0.22*Math.sin(p*Math.PI);lift=6*Math.sin(p*Math.PI)}
    if(sinceMiss<0.45){ox=Math.sin(sinceMiss*60)*6*(1-sinceMiss/0.45)}
    drawSprite(IMG['mojo-34'],W*0.15,floor-lift,h,ang,ox);
    // Mojo's speech bubble
    const age=(t-quipAt)/1000;
    if(quip&&age<1.1){
      const a=age<0.9?1:1-(age-0.9)/0.2;
      ctx.font='800 14px Nunito, system-ui, sans-serif';
      const tw=ctx.measureText(quip).width,bw=tw+18,bh=26;
      let bx=W*0.15+h*0.24,by=Math.max(6,floor-h*0.98);
      if(bx+bw>W*0.68)bx=W*0.68-bw;
      ctx.globalAlpha=a;
      ctx.fillStyle='#f2ece2';
      bubble(bx,by,bw,bh,8);ctx.fill();
      ctx.beginPath();ctx.moveTo(bx+10,by+bh);ctx.lineTo(bx-2,by+bh+8);ctx.lineTo(bx+22,by+bh);ctx.closePath();ctx.fill();
      ctx.fillStyle='#120a1a';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(quip,bx+bw/2,by+bh/2+1);
      ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
    }
  }
  // Ganja: hops on hits, flinches on misses, and pops symbols instead of talking
  if(ready(IMG['ganja-front'])){
    const h=Math.min((dangerY-10)*0.72,96);
    const sinceHit=(t-ganjaHitAt)/1000,sinceMiss=(t-ganjaMissAt)/1000;
    let hop=0,ang=Math.sin(t/420)*0.04,ox=0;
    if(sinceHit<0.3)hop=12*Math.sin((sinceHit/0.3)*Math.PI);
    if(sinceMiss<0.45){ox=Math.sin(sinceMiss*70)*5*(1-sinceMiss/0.45);ang+=0.12*(1-sinceMiss/0.45)}
    drawSprite(IMG['ganja-front'],W*0.86,floor-hop,h,ang,ox);
    const age=(t-gpopAt)/1000;
    if(gpop&&age<0.8){
      const a=age<0.55?1:1-(age-0.55)/0.25;
      const px=Math.min(W-24,W*0.86+h*0.22),py=Math.max(18,floor-h-6-hop-age*18);
      ctx.globalAlpha=a;
      ctx.font='900 '+(20+Math.min(age,0.15)*40)+'px Nunito, system-ui, sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=4;ctx.strokeStyle='#120a1a';ctx.strokeText(gpop,px,py);
      ctx.fillStyle=gpopBad?'#ff5a4f':'#f5c842';ctx.fillText(gpop,px,py);
      ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
    }
  }
}
function bubble(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
const HIT_QUIPS=['Yes!','Nice!','Who dat!','Clean!','Get it!'];
const MISS_QUIPS=['Watch it!','Noooo!','Focus!','Aye!'];
const STREAK_QUIPS=['On fire!','Ten straight!','Unstoppable!'];
const pick=list=>list[Math.floor(Math.random()*list.length)];
function say(list,t){quip=pick(list);quipAt=t}                 // Mojo talks
function pop(list,t,bad){gpop=pick(list);gpopAt=t;gpopBad=!!bad} // Ganja reacts

function drawBursts(dt){
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];b.t+=dt;
    if(b.t>0.5){bursts.splice(i,1);continue}
    for(const d of b.drops){
      const px=b.x+d.vx*b.t,py=b.y+d.vy*b.t+260*b.t*b.t;
      ctx.globalAlpha=1-b.t/0.5;ctx.fillStyle=d.c;
      ctx.beginPath();ctx.arc(px,py,d.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(245,200,66,'+(1-b.t/0.5)+')';ctx.font='800 20px Nunito, sans-serif';ctx.textAlign='center';
    ctx.fillText('+1',b.x,b.y-30-b.t*40);
  }
}
function burst(x,y){
  const drops=[];
  for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=80+Math.random()*160;
    drops.push({vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,r:2+Math.random()*4,c:Math.random()<.6?P.water:P.copper})}
  bursts.push({x,y,t:0,drops});
}

function frame(t){
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  ctx.clearRect(0,0,W,H);
  drawDanger(t);
  drawCrew(t);
  if(running&&!paused&&phase!=='play')breakStep(dt,t);
  else if(running&&!paused){
    spawnT-=dt;
    if(spawnT<=0){spawn();spawnT=spawnGap()}
    for(let i=pipes.length-1;i>=0;i--){
      const p=pipes[i];p.y-=p.v*dt;
      if(p.y<=dangerY){pipes.splice(i,1);if(!p.voodoo)loseLife(t)}
    }
  }
  for(const p of pipes)p.gold?drawGoldPipe(p,t):drawPipe(p,t);
  drawBursts(dt);
  drawBanner(t);
  if(flash>0){ctx.fillStyle='rgba(232,40,30,'+(flash*0.35)+')';ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*2.5)}
  if(vflash>0){ctx.fillStyle='rgba(155,80,255,'+(vflash*0.45)+')';ctx.fillRect(0,0,W,H);vflash=Math.max(0,vflash-dt*1.6)}
  requestAnimationFrame(frame);
}

/* every 100 points: the pipes drain away for a breather, then a golden rush, then back to it a little faster */
const ZONE_LINE={1:'bayou',2:'graveyard',3:'voodoogold',4:'hellfire'};
function roundChecks(){
  if(score>=100&&lives===3)award('clean');
  if(streak>=50)award('streak50');
  if(roundVoodoo>=5)award('voodoo5');
  if(lowLifeScore>=0&&lowLifeScore<200&&score>=200)award('comeback');
}
function maybeBreak(t){
  if(phase!=='play'||score<nextBreak)return;
  const k=Math.floor(score/100);nextBreak=(k+1)*100;
  phase='break';phaseT=2.6;for(const p of pipes)p.drain=true;
  banner=k<=4?WZ[Math.min(WZ.length-1,k)].name:k*100+'!';bannerAt=t;
  if(ZONE_LINE[k])voice(ZONE_LINE[k],.15);
  ['z100','z200','z300','z400'].forEach((id,i)=>{if(score>=(i+1)*100)award(id)});
}
function breakStep(dt,t){
  phaseT-=dt;
  for(let i=pipes.length-1;i>=0;i--){const p=pipes[i];
    if(p.drain){p.y+=H*1.4*dt;if(p.y>H+20)pipes.splice(i,1);continue}
    p.y-=p.v*dt;if(p.y<=dangerY)pipes.splice(i,1); // golden pipes that get away cost nothing
  }
  if(phase==='break'&&phaseT<=0){phase='rush';phaseT=5;spawnT=.2;banner='Golden rush!';bannerAt=t;voice('golden')}
  else if(phase==='rush'){
    spawnT-=dt;
    if(spawnT<=0&&phaseT>.8){const lane=freeLane();if(lane>=0)pipes.push({lane,gold:true,x:lane*laneW+laneW/2,y:H+10,len:H*(.14+Math.random()*.06),v:speed()*.75});spawnT=.32}
    if(phaseT<=0){phase='play';for(const p of pipes)if(p.gold)burst(p.x,p.y);pipes=pipes.filter(p=>!p.gold);spawnT=1;heat+=2;banner='';}
  }
}
function drawGoldPipe(p,t){
  const x=p.x-pipeW/2,y=p.y,w=pipeW,len=p.len,s=.5+.5*Math.sin(t/120+p.x);
  ctx.fillStyle='rgba(255,215,90,'+(.12+.12*s)+')';ctx.fillRect(x-14,y-12,w+28,len+18);
  ctx.fillStyle='#3a2604';ctx.fillRect(x-3,y,w+6,len);
  ctx.fillStyle='#e9b93a';ctx.fillRect(x,y,w,len);
  ctx.fillStyle='rgba(255,250,210,.7)';ctx.fillRect(x+w*.18,y,w*.14,len);
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x+w*.72,y,w*.28,len);
  ctx.fillStyle='#3a2604';ctx.fillRect(x-9,y-4,w+18,18);ctx.fillStyle='#fff1a8';ctx.fillRect(x-7,y-2,w+14,14);
  ctx.fillStyle='#fff';ctx.globalAlpha=s;ctx.beginPath();ctx.arc(x+w*.3,y+len*.3,3,0,6.28);ctx.fill();ctx.globalAlpha=1;
}
function drawBanner(t){
  if(!banner||(phase==='play'))return;
  const age=(t-bannerAt)/1000,a=Math.min(1,age*4)*(phase==='rush'?Math.max(0,1-(age-1.4)/.6):1),sc=1+Math.max(0,.3-age)*1.5;if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H*.48);ctx.scale(sc,sc);
  ctx.font='400 '+Math.min(64,W*.13)+'px "Pirata One", Georgia, serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=6;ctx.strokeStyle='#000';ctx.strokeText(banner,0,0);ctx.fillStyle=phase==='rush'?'#f5c842':P.water;ctx.fillText(banner,0,0);
  ctx.font='800 '+Math.min(17,W*.04)+'px Nunito, sans-serif';ctx.lineWidth=4;
  const sub=phase==='rush'?'Golden pipes +2. No lives at risk.':'Catch your breath…';ctx.strokeText(sub,0,Math.min(48,W*.1));ctx.fillStyle='#fff';ctx.fillText(sub,0,Math.min(48,W*.1));
  ctx.restore();
}
function loseLife(t){
  lives--;flash=1;streak=0;drawLives();
  if(lives===1&&lowLifeScore<0)lowLifeScore=score;
  mojoMissAt=t;ganjaMissAt=t;say(MISS_QUIPS,t);pop(['#@%!','?!'],t,true);
  if(lives<=0){gameOver();return}
  Snd.miss();
}

function gameOver(){
  running=false;paused=false;$('paused').hidden=true;$('pause').hidden=true;Snd.over();
  const prevBest=best,isBest=score>best;phase='play';banner='';
  try{localStorage.setItem('pm-whack-rounds:'+wkey(),String(wRounds()+1))}catch(e){}
  if(wRounds()>=100)award('grinder');
  if(isBest){best=score;try{localStorage.setItem('pm-whack-best',String(best))}catch(e){};$('best').textContent=best}
  $('overText').innerHTML='You whacked <strong>'+score+'</strong> pipe'+(score===1?'':'s')+'.'+(isBest&&score>0?' New best.':' Best is '+best+'.');
  if(LB)LB.post(score);
  const r=Math.floor(best/100),promoted=Math.floor(best/100)>Math.floor(prevBest/100);
  $('rankBox').hidden=r<1;$('rankCh').innerHTML=r?chevrons(r):'';$('rankName').textContent=chevName(r);
  $('rankPromo').textContent=promoted?'Promoted!':'Your rank';$('rankNext').textContent=' Next chevron at '+(r+1)*100;
  $('newTro').hidden=!roundTro.length;$('newTro').textContent='🏆 New this round: '+roundTro.join(', ');
  voice(isBest&&score>0?'newrecord':'cursed',.6);
  setTimeout(()=>{$('over').hidden=false;$('over').scrollTop=0;$('again').focus()},700);
}

function checkZone(t){
  const z=Math.min(WZ.length-1,Math.floor(score/100));
  if(z>zone){setZone(z);quip=WZ[z].name+'!';quipAt=t;pop(['!!!'],t);vflash=0.5;Snd.cheer()}
}
function voodooBlast(t){
  // every pipe on screen pops and scores, and the pace cools way down
  for(const q of pipes){burst(q.x,q.y);score++}
  pipes=[];streak++;
  heat=Math.floor(heat*Math.min(0.7,0.4+0.02*voodoosUsed));voodoosUsed++;
  checkZone(t);roundVoodoo++;roundChecks();maybeBreak(t);
  spawnT=1.4;vflash=1;
  $('score').textContent=score;
  mojoHitAt=t;ganjaHitAt=t;quip='Voodoo!';quipAt=t;pop(['!!!'],t);
  Snd.voodoo();voice('voodoo',.25);
}

function start(){
  Snd.unlock();Snd.start();
  pipes=[];bursts=[];score=0;lives=3;flash=0;vflash=0;spawnT=0.5;running=true;streak=0;quip='';gpop='';heat=0;sinceVoodoo=0;voodoosUsed=0;setZone(0);
  $('score').textContent=0;drawLives();
  phase='play';phaseT=0;nextBreak=100;banner='';roundVoodoo=0;lowLifeScore=-1;roundTro=[];voice('letswork',.2);
  $('start').hidden=true;$('over').hidden=true;
  paused=false;$('paused').hidden=true;$('pause').hidden=false;$('pause').innerHTML=PAUSE_ICON;$('pause').setAttribute('aria-label','Pause');
  if(LB)LB.startRun();
}

cv.addEventListener('pointerdown',e=>{
  if(!running||paused)return;
  e.preventDefault();
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,pad=14;
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i];if(p.drain)continue;
    if(x>p.x-pipeW/2-pad&&x<p.x+pipeW/2+pad&&y>p.y-pad-10&&y<p.y+p.len+pad){
      const t=performance.now();
      if(p.voodoo){voodooBlast(t);return}
      if(p.gold){pipes.splice(i,1);score+=2;$('score').textContent=score;burst(p.x,p.y);Snd.whack(12);ganjaHitAt=t;return}
      pipes.splice(i,1);score++;streak++;heat++;sinceVoodoo++;$('score').textContent=score;burst(p.x,p.y);roundChecks();maybeBreak(t);
      Snd.whack(streak);mojoHitAt=t;ganjaHitAt=t;
      const zBefore=zone;checkZone(t);
      if(zone!==zBefore){}
      else if(streak%10===0){say(STREAK_QUIPS,t);pop(['!!!'],t);Snd.cheer()}
      else{
        if(Math.random()<0.18)say(HIT_QUIPS,t);
        if(Math.random()<0.22)pop(['!','!!'],t);
      }
      return;
    }
  }
});
const PAUSE_ICON='<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="3.6" height="12" rx="1"/><rect x="8.4" y="1" width="3.6" height="12" rx="1"/></svg>',PLAY_ICON='<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3 1.2v11.6a.6.6 0 0 0 .9.5l9.2-5.8a.6.6 0 0 0 0-1L3.9.7a.6.6 0 0 0-.9.5z"/></svg>';
function setPause(on){
  if(on&&!running)return;
  paused=on;$('paused').hidden=!on;
  const b=$('pause');b.innerHTML=on?PLAY_ICON:PAUSE_ICON;b.setAttribute('aria-label',on?'Resume':'Pause');b.setAttribute('aria-pressed',String(on));
  if(!on)last=performance.now();
  if(!on)$('pause').blur();else setTimeout(()=>$('resume').focus(),50);
}
$('pause').addEventListener('click',()=>setPause(!paused));
$('resume').addEventListener('click',()=>setPause(false));
$('go').addEventListener('click',start);
$('again').addEventListener('click',start);
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden&&running&&!paused)setPause(true)}); // leaving the app pauses the round

requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
</body>
