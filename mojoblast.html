<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0710">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mojo Blast">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/mojoblast-icon.png">
<link rel="manifest" href="/mojoblast.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<title>Mojo Blast | Pipe Mojo</title>
<!--
  MOJO BLAST — v1.2 (Nov 9 2026)
  v1.2 fix: blank play field on iPhone Duo. Cause: Hellfire's boiling-liquid bubbles get a radius
        from how deep they sit in the liquid band; resizing (unfolding/rotating) shrinks the band, a
        bubble ends up below it, the radius goes negative, ctx.arc throws and the frame loop died.
        Radius clamped, bubbles pulled back into the band on resize. Also: One reused backdrop canvas (no new canvas per resize),
        resizes coalesced to one per frame and skipped when nothing changed, frame loop survives a
        thrown error and shows it in a red line at the bottom (#errLine) instead of going blank.
  v1.2: Best single zone board (leaderboard key 'blastz', one combined board). Zone score = points
        earned inside the current zone (run score minus the score when you entered it), so a run
        that starts mid-zone counts from there. Posts with the run score after every level clear and
        at game over. Try again resets it with the run; Restart level rolls it back with the run.
        Save gains zb[5] (best per zone, merged by max). Zone line on Game Over, Zone clear, finale.
        Rank & Board shows both boards (zone board is list-only, rides the main board's sign-in).

  MOJO BLAST — v1.1 (Nov 4 2026) — LIVE
  v1.1: after losing a life the new drop only launches on a fresh tap (a finger already down when
        the life was lost won't fire it); aim dots show the launch path (same formula as launch(),
        wall bounces, ring at the first brick/boss hit) whenever a drop is waiting on the pipe,
        including Plunger catches.

  MOJO BLAST — v1.0 (Nov 3 2026) — LIVE
  v1.0: linked from /play. lb.js (names, leaderboard game key 'blast', cloud save) and extras.js
        (daily streak, holidays, cross-game secrets). Score posted = the run's score after every
        level clear and at game over; a run can start at any unlocked level (scored from 0), so a
        full run from level 1 always scores the most. Restart level rolls the score back to the level
        start (no farming). Save = 'pm-blast-save[:name]' {v,unl,best,tro,c,savedAt}, merged by max;
        the test build's 'mojoBlast1' migrates once. Rank = marksmanship from best run (lb.js
        marksRank/marksBadge/marksName). 21 trophies + 4 secrets (same ids as BTRO/BSEC in the
        Locker). LINE'S OPEN finale on beating level 40. Title + finale use mojo-hose.png.

  MOJO BLAST — v0.5 (Nov 3 2026)
  v0.5: five bosses, one per zone (BOSSES table: image, body centre, hit ellipse, mouth, line, chunk
        and sludge colours): Root Ball (Bayou, /assets/boss-rootball.png), Fatberg (Quarter), Hairball
        (Cemetery, boss-hairball.png), Wipe Beast (Mardi Gras, boss-wipebeast.png), Scale King
        (Hellfire, boss-scaleking.png). Spit is now stretchy wobbly sludge teardrops with drip trails
        that splat into fading puddles on the floor, or splatter Mojo on the pipe. Mojo now stands
        under the pipe holding a brass hose nozzle (/assets/mojo-hose.png, nozzle tip at 81.21% x,
        26.89% y) with a code-drawn hose to a brass fitting under the pipe; he faces the way you slide.

  MOJO BLAST — v0.4.2 (Nov 3 2026)
  v0.4.2: Y0 is dynamic: 50 + 0.8*(H-520) on tall screens (iPhone ~169, iPad unchanged), so the clog
          sits lower and the standing liquid above it is deeper (more ripples/particles, boss sits
          lower in it); fittings fall at (distance to pipe)/2s, min 105 px/s, so they land in ~2s.

  MOJO BLAST — v0.4.1 (Nov 3 2026)
  v0.4.1: pipe sits at 80% of field height (was H-90); on phone-size screens (field < 520 css px
          wide) sprites are ~18% bigger: Mojo, crew, falling fittings, pipe thickness 14, drop r=6.

  MOJO BLAST — v0.4 (Nov 2 2026)
  v0.4: arcade sound overhaul (NES-style square/triangle): pipe "bip", per-brick pitches, scale
        "ting", concrete "clank", catch jingle + a sound per fitting (Coupling whomp-whomp-whomp synced
        to a 3-step widen, Tee blips, Jetter power-up + "pew" shots, Plunger thoonk, Auger bit drill),
        1-up jingle, level-start jingle, sad lost-drop tune, clear fanfare. Jetter: glowing pulsing
        nozzles, mist, hum loop, timer bar on the pipe, sputter + blink in the last 3s. Auger bit: whir
        loop, orange timer bar, sputter + blink in the last 3s. Loops stop on pause/flush/life lost/mute.

  MOJO BLAST — v0.3.2 (Nov 2 2026)
  v0.3.2: blocks the iOS long-press magnifier/selection loupe on the play field.

  MOJO BLAST — v0.3.1 (Nov 2 2026)
  v0.3.1: field re-measures whenever the stage changes size (iOS home-screen app could report its
          height late and clip the bottom); stage can shrink below the canvas; pipe sits a bit
          higher (H-90) so Mojo shows in full and there's room to rest a finger on him.

  MOJO BLAST — v0.3 (Nov 2 2026)
  v0.3: Auger renamed Auger bit (cutter-head icon); standing liquid above the clog per zone
        (swamp water, gray water, sewage, glitter grease water, boiling sewage) that drips through
        open gaps; real pipe walls in the zone material with fittings (galv threads, copper solder,
        PVC hubs with primer, brass, cast iron hubs) and corner elbows, field widened to 372 so the
        layouts don't change; the whoosh: clearing a level flushes the liquid down the whole field
        (tap skips); the Fatberg boss uses /assets/fatberg.png (code blob fallback), wobbles,
        jiggles when hit, spits from its mouth, grows each zone, breaks into chunks that get flushed.

  MOJO BLAST — v0.2 (Nov 2 2026)
  v0.2: home-screen app support (mojoblast.webmanifest + mojoblast-icon.png / -512.png in the
        repo root) with a one-time "Play full screen" tip in iOS Safari; the game pauses the moment
        a system swipe steals your finger, the page hides, or the window loses focus, and Resume
        parks the drop back on the pipe; iPhone landscape shows "Turn it upright"; wide screens
        (iPad, iPad mini, iPhone Duo in landscape) get an arcade-cabinet layout with side panels.

  MOJO BLAST — v0.1 test build (Nov 1 2026)
  Breakout-style clog buster for pipemojo.com. Unlinked test at pipemojo.com/mojoblast.
  Single self-contained file. Portrait. Art from /assets (mojo-front, ganja-front,
  fly-front, maggot-front, crawfish-front). Everything else is code-drawn.
  Sounds are synthesized. No leaderboard / trophies / ranks yet (go-live round).
  Safari-safe canvas: no ctx.filter, globalCompositeOperation, roundRect, shadowBlur.
  Save key: mojoBlast1 {unl,best}. Mute key: pipeBlastMuted.
-->
<style>
:root{--gold:#f5c842;--zone:#9fd36a;--panel:#1c1130;--line:#3d2466;--ink:#f4ecff;--dim:#b9a8d6;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0710;color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:var(--st) var(--sr) var(--sb) var(--sl)}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:52px}
#hud button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;touch-action:manipulation}
#score{font:900 20px Nunito;min-width:84px}
#lvl{flex:1;text-align:center;font-family:'Pirata One',serif;font-size:23px;color:var(--zone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lives{display:flex;gap:1px;align-items:center;min-width:60px;justify-content:flex-end}
#lives img{height:26px}
#stage{flex:1 1 auto;min-height:0;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
canvas{display:block;touch-action:none}
#stage,canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--st)) 16px calc(16px + var(--sb));background:rgba(8,4,14,.74);z-index:5}
#ov[hidden]{display:none}
.card{width:min(92vw,390px);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(#1c1130,#120a20);border:2px solid var(--line);border-radius:20px;padding:18px 16px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}
h1{font-family:'Pirata One',serif;font-weight:400;font-size:62px;margin:0;color:var(--gold);line-height:.95;text-shadow:0 3px 0 #7a3b00,0 0 22px rgba(245,200,66,.35)}
h2{font-family:'Pirata One',serif;font-weight:400;font-size:38px;margin:2px 0 4px;line-height:1}
p{margin:6px 0;color:var(--dim);font-size:15px;line-height:1.4}
.btn{display:block;width:100%;margin:8px 0 0;padding:12px;border-radius:14px;border:0;font:900 17px Nunito,sans-serif;color:#1b0f00;background:var(--gold);touch-action:manipulation}
.btn.alt{background:#2a1a45;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.hero{height:130px;margin:6px 0 2px}
.big{font:900 34px Nunito,sans-serif;color:var(--ink);margin:4px 0 0}
.crew{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:10px 0 4px}
.crew img{height:62px}
.zh{font-family:'Pirata One',serif;font-size:25px;text-align:left;margin:10px 2px 2px}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lv{padding:11px 0;border-radius:11px;border:1px solid var(--line);background:#24163b;color:var(--ink);font:900 16px Nunito,sans-serif;touch-action:manipulation}
.lv.boss{background:#3a1a24}
.lv[disabled]{opacity:.32}
.how{text-align:left;font-size:15px;line-height:1.35}
.how h3{font-family:'Pirata One',serif;font-weight:400;font-size:24px;margin:12px 0 2px;color:var(--gold)}
.how .it{display:flex;align-items:center;gap:10px;margin:7px 0;color:var(--ink)}
.how .it span{color:var(--dim)}
.how .it b{color:var(--ink)}
.how canvas,.how img{flex:0 0 auto}
.how img{height:34px;width:34px;object-fit:contain}
.ganjabub{position:relative;display:inline-block}
.ganjabub i{position:absolute;top:-8px;right:-10px;font:900 22px Nunito;color:var(--gold);font-style:normal}
.small{font-size:13px;color:var(--dim)}
#lp,#rp{display:none}
body.cab #hud{display:none}
body.cab #app{flex-direction:row}
body.cab #lp,body.cab #rp{display:flex;flex-direction:column;flex:1 1 0;min-width:0;padding:16px 14px;gap:14px;overflow:hidden}
#lp{align-items:flex-start}
#rp{align-items:flex-end;text-align:right}
#lp .menu{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:22px;touch-action:manipulation}
.pn-title{font-family:'Pirata One',serif;font-size:clamp(26px,4vw,46px);color:var(--gold);line-height:1;text-shadow:0 2px 0 #7a3b00}
.pn-zone{font-family:'Pirata One',serif;font-size:clamp(20px,2.8vw,34px);color:var(--zone);line-height:1}
.pn-lab{font-size:13px;color:var(--dim);font-weight:700}
.pn-big{font:900 clamp(22px,3vw,36px) Nunito,sans-serif;line-height:1.1}
.pn-lives{display:flex;align-items:center;gap:4px;font:900 20px Nunito,sans-serif}.pn-lives img{height:30px}
.pn-mojo{margin-top:auto;max-height:38%;max-width:100%;object-fit:contain;align-self:center}
.pn-mojo.hop{animation:hop .45s ease 2}.pn-mojo.wince{animation:wince .5s ease}
@keyframes hop{50%{transform:translateY(-16px)}}
@keyframes wince{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.pn-fit{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:#24163b;border:1px solid var(--line);font:800 14px Nunito,sans-serif}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pn-crew{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap;justify-content:flex-end}.pn-crew img{height:46px}
#rot{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0b0710;text-align:center;padding:20px}
body.rot #rot{display:flex}
#rot .ph{width:46px;height:80px;border:4px solid var(--gold);border-radius:10px;animation:turn 1.8s ease-in-out infinite}
@keyframes turn{0%,25%{transform:rotate(-90deg)}65%,100%{transform:rotate(0)}}
.steps{text-align:left;margin:10px 0 4px;padding-left:22px;color:var(--ink);line-height:1.5}
@media (prefers-reduced-motion:reduce){.pn-mojo.hop,.pn-mojo.wince,#rot .ph{animation:none}}
#toast{position:fixed;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);z-index:20;background:#241638;border:1px solid var(--gold);color:var(--ink);
  font:800 14px Nunito,sans-serif;padding:9px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.rankins svg{width:118px;height:118px}.rankins:empty{display:none}
.rn{font:900 20px Nunito,sans-serif;margin:2px 0;color:var(--ink)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}
.tile{background:#24163b;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;min-height:96px}
.tile .ta{display:flex;align-items:center;justify-content:center;height:42px;font-size:26px}.tile .ta img{max-height:42px;max-width:52px}
.tile b{display:block;font:900 12px Nunito,sans-serif;color:var(--ink);margin-top:3px}.tile small{display:block;font-size:10.5px;color:var(--dim);line-height:1.25}
.tile.locked{opacity:.33}
.finale .cup{width:132px;height:143px;margin:4px auto 0;display:block;animation:cupdrop .9s cubic-bezier(.2,.9,.3,1.25) both}
.finale .hopper{height:92px;animation:hop2 .42s ease-in-out infinite alternate}
@keyframes cupdrop{0%{transform:translateY(-140px) scale(.5);opacity:0}70%{transform:translateY(6px) scale(1.06);opacity:1}100%{transform:none}}
@keyframes hop2{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.finale .cup,.finale .hopper{animation:none}}
.lb{text-align:left;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button id="menuBtn" aria-label="Menu">☰</button>
    <div id="score">0</div>
    <div id="lvl">Mojo Blast</div>
    <div id="lives"></div>
  </div>
  <aside id="lp">
    <button class="menu" id="menuBtn2" aria-label="Menu">☰</button>
    <div class="pn-title">Mojo Blast</div>
    <div><div class="pn-zone" id="pZone"></div><div class="pn-lab" id="pLvl"></div></div>
    <div><div class="pn-lab">Score</div><div class="pn-big" id="pScore">0</div></div>
    <div class="pn-lives" id="pLives"></div>
    <img class="pn-mojo" id="pMojo" src="/assets/mojo-front.png" alt="">
  </aside>
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside id="rp">
    <div><div class="pn-lab">Best</div><div class="pn-big" id="pBest">0</div></div>
    <div><div class="pn-lab">Next extra life</div><div class="pn-big" id="pNext" style="font-size:20px"></div></div>
    <div class="pn-fit" id="pFit"></div>
    <div class="pn-crew" id="pCrew"></div>
  </aside>
</div>
<div id="rot"><div class="ph"></div><h2 style="margin-top:24px">Turn it upright</h2><p>Mojo Blast plays standing up on iPhone.</p></div>
<div id="ov" hidden></div>
<div id="toast" hidden></div>
<div id="lbHold" hidden><div id="lbBox"></div><div id="lbBoxZ"></div></div>
<script src="/lb.js"></script>
<script src="/extras.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),ov=$('ov');
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- storage ---------- */
/* saves: progress on this device (one slot per player, 'pm-blast-save' alone is the guest) and on your name when signed in */
const SK='pm-blast-save';
const nameKey=x=>String(x||'').toLowerCase().replace(/ /g,'');
const acct=()=>window.PMLB?PMLB.account():null;
const slotFor=a=>a?SK+':'+nameKey(a.name):SK;
const blankS=()=>({v:1,unl:1,best:0,zb:[0,0,0,0,0],tro:[],c:{},savedAt:0});
const zbOf=s=>[0,1,2,3,4].map(i=>Math.max(0,+((s&&s.zb)||[])[i]||0));
let SAVE=blankS(),owner='',cloudReady=false;
const snap=()=>({v:1,unl:SAVE.unl,best:SAVE.best,zb:SAVE.zb.slice(),tro:SAVE.tro.slice(),c:Object.assign({},SAVE.c),savedAt:Date.now()});
const validSave=s=>!!(s&&s.v===1&&s.unl>=1);
function loadSlot(k){try{const s=JSON.parse(localStorage.getItem(k)||'null');if(validSave(s))return s}catch(e){}return null}
function mergeSaves(a,b){ // progress only goes up, so two saves of the same player combine safely
  if(!a)return b||null;if(!b)return a;const c={};for(const k of new Set(Object.keys(a.c||{}).concat(Object.keys(b.c||{}))))c[k]=Math.max(+(a.c||{})[k]||0,+(b.c||{})[k]||0);
  return {v:1,unl:Math.max(+a.unl||1,+b.unl||1),best:Math.max(+a.best||0,+b.best||0),zb:zbOf(a).map((x,i)=>Math.max(x,zbOf(b)[i])),tro:[...new Set((a.tro||[]).concat(b.tro||[]))],c,savedAt:Math.max(+a.savedAt||0,+b.savedAt||0)};
}
function applySave(s){s=s||blankS();SAVE={v:1,unl:Math.max(1,Math.min(40,+s.unl||1)),best:Math.max(0,+s.best||0),zb:zbOf(s),tro:Array.isArray(s.tro)?s.tro.slice():[],c:Object.assign({},s.c||{}),savedAt:+s.savedAt||0}}
function saveGame(cloud){
  const a=acct();if(owner===null||nameKey(a&&a.name)!==owner)return; // never save one player's progress into another's slot
  const o=snap();try{localStorage.setItem(slotFor(a),JSON.stringify(o))}catch(e){}
  if(cloud&&a&&cloudReady&&window.PMLB)PMLB.cloudSave('blast',o);
}
const persist=()=>saveGame(true);
(function(){try{ // one-time move from the test build's save
  const old=JSON.parse(localStorage.getItem('mojoBlast1')||'null');
  if(old&&!localStorage.getItem(SK)&&!localStorage.getItem(slotFor(acct())))localStorage.setItem(slotFor(acct()),JSON.stringify(Object.assign(blankS(),{unl:+old.unl||1,best:+old.best||0,savedAt:Date.now()})));
  const a=acct();if(a&&!localStorage.getItem(slotFor(a))&&localStorage.getItem(SK)){localStorage.setItem(slotFor(a),localStorage.getItem(SK));localStorage.removeItem(SK)}
}catch(e){}})();
owner=nameKey((acct()||{}).name);applySave(loadSlot(slotFor(acct())));
let muted=false;try{muted=localStorage.getItem('pipeBlastMuted')==='1'}catch(e){}

/* ---------- images ---------- */
const IMG={};
['mojo-front','mojo-hose','ganja-front','fly-front','maggot-front','crawfish-front','fatberg','boss-rootball','boss-hairball','boss-wipebeast','boss-scaleking'].forEach(k=>{const i=new Image();i.src='/assets/'+k+'.png';IMG[k]=i});
const ok=i=>i&&i.complete&&i.naturalWidth>0;

/* ---------- field ---------- */
const W=372,WT=8,COLS=11,BW=30,BH=14,SX=32,SY=16,X0=11;
let Y0=50; // top of the clog; drops lower on tall screens so the gap to the pipe stays arcade-like
let H=640,SC=1,DPR=1,bg=null,bgCv=null,BOOST=1; // BOOST: sprites a bit bigger on phone-size screens

/* ---------- zones & levels ---------- */
const MAT={galv:['#a7b0b6','#e3e8eb','#646d73','galvanized'],copper:['#c87533','#f4b47c','#7a3f17','copper'],
  pvc:['#e6e9ec','#ffffff','#a3abb2','PVC'],brass:['#c9a227','#f5de7c','#76590c','brass'],iron:['#44484e','#787d85','#1c1e21','cast iron']};
const ZONES=[
 {name:'Bayou',pipe:'galv',acc:'#9fd36a',bg:['#12281d','#050c08'],fx:'fireflies',en:['fly'],boss:'#5a3d22',
  blurb:'Swamp water and a whole lot of grease. Bust every clog brick and keep the drop in play.'},
 {name:'French Quarter',pipe:'copper',acc:'#f0a04b',bg:['#2a160d','#0c0505'],fx:'sparks',en:['fly','maggot'],boss:'#ece3cc',
  blurb:'Old copper, older clogs. Beignet\'s crawling around in there regrowing grease, so knock him out of the line.'},
 {name:'Cemetery',pipe:'pvc',acc:'#b9c4d6',bg:['#161d29','#06080c'],fx:'fog',en:['fly','maggot'],boss:'#5a5d62',
  blurb:'Fog on the ground and roots in the drain. Some of this scale has been down here a hundred years.'},
 {name:'Mardi Gras',pipe:'brass',acc:'#c77dff',bg:['#22102f','#08030e'],fx:'confetti',en:['fly','maggot','crawfish'],boss:'#e9e4d6',
  blurb:'Beads, glitter and Roux. Hit those claws and your drop comes back hotter.'},
 {name:'Hellfire',pipe:'iron',acc:'#ff6a2a',bg:['#2c0b06','#0a0202'],fx:'embers',en:['fly','maggot','crawfish'],boss:'#ff7a1a',
  blurb:'The deepest, hottest line on the bayou. Cast iron, heavy scale, and the biggest fatberg of them all.'}

function au(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;return null}}
  if(AC.state==='suspended')AC.resume();return AC;
}
function tone(f,d,type,v,f2,delay){
  if(muted)return;const a=au();if(!a)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,ff,ft,delay){
  if(muted)return;const a=au();if(!a)return;const t=a.currentTime+(delay||0);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;f.type=ft||'bandpass';f.frequency.value=ff||1500;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+d+.03);
}

function loopStart(k){
  const a=au();if(!a)return null;const t=a.currentTime,g=a.createGain(),base=k==='jet'?.07:.045,nodes=[];
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(base,t+.15);g.connect(MG);
  const f=a.createBiquadFilter();f.connect(g);
  if(k==='jet'){f.type='lowpass';f.frequency.value=420;
    for(const [fr,ty] of [[55,'sawtooth'],[110,'square'],[56.5,'sawtooth']]){const o=a.createOscillator();o.type=ty;o.frequency.value=fr;o.connect(f);o.start(t);nodes.push(o)}}
  else{f.type='bandpass';f.frequency.value=900;f.Q.value=1.2;const o=a.createOscillator();o.type='sawtooth';o.frequency.value=170;
    const l=a.createOscillator(),lg=a.createGain();l.frequency.value=16;lg.gain.value=40;l.connect(lg);lg.connect(o.frequency);o.connect(f);o.start(t);l.start(t);nodes.push(o,l)}
  return{g,nodes,base};
}
function loopStop(L){if(!L||!AC)return;const t=AC.currentTime;L.g.gain.cancelScheduledValues(t);L.g.gain.setTargetAtTime(.0001,t,.04);L.nodes.forEach(o=>{try{o.stop(t+.3)}catch(e){}})}
function updLoops(){
  if(!AC)return;const on=mode==='play'&&!muted;
  const want={jet:on&&pad.jet>0,aug:on&&augerT>0},left={jet:pad.jet,aug:augerT};
  for(const k of ['jet','aug']){
    if(want[k]&&!LOOP[k])LOOP[k]=loopStart(k);else if(!want[k]&&LOOP[k]){loopStop(LOOP[k]);LOOP[k]=null}
    if(LOOP[k]&&left[k]<3)LOOP[k].g.gain.setTargetAtTime(Math.random()<.35?.004:LOOP[k].base,AC.currentTime,.012);
  }
}

function damage(r,c,n){
  const k=bricks[r]&&bricks[r][c];if(!k)return;
  const x=X0+c*SX+BW/2,y=Y0+r*SY+BH/2;
  if(k.t==='c'){k.f=1;sfx.clink();return}
  k.hp-=n;k.f=1;
  if(k.hp<=0){bricks[r][c]=null;remain--;addScore(PTS[k.t]);burst(x,y,BCOL[k.t][0],9);sfx.brk(k.t);maybeDrop(x,y);
    if(remain<=0)levelDone();return true}
  else{addScore(10);sfx.hit(k.t);burst(x,y,BCOL[k.t][1],3,70)}
}
function hitBricks(b,axis){
  if(!rows)return;
  const c0=Math.floor((b.x-b.r-X0)/SX),c1=Math.floor((b.x+b.r-X0)/SX),r0=Math.floor((b.y-b.r-Y0)/SY),r1=Math.floor((b.y+b.r-Y0)/SY);
  for(let r=r0;r<=r1;r++){if(r<0||r>=rows)continue;
    for(let c=c0;c<=c1;c++){if(c<0||c>=COLS)continue;const k=bricks[r][c];if(!k)continue;
      const bx=X0+c*SX,by=Y0+r*SY,px=clamp(b.x,bx,bx+BW),py=clamp(b.y,by,by+BH);
      if((b.x-px)*(b.x-px)+(b.y-py)*(b.y-py)>b.r*b.r)continue;
      const pass=augerT>0&&k.t!=='c';
      if(damage(r,c,pass?99:1)){b.combo=(b.combo||0)+1;if(b.combo>=10)award('sric')}
      if(mode!=='play')return;
      if(!pass){
        if(axis==='x'){if(b.x<bx+BW/2){b.vx=-Math.abs(b.vx);b.x=bx-b.r-.01}else{b.vx=Math.abs(b.vx);b.x=bx+BW+b.r+.01}}
        else{if(b.y<by+BH/2){b.vy=-Math.abs(b.vy);b.y=by-b.r-.01}else{b.vy=Math.abs(b.vy);b.y=by+BH+b.r+.01}}
        return;
      }
    }}
}
function paddleHit(b){
  b.combo=0;
  if(pad.mode==='catch'){b.held=true;b.caught=true;b.ox=clamp(b.x-pad.x,-pad.w/2+4,pad.w/2-4);b.holdT=0;b.y=pad.y-b.r-.5;sfx.stick();return}
  const off=clamp((b.x-pad.x)/(pad.w/2),-1,1),a=off*1.05;
  b.sp=Math.min(b.sp*1.012,G.maxSp);b.vx=b.sp*Math.sin(a);b.vy=-b.sp*Math.cos(a);b.y=pad.y-b.r-.01;
  sfx.pad();for(let i=0;i<4;i++)parts.push({x:b.x,y:pad.y,vx:rand(-60,60),vy:rand(-120,-50),t:.4,m:.4,c:'#7fd3ff',s:2});
}
function bossHit(b){
  if(b.cool>0)return;const dx=b.x-boss.x,dy=b.y-boss.y,rx=boss.rx+b.r,ry=boss.ry+b.r;
  if(dx*dx/(rx*rx)+dy*dy/(ry*ry)>=1)return;
  let nx=dx/(rx*rx),ny=dy/(ry*ry);const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
  const dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny}
  for(let i=0;i<40;i++){const ex=b.x-boss.x,ey=b.y-boss.y;if(ex*ex/(rx*rx)+ey*ey/(ry*ry)>=1)break;b.x+=nx;b.y+=ny}
  fixAng(b);b.cool=.1;hurtBoss();
}
function hurtBoss(){
  if(!boss||boss.dying)return;boss.hp--;boss.flash=.25;boss.hits++;addScore(100);sfx.bossHit();
  burst(boss.x+rand(-30,30),boss.y+boss.ry*.6,ZONES[zoneOf(G.lvl)].boss,6);
  if(boss.hits%4===0&&!caps.length)dropCap(boss.x,boss.y+boss.ry);
  if(!boss.half&&boss.hp<=Math.ceil(boss.max/2)){boss.half=1;say(SAY.half)}
  if(boss.hp<=0){boss.dying=1.5;addScore(5000);sfx.bossDie();say(SAY.bossdead);globs=[];shake(.5)}
}
function enemyHit(b){
  for(const e of enemies){if(e.dead)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=b.r+e.r;if(dx*dx+dy*dy>=rr*rr)continue;
    const l=Math.hypot(dx,dy)||1,nx=dx/l,ny=dy/l,dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny}
    b.x=e.x+nx*(rr+.5);b.y=e.y+ny*(rr+.5);

    if(e.k==='crawfish')b.sp=Math.min(b.sp*1.12,G.maxSp*1.1);

  }
}
function hurtEnemy(e){

  if(e.hp<=0){e.dead=true;bump(e.k);addScore(e.k==='crawfish'?300:150);burst(e.x,e.y,e.k==='fly'?'#6fd18a':e.k==='maggot'?'#f3ead2':'#e2452f',10);float(e.x,e.y-14,e.k==='crawfish'?'300':'150','#f5c842')}
}
function maybeDrop(x,y){if(caps.length||Math.random()>.16)return;dropCap(x,y)}
function dropCap(x,y){
  const w=[['tee',18],['coupling',20],['jet',16],['plunger',17],['auger',14],['ganja',G.lives<5?7:0]];
  let s=w.reduce((a,b)=>a+b[1],0)*Math.random(),t='tee';for(const [k,v] of w){if((s-=v)<0){t=k;break}}

  if(t==='tee'){

    for(const f of free){for(const a of [-.42,.42]){if(balls.length>=9)break;const n=Object.assign({},f,{tr:[],held:false,caught:false});rot(n,a);fixAng(n);balls.push(n)}}
  }else if(t==='coupling'){if(pad.mode==='catch')releaseHeld();pad.mode='long';if(pad.tw<96){pad.grow=0;pad.tw=74}}

}

  if(mode!=='play')return;mode='flush';flushT=0;splashed=false;drained=true;drips=[];caps=[];globs=[];blasts=[];addScore(1000);sfx.whoosh();

/* ---------- enemies ---------- */
function emptyCells(){const out=[];for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++)if(!bricks[r][c]){
  const adj=(r>0&&bricks[r-1][c])||(r<rows-1&&bricks[r+1][c])||(c>0&&bricks[r][c-1])||(c<COLS-1&&bricks[r][c+1]);if(adj)out.push([r,c])}return out}
function spawnEnemy(){
  const z=Z(),k=pick(z.en),bb=bricksBottom();
  if(k==='maggot'){const cells=emptyCells();if(!cells.length)return;const [r,c]=pick(cells);
    enemies.push({k,x:X0+c*SX+BW/2,y:-14,r:10*BOOST,hp:1,f:0,t:0,tg:[r,c],wait:0,grown:0,leave:false})}
  else if(k==='crawfish'){const s=Math.random()<.5;enemies.push({k,x:s?WT+14:W-WT-14,y:Math.min(bb+36,pad.y-130),r:12*BOOST,hp:2,f:0,t:0,vx:s?55:-55})}
  else enemies.push({k,x:rand(30,W-30),y:Math.min(bb+24,pad.y-140),r:11*BOOST,hp:1,f:0,t:0,vx:rand(-60,60),vy:rand(-40,40),turn:.6});
  if(!seen[k]){seen[k]=1;say(SAY[k],2)}
}
function updEnemies(dt){
  const bb=bricksBottom(),top=bb+10,bot=pad.y-100;
  for(const e of enemies){e.t+=dt;e.f=Math.max(0,e.f-dt);
    if(e.k==='fly'){e.turn-=dt;if(e.turn<=0){e.turn=rand(.4,1);e.vx=rand(-75,75);e.vy=rand(-55,55)}
      e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.x<WT+12){e.x=WT+12;e.vx=Math.abs(e.vx)}if(e.x>W-WT-12){e.x=W-WT-12;e.vx=-Math.abs(e.vx)}
      if(e.y<top){e.y=top;e.vy=Math.abs(e.vy)}if(e.y>bot){e.y=bot;e.vy=-Math.abs(e.vy)}}
    else if(e.k==='crawfish'){e.x+=e.vx*dt;if(e.x<WT+14){e.x=WT+14;e.vx=Math.abs(e.vx)}if(e.x>W-WT-14){e.x=W-WT-14;e.vx=-Math.abs(e.vx)}}
    else{ // maggot
      if(e.leave){e.y-=40*dt;if(e.y<-20)e.dead=true;continue}
      const tx=X0+e.tg[1]*SX+BW/2,ty=Y0+e.tg[0]*SY+BH/2,dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
      if(d>1.5){const s=Math.min(d,38*dt);e.x+=dx/d*s;e.y+=dy/d*s}
      else{e.wait+=dt;if(e.wait>1.7){e.wait=0;const [r,c]=e.tg;
        const near=balls.some(b=>Math.hypot(b.x-tx,b.y-ty)<24);
        if(!bricks[r][c]&&!near){bricks[r][c]={t:'g',hp:1,max:1,f:1};remain++;e.grown++;sfx.regrow();burst(tx,ty,'#e7bf4f',5,60)}
        const cells=emptyCells();if(e.grown>=4||!cells.length)e.leave=true;else e.tg=pick(cells)}}
    }}

}

/* ---------- boss ---------- */
function updBoss(dt){

  const k=.65+.35*Math.max(0,boss.hp)/boss.max,bw=(124+z*10)*k,bd=BOSSES[z];boss.bw=bw;boss.rx=bw*bd.rx;boss.ry=bw*bd.ry;
  boss.x=W/2+Math.sin(boss.t*.6*(1+z*.12))*(W/2-WT-bw*.5-4);boss.y=bw*bd.cy+WT+8+(Y0-50)+Math.sin(boss.t*1.3)*5;
  if(boss.dying){boss.dying-=dt;
    if(Math.random()<.7){const c=pick(bd.chunks);parts.push({x:boss.x+rand(-boss.rx,boss.rx),y:boss.y+rand(-boss.ry,boss.ry),vx:rand(-120,120),vy:rand(-160,20),t:1.3,m:1.3,c,s:rand(4,9)})}
    if(boss.dying<=0){boss=null;levelDone()}return}

      globs.push({x:boss.x,y:boss.y+boss.bw*(bd.mo-bd.cy),vx,vy,r:6,age:0})}

}

/* ---------- update ---------- */
const keys={};
function stepBall(b,dt){
  if(b.held){b.x=pad.x+b.ox;b.y=pad.y-b.r-.5;b.holdT+=dt;if(b.caught&&b.holdT>3)launch(b);return true}
  b.cool=Math.max(0,b.cool-dt);
  b.tr.push(b.x,b.y);if(b.tr.length>12)b.tr.splice(0,2);
  const n=Math.max(1,Math.ceil(b.sp*dt/3)),sdt=dt/n;
  for(let i=0;i<n;i++){
    b.x+=b.vx*sdt;
    if(b.x<WT+b.r){b.x=WT+b.r;b.vx=Math.abs(b.vx);sfx.wall()}else if(b.x>W-WT-b.r){b.x=W-WT-b.r;b.vx=-Math.abs(b.vx);sfx.wall()}
    hitBricks(b,'x');if(mode!=='play')return true;
    b.y+=b.vy*sdt;
    if(b.y<WT+b.r){b.y=WT+b.r;b.vy=Math.abs(b.vy);rot(b,rand(-.05,.05));fixAng(b);sfx.wall()}
    hitBricks(b,'y');if(mode!=='play')return true;
    if(b.vy>0&&b.y+b.r>=pad.y&&b.y-b.r<=pad.y+pad.h&&b.x>=pad.x-pad.w/2-b.r&&b.x<=pad.x+pad.w/2+b.r){paddleHit(b);if(b.held)return true}
    if(boss&&!boss.dying)bossHit(b);
    if(enemies.length)enemyHit(b);
    if(b.y-b.r>H+4){if(b.lt!=null&&t0-b.lt<2&&balls.length===1)award('sbut');return false}
  }
  return true;
}
function update(dt){
  t0+=dt;
  if(keys.ArrowLeft)pad.x-=430*dt;if(keys.ArrowRight)pad.x+=430*dt;
  pad.w+=(pad.tw-pad.w)*Math.min(1,dt*10);pad.x=clamp(pad.x,pad.w/2+WT,W-pad.w/2-WT);
  pad.hop=Math.max(0,pad.hop-dt);pad.wince=Math.max(0,pad.wince-dt);
  {const dx=pad.x-(pad.lx??pad.x);if(Math.abs(dx)>.35)pad.face=dx>0?1:-1;pad.lx=pad.x}
  if(boss){updBoss(dt);if(boss&&boss.dying)return}
  if(mode!=='play')return;
  augerT=Math.max(0,augerT-dt);
  if(pad.grow>=0){pad.grow+=dt;pad.tw=pad.grow<.13?74:pad.grow<.26?85:96;if(pad.grow>.26)pad.grow=-1}
  if(pad.jet>0&&Math.random()<dt*14&&parts.length<240)for(const nx of [pad.x-pad.w/2+5,pad.x+pad.w/2-5])parts.push({x:nx+rand(-2,2),y:pad.y-9,vx:rand(-18,18),vy:rand(-90,-40),t:.3,m:.3,c:'#bfe9ff',s:1.6});
  if(pad.jet>0){pad.jet-=dt;pad.jetCool-=dt;if(pad.jetCool<=0){pad.jetCool=.32;sfx.jet();
    blasts.push({x:pad.x-pad.w/2+5,y:pad.y-4},{x:pad.x+pad.w/2-5,y:pad.y-4})}}
  balls=balls.filter(b=>stepBall(b,dt));if(mode!=='play')return;
  if(!balls.length){loseLife();return}
  for(const b of blasts){b.y-=560*dt;
    if(rows){const c=Math.floor((b.x-X0)/SX),r=Math.floor((b.y-Y0)/SY);
      if(r>=0&&r<rows&&c>=0&&c<COLS&&bricks[r][c]&&b.x-X0-c*SX<=BW&&b.y-Y0-r*SY<=BH){damage(r,c,1);b.dead=true;if(mode!=='play')return}}
    if(!b.dead&&boss&&!boss.dying){const dx=(b.x-boss.x)/boss.rx,dy=(b.y-boss.y)/boss.ry;if(dx*dx+dy*dy<1){hurtBoss();b.dead=true}}
    if(!b.dead)for(const e of enemies){if(!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+3){hurtEnemy(e);b.dead=true;break}}
    if(b.y<-10)b.dead=true}
  blasts=blasts.filter(b=>!b.dead);
  for(const c of caps){c.y+=(c.vy||105)*dt;
    if(c.y+7>=pad.y&&c.y-7<=pad.y+pad.h&&Math.abs(c.x-pad.x)<pad.w/2+14){c.dead=true;applyCap(c.t)}
    else if(c.y>H+10)c.dead=true}
  caps=caps.filter(c=>!c.dead);
  const SL=BZ().sl;
  for(const g of globs){g.x+=g.vx*dt;g.y+=g.vy*dt;g.age+=dt;
    if(Math.random()<dt*9&&parts.length<250)parts.push({x:g.x+rand(-2,2),y:g.y-g.r*2,vx:rand(-10,10),vy:rand(-30,0),t:.45,m:.45,c:SL.c,s:rand(1.5,2.6)});
    if(g.y+g.r>=pad.y&&g.y-g.r<=pad.y+pad.h&&Math.abs(g.x-pad.x)<pad.w/2+g.r){
      for(let i=0;i<22;i++)parts.push({x:g.x,y:pad.y,vx:rand(-150,150),vy:rand(-200,-40),t:.8,m:.8,c:pick([SL.c,SL.c,SL.hi]),s:rand(2,4.5)});
      pad.slime=1.6;loseLife();return}
    if(g.y>H-10){g.dead=true;puddles.push({x:g.x,y:H-7,t:2.4,w:rand(13,19)});burst(g.x,H-8,SL.c,6,90)}}
  globs=globs.filter(g=>!g.dead);
  updEnemies(dt);
  const z=zoneOf(G.lvl),max=z===0?1:2;
  if(!boss&&(z>0||G.lvl%8>=2)){spawnT-=dt;if(spawnT<=0){spawnT=rand(9,15);if(enemies.length<max)spawnEnemy()}}
}
function updFx(dt){

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.t-=dt}parts=parts.filter(p=>p.t>0);

/* ---------- ambient zone fx ---------- */
function buildFx(){
  fx=[];const k=Z().fx;
  for(let i=0;i<(k==='fog'?7:26);i++){
    const p={x:rand(0,W),y:rand(0,H),a:rand(0,6.3),s:rand(.5,1)};
    if(k==='fireflies')p.u=dt=>{p.a+=dt*1.5;p.x+=Math.cos(p.a*.7)*10*dt;p.y+=Math.sin(p.a*.9)*8*dt;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0};
    else if(k==='sparks'||k==='embers')p.u=dt=>{p.y-=(k==='embers'?34:14)*p.s*dt;p.x+=Math.sin(p.a+=dt)*6*dt;p.a+=dt*3;if(p.y<-6){p.y=H+4;p.x=rand(0,W)}};
    else if(k==='fog'){p.y=rand(H*.25,H);p.r=rand(60,120);p.u=dt=>{p.x+=12*p.s*dt;if(p.x>W+p.r)p.x=-p.r}}
    else{p.c=pick(['#9b4dca','#2fae5c','#f5c842']);p.u=dt=>{p.y+=22*p.s*dt;p.a+=dt*2;p.x+=Math.sin(p.a)*10*dt;if(p.y>H+6){p.y=-6;p.x=rand(0,W)}}}
    p.k=k;fx.push(p);
  }
}
function drawFx(){
  for(const p of fx){
    if(p.k==='fireflies'){ctx.globalAlpha=.35+.35*Math.sin(p.a*3);ctx.fillStyle='#d9f56b';ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,6.3);ctx.fill()}
    else if(p.k==='sparks'){ctx.globalAlpha=.4*p.s;ctx.fillStyle='#ffb35a';ctx.fillRect(p.x,p.y,1.6,1.6)}
    else if(p.k==='embers'){ctx.globalAlpha=.3+.4*Math.abs(Math.sin(p.a));ctx.fillStyle=p.s>.75?'#ffd27a':'#ff6a2a';ctx.fillRect(p.x,p.y,2,2)}
    else if(p.k==='fog'){ctx.globalAlpha=.05;ctx.fillStyle='#d6e2f0';ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.35,0,0,6.3);ctx.fill()}
    else{ctx.globalAlpha=.45;ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillRect(-2,-1,4,2);ctx.restore()}
  }

}

/* ---------- static backdrop ---------- */
function buildBg(){
  // one backdrop canvas, reused: iOS Safari is slow to free old canvases, and a foldable fires lots of resizes
  if(!bgCv)bgCv=document.createElement('canvas');
  if(bgCv.width!==cv.width)bgCv.width=cv.width;if(bgCv.height!==cv.height)bgCv.height=cv.height;
  const b=bgCv.getContext('2d');if(!b){bg=null;return}bg=bgCv;b.setTransform(1,0,0,1,0,0);b.clearRect(0,0,bgCv.width,bgCv.height);
  b.setTransform(SC*DPR,0,0,SC*DPR,0,0);const z=Z(),k=z.fx;
  const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,z.bg[0]);g.addColorStop(1,z.bg[1]);b.fillStyle=g;b.fillRect(0,0,W,H);
  stage.style.background=z.bg[1];
  if(k==='fireflies'){ // moss + cattails
    b.strokeStyle='rgba(120,160,90,.18)';b.lineWidth=2;
    for(let i=0;i<14;i++){const x=i*27+8,l=30+((i*37)%60);b.beginPath();b.moveTo(x,0);b.quadraticCurveTo(x+6,l*.5,x-2,l);b.stroke()}
    b.strokeStyle='rgba(60,90,50,.5)';b.fillStyle='rgba(90,60,30,.55)';
    for(const x of [14,26,334,346]){b.beginPath();b.moveTo(x,H);b.lineTo(x+3,H-70);b.stroke();b.fillRect(x+1,H-70,5,16)}
  }else if(k==='sparks'){ // brick + railing
    b.strokeStyle='rgba(255,180,120,.05)';b.lineWidth=1;
    for(let y=0,r=0;y<H;y+=14,r++)for(let x=(r%2)*16-16;x<W;x+=32)b.strokeRect(x,y,32,14);
    b.fillStyle='rgba(0,0,0,.5)';b.fillRect(0,H-30,W,3);b.fillRect(0,H-6,W,3);
    for(let x=6;x<W;x+=14)b.fillRect(x,H-28,2,24);
  }else if(k==='fog'){ // tombs
    b.fillStyle='rgba(0,0,0,.35)';
    for(const [x,w,h] of [[18,30,44],[70,24,30],[290,30,40],[334,22,52]]){b.beginPath();b.moveTo(x,H);b.lineTo(x,H-h);b.arc(x+w/2,H-h,w/2,Math.PI,0);b.lineTo(x+w,H);b.fill()}
    b.fillRect(240,H-60,4,60);b.fillRect(230,H-48,24,4);
  }else if(k==='confetti'){ // stripes + beads
    const cs=['rgba(155,77,202,.07)','rgba(47,174,92,.07)','rgba(245,200,66,.07)'];
    for(let i=-20;i<40;i++){b.fillStyle=cs[(i+60)%3];b.beginPath();b.moveTo(i*24,0);b.lineTo(i*24+12,0);b.lineTo(i*24+12-H*.5,H);b.lineTo(i*24-H*.5,H);b.fill()}
    for(const [cx,col] of [[0,'#9b4dca'],[W,'#2fae5c']])for(let i=0;i<16;i++){const a=i/15*Math.PI*.5,x=cx===0?Math.sin(a)*90:W-Math.sin(a)*90,y=Math.cos(a)*-30+40+i*2;
      b.fillStyle=col;b.globalAlpha=.4;b.beginPath();b.arc(x,y,2.6,0,6.3);b.fill()}
    b.globalAlpha=1;
  }else{ // flames
    const fg=b.createLinearGradient(0,H-140,0,H);fg.addColorStop(0,'rgba(255,90,30,0)');fg.addColorStop(1,'rgba(255,90,30,.22)');b.fillStyle=fg;b.fillRect(0,H-140,W,140);
    b.fillStyle='rgba(60,8,4,.7)';b.beginPath();b.moveTo(0,H);for(let x=0;x<=W;x+=20)b.lineTo(x,H-20-((x*7)%30));b.lineTo(W,H);b.fill();
  }
  drawWalls(b,z);
}
function drawWalls(b,z){ // the pipe we're working inside, in this zone's material
  const m=MAT[z.pipe],p=z.pipe;
  const grad=(x0,y0,x1,y1)=>{const g=b.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,m[2]);g.addColorStop(.45,m[1]);g.addColorStop(1,m[2]);return g};
  b.fillStyle=grad(0,0,WT,0);b.fillRect(0,0,WT,H);
  b.fillStyle=grad(W,0,W-WT,0);b.fillRect(W-WT,0,WT,H);
  b.fillStyle=grad(0,0,0,WT);b.fillRect(0,0,W,WT);
  const L={galv:14,copper:10,pvc:16,brass:10,iron:16}[p];
  const band=(x,y,w,h,vert)=>{
    b.fillStyle=vert?grad(x,0,x+w,0):grad(0,y,0,y+h);b.fillRect(x,y,w,h);
    b.strokeStyle='rgba(0,0,0,.5)';b.lineWidth=1;b.strokeRect(x+.5,y+.5,w-1,h-1);
    const len=vert?h:w;
    const across=(o,col,a)=>{b.globalAlpha=a;b.strokeStyle=col;b.beginPath();
      if(vert){b.moveTo(x,y+o);b.lineTo(x+w,y+o)}else{b.moveTo(x+o,y);b.lineTo(x+o,y+h)}b.stroke();b.globalAlpha=1};
    if(p==='galv'){for(const o of [-2,-4,-6,len+2,len+4,len+6])across(o,'#3a4045',.6)}      // threads
    else if(p==='copper'){across(-1,'#e9e9e9',.9);across(len+1,'#e9e9e9',.9)}              // solder
    else if(p==='pvc'){b.globalAlpha=.55;b.fillStyle='#8b5fbf';if(vert)b.fillRect(x,y-5,w,5);else b.fillRect(x-5,y,5,h);b.globalAlpha=1} // primer
    else if(p==='brass'){across(len/2,'#76590c',.8)}
    else{across(3,'#000',.5);across(len-3,'#000',.5)}                                         // cast iron hub
  };
  const wv=WT+2;
  for(let y=150;y<H-40;y+=170){band(0,y,wv,L,true);band(W-wv,y,wv,L,true)}
  band(W/2-L/2,0,L,wv,false);
  for(const x of [0,W-WT-6]){b.fillStyle=grad(0,0,0,WT+6);b.fillRect(x,0,WT+6,WT+6);b.strokeStyle='rgba(0,0,0,.5)';b.lineWidth=1;b.strokeRect(x+.5,.5,WT+5,WT+5)}
}

/* ---------- standing liquid, drips, flush ---------- */
let liqP=[],drips=[],drained=false,flushT=0,splashed=false;
const FLUSH_D=1.5;
function buildLiq(){
  const L=LIQ[zoneOf(G.lvl)];liqP=[];drips=[];
  for(let i=0,n=Math.round(16*(Y0-WT)/42);i<n;i++)liqP.push({x:rand(WT+2,W-WT-2),y:rand(WT+3,Y0-5),s:rand(.5,1),a:rand(0,6.3),c:pick(['#c77dff','#2fae5c','#f5c842','#ffffff'])});
  return L;
}
function updLiq(dt){
  const L=LIQ[zoneOf(G.lvl)];
  for(const q of liqP){q.a+=dt*3;
    if(L.k==='bubble'||L.k==='boil'){q.y-=(L.k==='boil'?16:8)*q.s*dt;if(q.y<WT+3){q.y=Y0-5;q.x=rand(WT+2,W-WT-2)}}
    else{q.x+=7*q.s*dt;if(q.x>W-WT-2)q.x=WT+2}}
  if(mode==='play'&&rows&&!drained){
    for(let c=0;c<COLS;c++){if(bricks[0][c]||Math.random()>dt*.6)continue;
      let stop=H+10;for(let r=1;r<rows;r++)if(bricks[r][c]){stop=Y0+r*SY;break}
      drips.push({x:X0+c*SX+BW/2+rand(-7,7),y:Y0-1,vy:15,stop})}}
  for(const d of drips){d.vy+=520*dt;d.y+=d.vy*dt;if(d.y>=d.stop){d.dead=true;if(d.stop<H)burst(d.x,d.stop,L.hi,2,40)}}
  drips=drips.filter(d=>!d.dead);
}
function drawLiquid(){
  if(drained)return;const L=LIQ[zoneOf(G.lvl)],top=WT,bot=Y0-2;
  const g=ctx.createLinearGradient(0,top,0,bot);g.addColorStop(0,L.d);g.addColorStop(1,L.c);
  ctx.globalAlpha=.92;ctx.fillStyle=g;ctx.fillRect(WT,top,W-2*WT,bot-top);
  ctx.strokeStyle=L.hi;ctx.lineWidth=1;
  for(let i=0,y=top+9;y<bot-3;i++,y+=11){ctx.globalAlpha=.28;ctx.beginPath();ctx.moveTo(WT,y);
    for(let x=WT;x<=W-WT;x+=8)ctx.lineTo(x,y+Math.sin(x*.05+t0*2+i*1.7)*1.6);ctx.stroke()}
  ctx.globalAlpha=.6;ctx.beginPath();ctx.moveTo(WT,bot);for(let x=WT;x<=W-WT;x+=8)ctx.lineTo(x,bot+Math.sin(x*.08+t0*3)*.8);ctx.stroke();
  for(const q of liqP){
    if(L.k==='bubble'){ctx.globalAlpha=.5;ctx.strokeStyle=L.hi;ctx.beginPath();ctx.arc(q.x,q.y,1.5,0,6.3);ctx.stroke()}
    else if(L.k==='suds'){ctx.globalAlpha=.45;ctx.fillStyle='#f2f5f7';ctx.beginPath();ctx.arc(q.x,q.y,1.7,0,6.3);ctx.fill()}
    else if(L.k==='chunk'){ctx.globalAlpha=.7;ctx.fillStyle='#2b1d0c';ctx.fillRect(q.x,q.y,3,2)}
    else if(L.k==='glitter'){ctx.globalAlpha=.3+.5*Math.abs(Math.sin(q.a));ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,1.6,1.6)}
    else{const k=clamp(1-(q.y-WT)/(Y0-WT),0,1); // clamped: after a resize a bubble can sit below the new Y0, and a negative radius throws
      ctx.globalAlpha=.65;ctx.strokeStyle=L.hi;ctx.beginPath();ctx.arc(q.x,q.y,1+k*2.2,0,6.3);ctx.stroke()}
  }
  ctx.globalAlpha=1;
  ctx.fillStyle=L.hi;for(const d of drips){ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(d.x,d.y,1.8,0,6.3);ctx.fill();ctx.fillRect(d.x-.6,d.y-4,1.2,3)}
  ctx.globalAlpha=1;
}
const flushFront=()=>{const k=Math.min(1,flushT/.85);return Y0-2+(H+80-Y0)*k*k};
const flushTail=()=>{const k=clamp((flushT-.55)/.95,0,1);return WT+(H+90)*k*k};
function updFlush(dt){
  flushT+=dt;t0+=dt;const fy=flushFront();
  for(const p of parts)if(p.y<fy)p.vy=Math.max(p.vy,560);
  for(const e of enemies)if(e.y<fy)e.y+=640*dt;
  if(!splashed&&fy>pad.y-10){splashed=true;pad.hop=1.2;pm('hop');say(pick(['Whoosh!','Line\'s open!','There she goes!']),1.6);
    for(let i=0;i<26;i++)parts.push({x:pad.x+rand(-30,30),y:pad.y,vx:rand(-160,160),vy:rand(-260,-90),t:.7,m:.7,c:LIQ[zoneOf(G.lvl)].hi,s:rand(2,3.5)})}
  if(flushT>=FLUSH_D)endFlush();
}
function endFlush(){
  if(mode!=='flush')return;mode='won';enemies=[];flushT=FLUSH_D;sfx.clear();setTimeout(showClear,250);
}
function drawFlush(){
  if(mode!=='flush')return;const L=LIQ[zoneOf(G.lvl)],fy=flushFront(),ty=flushTail();if(ty>=fy)return;
  ctx.globalAlpha=.84;ctx.fillStyle=L.c;ctx.beginPath();ctx.moveTo(WT,ty);ctx.lineTo(W-WT,ty);ctx.lineTo(W-WT,fy);
  for(let x=W-WT;x>=WT;x-=10)ctx.lineTo(x,fy+Math.sin(x*.06+t0*14)*7);ctx.closePath();ctx.fill();
  ctx.globalAlpha=.35;ctx.strokeStyle=L.hi;ctx.lineWidth=1.5;
  for(let i=0;i<14;i++){const x=WT+10+i*25,y=ty+((i*53+t0*900)%Math.max(1,fy-ty));ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+14);ctx.stroke()}
  ctx.globalAlpha=.75;ctx.fillStyle='#f4f7f8';
  for(let x=WT+4;x<W-WT;x+=11){ctx.beginPath();ctx.arc(x,fy+Math.sin(x*.06+t0*14)*7,2.5+Math.abs(Math.sin(x+t0*9))*2.5,0,6.3);ctx.fill()}
  ctx.globalAlpha=1;
}

/* ---------- drawing ---------- */
function pill(c,x,y,w,h){c.beginPath();c.arc(x-w/2+h/2,y,h/2,Math.PI/2,Math.PI*1.5);c.arc(x+w/2-h/2,y,h/2,-Math.PI/2,Math.PI/2);c.closePath()}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawCap(c,t,x,y){
  const w=30,h=14;pill(c,x,y,w,h);c.fillStyle=CAPS[t].c;c.fill();c.lineWidth=1;c.strokeStyle='rgba(0,0,0,.55)';c.stroke();
  c.fillStyle='rgba(255,255,255,.3)';c.fillRect(x-w/2+6,y-h/2+2,w-12,2);
  c.strokeStyle='#fff';c.fillStyle='#fff';c.lineWidth=2;c.lineCap='round';
  if(t==='tee'){c.beginPath();c.moveTo(x-7,y-2);c.lineTo(x+7,y-2);c.moveTo(x,y-2);c.lineTo(x,y+4);c.stroke()}
  else if(t==='coupling'){c.lineWidth=1.5;c.strokeRect(x-8,y-3,16,6);c.beginPath();c.moveTo(x-3,y-3);c.lineTo(x-3,y+3);c.moveTo(x+3,y-3);c.lineTo(x+3,y+3);c.stroke()}
  else if(t==='jet'){c.beginPath();c.moveTo(x-9,y-3);c.lineTo(x-2,y-1);c.lineTo(x-2,y+1);c.lineTo(x-9,y+3);c.closePath();c.fill();
    c.lineWidth=1.4;c.beginPath();c.moveTo(x,y-1);c.lineTo(x+8,y-4);c.moveTo(x,y);c.lineTo(x+9,y);c.moveTo(x,y+1);c.lineTo(x+8,y+4);c.stroke()}
  else if(t==='plunger'){c.beginPath();c.moveTo(x,y-5);c.lineTo(x,y+1);c.stroke();c.beginPath();c.arc(x,y+4,4.5,Math.PI,0);c.fill()}
  else if(t==='auger'){ // cable into a spade cutter head
    c.lineWidth=1.6;c.beginPath();c.moveTo(x-11,y);c.lineTo(x-2,y);c.stroke();
    c.lineWidth=1;c.beginPath();for(const o of [-9,-6,-3]){c.moveTo(o+x,y-2);c.lineTo(o+x+1.5,y+2)}c.stroke();
    c.fillRect(x-2,y-2.5,5,5);c.beginPath();c.moveTo(x+3,y-5);c.lineTo(x+10,y-2.5);c.lineTo(x+7,y);c.lineTo(x+10,y+2.5);c.lineTo(x+3,y+5);c.closePath();c.fill()}
  else{const g=IMG['ganja-front'];if(ok(g)){const s=13,r=g.naturalWidth/g.naturalHeight;c.drawImage(g,x-s*r/2,y-s/2,s*r,s)}else{c.font='900 11px Nunito';c.textAlign='center';c.textBaseline='middle';c.fillText('+1',x,y+.5)}}
  c.lineCap='butt';
}
function drawBrick(c,k,x,y){
  const col=BCOL[k.t];c.fillStyle=col[0];c.fillRect(x,y,BW,BH);
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(x,y,BW,3);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(x,y+BH-2,BW,2);
  c.fillStyle=col[1];c.strokeStyle=col[1];c.lineWidth=1;
  const seed=(x*7+y*13)%11;
  if(k.t==='g'){c.beginPath();c.ellipse(x+8+seed%5,y+8,4,2.4,0,0,6.3);c.ellipse(x+21,y+7+seed%3,3,2,0,0,6.3);c.fill()}
  else if(k.t==='h'){c.beginPath();c.moveTo(x+3,y+6);c.quadraticCurveTo(x+10,y+2+seed%5,x+15,y+8);c.quadraticCurveTo(x+21,y+12,x+27,y+5);c.stroke();
    c.beginPath();c.moveTo(x+5,y+10);c.quadraticCurveTo(x+14,y+6,x+24,y+11);c.stroke()}
  else if(k.t==='m'){for(let i=0;i<4;i++){c.fillRect(x+4+((seed+i*7)%22),y+4+((seed*3+i*5)%7),2,2)}}
  else if(k.t==='w'){c.strokeStyle='#ffffff';c.beginPath();c.arc(x+9,y+8,2.6,0,6.3);c.stroke();c.beginPath();c.arc(x+20,y+6,2,0,6.3);c.stroke()}
  else if(k.t==='r'){c.beginPath();c.moveTo(x+2,y+5);c.lineTo(x+12,y+8);c.lineTo(x+18,y+5);c.lineTo(x+28,y+10);c.moveTo(x+12,y+8);c.lineTo(x+14,y+12);c.stroke()}
  else if(k.t==='s'){c.fillRect(x+3,y+5,2,2);c.fillRect(x+BW-5,y+5,2,2)}
  else if(k.t==='c'){c.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<6;i++)c.fillRect(x+3+((seed+i*9)%24),y+4+((seed+i*4)%8),1.5,1.5);
    c.strokeStyle='rgba(0,0,0,.6)';c.strokeRect(x+.5,y+.5,BW-1,BH-1)}
  if(k.hp<k.max&&k.t!=='c'){c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=1;c.beginPath();c.moveTo(x+BW/2,y+1);c.lineTo(x+BW/2-3,y+6);c.lineTo(x+BW/2+2,y+9);
    if(k.max-k.hp>1){c.moveTo(x+6,y+BH-1);c.lineTo(x+9,y+7);c.lineTo(x+13,y+5)}c.stroke()}
  if(k.f>0){c.globalAlpha=k.f*.7;c.fillStyle='#fff';c.fillRect(x,y,BW,BH);c.globalAlpha=1}
}
function drawPad(){

  ctx.fillStyle=g;ctx.fillRect(x+5,y,w-10,h);
  const g2=ctx.createLinearGradient(0,y-2,0,y+h+2);g2.addColorStop(0,m[1]);g2.addColorStop(.5,m[0]);g2.addColorStop(1,m[2]);
  ctx.fillStyle=g2;ctx.fillRect(x,y-2,8,h+4);ctx.fillRect(x+w-8,y-2,8,h+4);

  if(pad.jet>0){const blink=pad.jet<3&&Math.floor(t0*8)%2,pu=.5+.5*Math.sin(t0*10);
    for(const nx of [x+5,x+w-5]){
      if(!blink){ctx.globalAlpha=.22+.22*pu;ctx.fillStyle='#7fd3ff';ctx.beginPath();ctx.arc(nx,y-5,7+pu*2.5,0,6.3);ctx.fill();ctx.globalAlpha=1}
      ctx.fillStyle=blink?'#a7dcff':'#2f8fe0';ctx.fillRect(nx-3,y-7,6,5);ctx.fillStyle='#e2f6ff';ctx.fillRect(nx-1,y-8,2,2)}
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x+8,y+h-4,w-16,4);ctx.fillStyle='#4fc3ff';ctx.fillRect(x+9,y+h-3,(w-18)*Math.max(0,pad.jet)/JET_T,2)}
  if(augerT>0){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x+8,y,w-16,4);ctx.fillStyle=augerT<3&&Math.floor(t0*8)%2?'#ffe0a0':'#ffb02e';ctx.fillRect(x+9,y+1,(w-18)*augerT/AUG_T,2)}
}
function drawMojo(){
  const hi=IMG['mojo-hose'];
  if(ok(hi)){const m=mojoGeo();let a=0;if(pad.wince>0)a=Math.sin(pad.wince*30)*.12;
    ctx.save();ctx.translate(m.nx,m.ny);ctx.scale(m.f,1);ctx.rotate(a);ctx.drawImage(hi,-.8121*m.w,-.2689*m.h,m.w,m.h);ctx.restore();
    if(pad.slime>0&&(boss||G.lvl%8===7)){const S=BZ().sl;ctx.globalAlpha=Math.min(1,pad.slime);ctx.fillStyle=S.c;
      for(const [ox,oy,r] of [[-12,6,5],[-22,18,4],[-6,26,4.5],[-26,34,3.5],[-14,44,4],[2,12,3]]){ctx.beginPath();ctx.arc(m.nx+ox*m.f,m.top+oy*BOOST+(1.6-pad.slime)*6,r*BOOST,0,6.3);ctx.fill()}
      ctx.globalAlpha=1}

  const im=IMG['mojo-front'],h=48*BOOST;let y=pad.y+3,x=pad.x,a=0;
  if(pad.hop>0)y-=Math.abs(Math.sin(pad.hop*9))*8;

  ctx.save();ctx.translate(x,y);ctx.rotate(a);

  else{ctx.fillStyle='#b48a5a';ctx.beginPath();ctx.arc(0,22,14,0,6.3);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-10,4,20,8)}
  ctx.restore();
}
function drawAim(b){ // where the drop will go: same launch formula as launch(), bouncing off the pipe walls, stopping at the first thing it hits
  const off=clamp(b.ox/(pad.w/2),-1,1),a=off*.9;let x=b.x,y=b.y,vx=Math.sin(a),vy=-Math.cos(a),dist=0;const r=b.r;
  ctx.fillStyle='#bfe9ff';

/* ---------- overlays ---------- */
const root=document.documentElement;
const isApp=navigator.standalone===true||(window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches));
const isIOS=/iPhone|iPod|iPad/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const canFull=!!(root.requestFullscreen||root.webkitRequestFullscreen)&&!isApp&&!/iPhone|iPod/.test(navigator.userAgent);
const fullBtn=()=>isApp?'':'<button class="btn alt" data-a="full">Full screen</button>';
function showTip(){
  backTo=mode==='pause'?'pause':'title';if(mode!=='pause')mode='tip';
  try{localStorage.setItem('mojoBlastFullTip','1')}catch(e){}
  show('<h2>Play full screen</h2><p>Safari\'s bar can\'t be hidden from inside a web page, but you can install Mojo Blast as its own app:</p>'+
    '<ol class="steps"><li>Tap Share (or the ••• menu) in Safari</li><li>Tap Add to Home Screen</li><li>Open Mojo Blast from your home screen</li></ol>'+
    '<p class="small">It opens with no Safari bar. The home screen app keeps its own save, separate from Safari.</p>'+
    '<button class="btn" data-a="back">Got it</button>');
}
function parkBoard(){['lbBox','lbBoxZ'].forEach(k=>{const b=$(k);if(b&&b.parentNode!==$('lbHold'))$('lbHold').appendChild(b)})}
function show(html){parkBoard();ov.innerHTML='<div class="card">'+html+'</div>';ov.hidden=false;ov.scrollTop=0}
function hide(){parkBoard();ov.hidden=true;ov.innerHTML=''}
const soundBtn=()=>'<button class="btn alt" data-a="sound">Sound: '+(muted?'Off':'On')+'</button>';
function showTitle(){
  mode='title';G.score=0;hud();const n=Math.min(SAVE.unl,LV.length);
  const a=acct(),r=marksR(SAVE.best);
  show('<h1>Mojo Blast</h1><img class="hero" src="/assets/mojo-hose.png" alt="Mojo">'+
    '<p>Bust the clog. Keep the drop in play.</p>'+
    (SAVE.best?'<p class="small">'+(a?esc(a.name)+' · ':'')+'Best run '+SAVE.best.toLocaleString()+(r?' · '+marksN(r):'')+'</p>':'')+
    '<button class="btn" data-a="play">'+(n>1?'Play level '+n:'Play')+'</button>'+
    '<div class="row"><button class="btn alt" data-a="levels">Levels</button><button class="btn alt" data-a="how">How to play</button></div>'+
    '<div class="row"><button class="btn alt" data-a="rank">Rank &amp; Board</button><button class="btn alt" data-a="tro">Trophies</button></div>'+
    soundBtn()+fullBtn()+'<button class="btn alt" data-a="games">All games</button><p class="small">v1.1</p>');
  let seenTip=false;try{seenTip=localStorage.getItem('mojoBlastFullTip')==='1'}catch(e){}
  if(isIOS&&!isApp&&!seenTip&&!canFull)showTip();
}
function startRun(i){G={lvl:i,zone:zoneOf(i),zStart:0,score:0,lives:3,nextLife:25000,base:290,maxSp:420,cleanStreak:0,rank0:marksR(SAVE.best)};if(i%8===0)showIntro(i);else{hide();beginLevel(i)}}
function crewImgs(z){return '<div class="crew"><span class="ganjabub"><img src="/assets/ganja-front.png" alt="Ganja"><i>!</i></span>'+
  ZONES[z].en.map(k=>'<img src="/assets/'+k+'-front.png" alt="">').join('')+'</div>'}
function showIntro(i){
  const z=zoneOf(i),Zn=ZONES[z];mode='intro';G.lvl=i;drained=false;rows=0;bricks=[];boss=null;buildLiq();buildFx();buildBg();hud();
  show('<p class="small">Zone '+(z+1)+' of 5</p><h2 style="color:'+Zn.acc+'">'+Zn.name+'</h2><p>'+Zn.blurb+'</p>'+crewImgs(z)+
    '<p class="small">Mojo\'s running '+MAT[Zn.pipe][3]+' pipe here.</p><button class="btn" data-a="begin">Start</button>');
}
function showClear(){
  const L=LV[G.lvl],z=zoneOf(G.lvl);
  if(G.lvl===LV.length-1){showFinale();return}
  mode='clear';
  if(L.boss){show('<p class="small">Zone clear</p><h2 style="color:'+ZONES[z].acc+'">'+ZONES[z].name+' is flowing</h2>'+crewImgs(z)+
    '<p class="big">'+G.score.toLocaleString()+'</p>'+zoneLine()+'<button class="btn" data-a="next">Next zone</button><button class="btn alt" data-a="title">Title screen</button>');return}
  show('<h2 style="color:var(--gold)">Clog cleared</h2><p>'+L.name+'</p><span class="ganjabub"><img src="/assets/ganja-front.png" alt="" style="height:64px"><i>!</i></span>'+
    '<p class="big">'+G.score.toLocaleString()+'</p><button class="btn" data-a="next">Next level</button><button class="btn alt" data-a="title">Title screen</button>');
}
function promoHTML(){const r=marksR(SAVE.best);if(!r||r<=(G.rank0||0))return '';
  return '<div class="rankins">'+marksB(r)+'</div><p class="rn" style="color:var(--gold)">Promoted: '+marksN(r)+'</p>'}
function zoneLine(){const z=G.zone;if(!(z>=0&&z<5))return '';const n=zScore(),b=Math.max(SAVE.zb[z]||0,n);
  return '<p class="small"><span style="color:'+ZONES[z].acc+'">'+ZONES[z].name+'</span> zone '+n.toLocaleString()+(n>=b&&n>0?' · new zone best':' · zone best '+b.toLocaleString())+'</p>'}
function boardNote(){return acct()?'<p class="small">Posted to the leaderboard.</p>':'<p class="small">Tap Rank &amp; Board to put your name on the leaderboard.</p>'}
function showOver(){
  mode='over';
  show('<h2 style="color:#ff7a6a">Clogged up</h2><p>'+LV[G.lvl].name+'</p>'+(promoHTML()||'<span class="ganjabub"><img src="/assets/ganja-front.png" alt="" style="height:60px"><i>#@%!</i></span>')+
    '<p class="big">'+G.score.toLocaleString()+'</p><p class="small">Best run '+SAVE.best.toLocaleString()+'</p>'+zoneLine()+boardNote()+
    '<button class="btn" data-a="retry">Try again</button><button class="btn alt" data-a="rank">Rank &amp; Board</button><div class="row"><button class="btn alt" data-a="levels">Levels</button><button class="btn alt" data-a="title">Title</button></div>');
}
function pause(){if(mode!=='play')return;mode='pause';ptr=null;
  show('<h2>Paused</h2><button class="btn" data-a="resume">Resume</button><button class="btn alt" data-a="restart">Restart level</button>'+
    '<div class="row"><button class="btn alt" data-a="levels">Levels</button><button class="btn alt" data-a="how">How to play</button></div>'+
    '<div class="row"><button class="btn alt" data-a="rank">Rank &amp; Board</button><button class="btn alt" data-a="tro">Trophies</button></div>'+soundBtn()+
    fullBtn()+'<div class="row"><button class="btn alt" data-a="title">Title</button><button class="btn alt" data-a="games">All games</button></div>');
}
let backTo='title',backFn=null;
const marksR=b=>window.PMLB&&PMLB.marksRank?PMLB.marksRank(b):0,marksN=r=>window.PMLB&&PMLB.marksName?PMLB.marksName(r):'',marksB=r=>window.PMLB&&PMLB.marksBadge?PMLB.marksBadge(r):'';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setBack(){const m=mode;backFn=m==='pause'?()=>{mode='play';pause()}:m==='over'?showOver:m==='done'?()=>showFinale('quiet'):showTitle}
function showRank(){
  setBack();const bb=SAVE.best,r=marksR(bb),at=window.PMLB&&PMLB.MK_AT?PMLB.MK_AT:[];
  show('<h2>Rank &amp; Board</h2><div class="rankins">'+(r?marksB(r):'')+'</div><p class="rn">'+(marksN(r)||'No rank yet')+'</p>'+
    '<p class="small">Best run '+bb.toLocaleString()+(r<13&&at[r]?' · next: '+marksN(r+1)+' at '+at[r].toLocaleString():r?' · top rank':'')+'</p>'+
    '<p class="small">Your best single run sets your marksmanship badge: Marksman at 10,000, Sharpshooter at 50,000, Expert at 120,000.</p>'+
    (LB?'<div id="lbSlot"></div>':'<p>The leaderboard couldn\'t load. Check your connection.</p>')+
    (LBZ?'<p class="small" style="margin-top:14px">Best single zone: your most points inside one zone, any zone, in one go. You don\'t need a full run for this one.</p>'+zoneBests()+'<div id="lbSlotZ"></div>':'')+
    '<button class="btn alt" data-a="back2">Back</button>');
  if(LB){$('lbSlot').appendChild($('lbBox'));LB.refresh()}
  if(LBZ){$('lbSlotZ').appendChild($('lbBoxZ'));LBZ.refresh()}
}
function zoneBests(){if(!SAVE.zb.some(x=>x>0))return '';
  return '<p class="small">Your zone bests: '+ZONES.map((z,i)=>'<span style="color:'+z.acc+'">'+z.name+'</span> '+(SAVE.zb[i]||0).toLocaleString()).join(' · ')+'</p>'}
function showTrophies(){
  setBack();const have=SAVE.tro,tile=(t,got)=>'<div class="tile'+(got?'':' locked')+'"><div class="ta">'+(got||!TSEC.includes(t)?t.art:'❓')+'</div><b>'+(got||!TSEC.includes(t)?t.name:'???')+'</b><small>'+(got||!TSEC.includes(t)?t.desc:'Keep blasting')+'</small></div>';
  show('<h2>Trophies</h2><p class="small">'+TRO.filter(t=>have.includes(t.id)).length+' of '+TRO.length+' · secrets '+TSEC.filter(t=>have.includes(t.id)).length+' of '+TSEC.length+'</p>'+
    '<div class="tgrid">'+TALL.map(t=>tile(t,have.includes(t.id))).join('')+'</div><p class="small">Your trophies show in Mojo\'s Locker too.</p><button class="btn alt" data-a="back2">Back</button>');
}
const CUP='<svg class="cup" viewBox="0 0 120 130"><defs><linearGradient id="fgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4b0"/><stop offset=".5" stop-color="#efc23e"/><stop offset="1" stop-color="#8f6210"/></linearGradient></defs>'+
  '<path d="M60 2 C66 10 69 14 69 18 A9 9 0 0 1 51 18 C51 14 54 10 60 2Z" fill="#5ec8ff" stroke="#1f78c9" stroke-width="1.5"/>'+
  '<path d="M31 24 H19 Q11 24 11 33 V40 Q11 50 22 52 L33 55 M89 24 H101 Q109 24 109 33 V40 Q109 50 98 52 L87 55" fill="none" stroke="#3d2804" stroke-width="10" stroke-linecap="round"/>'+
  '<path d="M31 24 H19 Q11 24 11 33 V40 Q11 50 22 52 L33 55 M89 24 H101 Q109 24 109 33 V40 Q109 50 98 52 L87 55" fill="none" stroke="url(#fgd)" stroke-width="6" stroke-linecap="round"/>'+
  '<path d="M30 22 H90 V46 Q90 76 60 80 Q30 76 30 46Z" fill="url(#fgd)" stroke="#3d2804" stroke-width="3"/>'+
  '<text x="60" y="56" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="24" fill="#5a3b06">40</text>'+
  '<rect x="54" y="79" width="12" height="16" fill="url(#fgd)" stroke="#3d2804" stroke-width="2"/><rect x="49" y="85" width="22" height="6" rx="2" fill="url(#fgd)" stroke="#3d2804" stroke-width="2"/>'+
  '<rect x="34" y="95" width="52" height="9" rx="2" fill="url(#fgd)" stroke="#3d2804" stroke-width="2.5"/>'+
  '<rect x="24" y="104" width="72" height="22" rx="3" fill="#241128" stroke="#efc23e" stroke-width="2.5"/>'+
  '<text x="60" y="119" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="10" letter-spacing="1.5" fill="#f5c842">MOJO BLAST</text></svg>';
function showFinale(again){
  mode='done';
  show('<div class="finale">'+CUP+'<h2 style="color:var(--gold)">LINE\'S OPEN</h2><p>All 40 levels. Five boss clogs flushed.</p>'+
    '<img class="hopper" src="/assets/mojo-hose.png" alt="">'+crewImgs(4)+promoHTML()+
    '<p class="big">'+G.score.toLocaleString()+'</p><p class="small">Best run '+SAVE.best.toLocaleString()+'</p>'+zoneLine()+boardNote()+
    '<button class="btn" data-a="rank">Rank &amp; Board</button><div class="row"><button class="btn alt" data-a="replay">Watch again</button><button class="btn alt" data-a="tro">Trophies</button></div>'+
    '<div class="row"><button class="btn alt" data-a="levels">Levels</button><button class="btn alt" data-a="title">Title</button></div></div>');
  if(again!=='quiet'){sfx.finale();fireworks=4.5}
}
let fireworks=0;
function showLevels(){
  backTo=mode==='pause'?'pause':'title';if(mode!=='pause')mode='levels';
  let h='<h2>Levels</h2>';
  ZONES.forEach((z,zi)=>{h+='<div class="zh" style="color:'+z.acc+'">'+z.name+'</div><div class="lvgrid">';
    for(let j=0;j<8;j++){const i=zi*8+j,lk=i>=SAVE.unl,bs=!!LV[i].boss;
      h+='<button class="lv'+(bs?' boss':'')+'" data-a="lv" data-i="'+i+'"'+(lk?' disabled':'')+'>'+(lk?'🔒':bs?'Boss':(j+1))+'</button>'}
    h+='</div>'});
  show(h+'<button class="btn alt" data-a="back">Back</button>');
}
function showHow(){
  backTo=mode==='pause'?'pause':'title';if(mode!=='pause')mode='how';
  const brick=(t,n,d)=>'<div class="it"><canvas data-b="'+t+'" width="30" height="14" style="width:30px;height:14px"></canvas><div><b>'+n+'</b> <span>'+d+'</span></div></div>';
  const cap=t=>'<div class="it"><canvas data-c="'+t+'" width="32" height="16" style="width:32px;height:16px"></canvas><div><b>'+CAPS[t].n+'</b> <span>'+CAPS[t].d+'</span></div></div>';
  const crew=(k,n,d)=>'<div class="it"><img src="/assets/'+k+'-front.png" alt=""><div><b>'+n+'</b> <span>'+d+'</span></div></div>';
  show('<h2>How to play</h2><div class="how">'+
   '<p>Drag anywhere to move Mojo\'s pipe. Lift your finger to launch the drop. Break every clog brick to clear the stoppage and flush the line. Don\'t let the drop fall past Mojo.</p>'+
   '<h3>The clog</h3>'+brick('g','Grease, hair, mud, soap','one hit')+brick('r','Roots','two hits')+brick('s','Scale','three hits')+brick('c','Concrete','never breaks, play around it')+
   '<h3>Fittings</h3><p>Some bricks drop a fitting. Catch it with the pipe.</p>'+['tee','coupling','jet','plunger','auger','ganja'].map(cap).join('')+
   '<h3>The crew</h3>'+crew('fly','Zydeco','buzzes around and knocks your drop off line')+crew('maggot','Beignet','crawls in and regrows grease bricks')+
   crew('crawfish','Roux','snaps your drop back faster, takes two hits')+
   '<h3>Bosses</h3><p>Every zone ends with a boss clog: the Root Ball, the Fatberg, the Hairball, the Wipe Beast and the Scale King, each bigger than the last. Hit it with the drop or the jetter until it breaks up, and dodge the sludge it spits. Sludge on the pipe costs a life.</p>'+
   '</div><button class="btn alt" data-a="back">Back</button>');
  ov.querySelectorAll('canvas[data-b]').forEach(c=>{const x=c.getContext('2d');const t=c.dataset.b;drawBrick(x,{t,hp:HP[t],max:HP[t],f:0},0,0)});
  ov.querySelectorAll('canvas[data-c]').forEach(c=>{const x=c.getContext('2d');drawCap(x,c.dataset.c,16,8)});
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;sfx.ui();const a=b.dataset.a;
  if(a==='play')startRun(Math.min(SAVE.unl,LV.length)-1);
  else if(a==='levels')showLevels();
  else if(a==='how')showHow();
  else if(a==='lv')startRun(+b.dataset.i);
  else if(a==='back'){if(backTo==='pause'){mode='play';pause()}else showTitle()}
  else if(a==='back2'){if(backFn)backFn();else showTitle()}
  else if(a==='rank')showRank();
  else if(a==='tro')showTrophies();
  else if(a==='replay'){showFinale()}
  else if(a==='begin'){hide();beginLevel(G.lvl)}
  else if(a==='next'){const n=G.lvl+1;if(n%8===0)showIntro(n);else{hide();beginLevel(n)}}
  else if(a==='retry'){const i=G.lvl;G.score=0;G.zone=zoneOf(i);G.zStart=0;G.lives=3;G.nextLife=25000;G.cleanStreak=0;G.rank0=marksR(SAVE.best);hide();beginLevel(i)}
  else if(a==='restart'){hide();G.score=G.levelStart||0;G.lives=Math.max(1,G.livesAtStart||G.lives);G.cleanStreak=0;beginLevel(G.lvl)} // no farming points by replaying a level
  else if(a==='resume'){hide();park();mode='play';last=0}
  else if(a==='title'){showTitle()}
  else if(a==='sound'){muted=!muted;try{localStorage.setItem('pipeBlastMuted',muted?'1':'0')}catch(err){}b.textContent='Sound: '+(muted?'Off':'On');if(!muted)au()}
  else if(a==='full'){if(canFull){const p=(root.requestFullscreen||root.webkitRequestFullscreen).call(root);if(p&&p.catch)p.catch(()=>{});setTimeout(resize,300)}else showTip()}
  else if(a==='games')location.href='/play';
});
const menuTap=()=>{sfx.ui();if(mode==='play')pause();else if(mode==='pause'){hide();park();mode='play';last=0}};
$('menuBtn').addEventListener('click',menuTap);$('menuBtn2').addEventListener('click',menuTap);
function park(){ // coming back from a pause: the drop waits on the pipe, nothing is mid-air
  if(boss&&boss.dying)return;const sp=balls.reduce((m,b)=>Math.max(m,b.sp||0),G.base||290);
  const nb=newBall();nb.sp=sp;balls=[nb];globs=[];blasts=[];ptr=null;
}
IMG['mojo-front'].onload=()=>hud();

/* ---------- leaderboard (best run), accounts, cloud save, extras ---------- */
const LB=window.PMLB?PMLB.mount($('lbBox'),{game:'blast',title:'Top 10, best run',unit:''}):null;
const LBZ=window.PMLB?PMLB.mount($('lbBoxZ'),{game:'blastz',title:'Top 10, best single zone',unit:'',passive:true}):null; // list only; signs in through the board above
function postScore(){if(LB&&G.score>0)LB.post(G.score);const zs=zScore();if(LBZ&&zs>0)LBZ.post(zs)}
if(window.PMX){PMX.onAward=n=>{toast(n);sfx.life()};PMX.sync();setTimeout(()=>PMX.tick(),1500)}
if(window.PMLB)PMLB.onChange((type,a)=>{
  cloudReady=false;
  if(type==='signout'||!a){owner='';applySave(loadSlot(SK));if(mode==='title')showTitle();return}
  const key=nameKey(a.name);if(key===owner)return;
  const wasGuest=owner==='',guest=snap(),mine=loadSlot(slotFor(a));owner=null;
  PMLB.cloudLoad('blast').then(cloud=>{
    let acc=mergeSaves(mine,validSave(cloud)?cloud:null);
    if(!acc&&wasGuest&&(guest.unl>1||guest.best>0||guest.zb.some(x=>x>0)||guest.tro.length))acc=guest; // a brand-new name keeps the progress you were playing
    owner=key;if(cloud!==undefined)cloudReady=true;applySave(acc);saveGame(true);hud();
  });
});
if(acct()){const me=owner;
  PMLB.cloudLoad('blast').then(cloud=>{
    if(cloud===undefined||owner!==me)return; // couldn't reach the cloud: device-only this visit
    cloudReady=true;applySave(mergeSaves(snap(),validSave(cloud)?cloud:null));saveGame(true);if(mode==='title')showTitle();
  });
}
resize();buildFx();buildBg();showTitle();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
