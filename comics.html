<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Pipe Mojo Comics | When Voodoo Met Plumbing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Permanent+Marker&family=Oswald:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #080808;
      --deep: #0d0d14;
      --cyan: #00e5ff;
      --toxic: #39ff14;
      --red: #ff2020;
      --gold: #ffd700;
      --purple: #6b21ff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--black);
      color: #fff;
      font-family: 'Oswald', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.3;
    }

    /* ─── NAV ─── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,8,8,0.97);
      border-bottom: 3px solid var(--cyan);
      backdrop-filter: blur(12px);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .back-link {
      font-family: 'Bebas Neue', cursive;
      font-size: 1rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--cyan); }

    .nav-title {
      font-family: 'Bangers', cursive;
      font-size: 1.8rem;
      letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: 0 0 16px rgba(0,229,255,0.5);
    }

    .nav-page-counter {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
    }

    /* ─── ISSUE SWITCHER ─── */
    .issue-switcher {
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 2rem;
      display: flex;
      gap: 0;
      flex-shrink: 0;
    }

    .issue-tab {
      font-family: 'Bebas Neue', cursive;
      font-size: 1rem;
      letter-spacing: 2px;
      padding: 0.9rem 1.8rem;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .issue-tab:hover { color: #fff; }

    .issue-tab.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
      background: rgba(0,229,255,0.04);
    }

    .issue-tab .badge {
      font-size: 0.65rem;
      background: var(--red);
      color: #fff;
      padding: 1px 5px;
      border-radius: 2px;
    }

    .issue-tab.active .badge { background: var(--cyan); color: #000; }

    /* ─── MAIN READER LAYOUT ─── */
    .reader-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ─── THUMBNAIL STRIP ─── */
    .thumb-strip {
      width: 90px;
      background: #080808;
      border-right: 1px solid rgba(255,255,255,0.06);
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .thumb-strip::-webkit-scrollbar { width: 3px; }
    .thumb-strip::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.3); }

    .thumb-item {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
      flex-shrink: 0;
    }

    .thumb-item.active { border-color: var(--cyan); }
    .thumb-item:hover { border-color: rgba(0,229,255,0.5); }

    .thumb-item img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
    }

    .thumb-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      background: linear-gradient(135deg, #1a1025, #0a1a2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', cursive;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.3);
    }

    .thumb-num {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-family: 'Bebas Neue', cursive;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.7);
      padding: 0 3px;
      border-radius: 2px;
    }

    /* ─── COMIC VIEWER ─── */
    .comic-viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      position: relative;
      overflow-y: auto;
      background: 
        radial-gradient(ellipse 80% 60% at 50% 20%, rgba(107,33,255,0.06) 0%, transparent 60%),
        var(--black);
    }

    .comic-frame {
      position: relative;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .comic-page-img {
      width: 100%;
      display: block;
      border-radius: 4px;
      border: 4px solid rgba(255,215,0,0.25);
      box-shadow:
        0 0 0 1px rgba(255,215,0,0.1),
        0 32px 80px rgba(0,0,0,0.7),
        0 0 60px rgba(0,229,255,0.06);
      transition: opacity 0.25s;
    }

    .comic-page-img.loading { opacity: 0.3; }

    /* placeholder when no images yet */
    .page-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      background: linear-gradient(135deg, #1a0a2e 0%, #0a1020 50%, #101a0a 100%);
      border: 4px solid rgba(255,215,0,0.2);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7);
    }

    .placeholder-page-num {
      font-family: 'Bangers', cursive;
      font-size: 8rem;
      color: rgba(0,229,255,0.15);
      line-height: 1;
    }

    .placeholder-label {
      font-family: 'Special Elite', cursive;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      padding: 0 2rem;
    }

    /* ─── PREV / NEXT ARROWS ─── */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      background: rgba(0,0,0,0.7);
      border: 2px solid rgba(255,255,255,0.1);
      color: #fff;
      width: 52px;
      height: 80px;
      border-radius: 6px;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }

    .nav-arrow:hover {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
      box-shadow: 0 0 24px rgba(0,229,255,0.4);
    }

    .nav-arrow:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .nav-arrow:disabled:hover {
      background: rgba(0,0,0,0.7);
      color: #fff;
      border-color: rgba(255,255,255,0.1);
      box-shadow: none;
    }

    .arrow-prev { left: 100px; }
    .arrow-next { right: 12px; }

    /* ─── CHAPTER LABEL ─── */
    .chapter-label {
      font-family: 'Special Elite', cursive;
      font-size: 0.75rem;
      letter-spacing: 6px;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      margin-bottom: 1rem;
      text-align: center;
      display: block;
    }

    /* ─── BOTTOM CONTROLS ─── */
    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2rem;
      padding: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      width: 100%;
      max-width: 680px;
    }

    .ctrl-btn {
      font-family: 'Bebas Neue', cursive;
      font-size: 1rem;
      letter-spacing: 2px;
      padding: 0.6rem 1.5rem;
      border-radius: 4px;
      border: 2px solid rgba(255,255,255,0.15);
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover:not(:disabled) {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 16px rgba(0,229,255,0.2);
    }

    .ctrl-btn:disabled { opacity: 0.25; cursor: not-allowed; }

    .page-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .page-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .page-dot.active {
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      width: 10px;
      height: 10px;
    }

    .page-dot:hover { background: rgba(255,255,255,0.5); }

    /* ─── END OF ISSUE CARD ─── */
    .end-card {
      width: 100%;
      max-width: 680px;
      background: linear-gradient(135deg, #1a0d2e, #0d1a20);
      border: 2px solid rgba(0,229,255,0.2);
      border-radius: 8px;
      padding: 3rem 2rem;
      text-align: center;
      margin-top: 2rem;
    }

    .end-card h3 {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      letter-spacing: 4px;
      color: var(--cyan);
      text-shadow: 0 0 20px var(--cyan);
      margin-bottom: 0.5rem;
    }

    .end-card p {
      font-family: 'Special Elite', cursive;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 1.5rem;
    }

    .end-card-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .end-btn {
      font-family: 'Bebas Neue', cursive;
      font-size: 1rem;
      letter-spacing: 2px;
      padding: 0.75rem 2rem;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: 2px solid;
    }

    .end-btn-primary {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
    }

    .end-btn-primary:hover { background: #fff; border-color: #fff; }

    .end-btn-secondary {
      background: transparent;
      color: #fff;
      border-color: rgba(255,255,255,0.2);
    }

    .end-btn-secondary:hover { border-color: var(--toxic); color: var(--toxic); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .thumb-strip { width: 0; overflow: hidden; padding: 0; }
      .arrow-prev { left: 4px; width: 40px; }
      .arrow-next { right: 4px; width: 40px; }
      .comic-viewer { padding: 1rem 0.5rem; }
    }

    @media (max-width: 480px) {
      .nav-title { font-size: 1.3rem; }
      .issue-tab { padding: 0.8rem 1rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-left">
      <a href="index.html" class="back-link">← HOME</a>
      <span class="nav-title" id="nav-issue-title">PIPE MOJO</span>
    </div>
    <span class="nav-page-counter" id="nav-counter">PAGE 1 / 1</span>
  </nav>

  <!-- ISSUE TABS -->
  <div class="issue-switcher">
    <button class="issue-tab" id="tab-0" onclick="switchIssue(0)">
      ISSUE #0
      <span class="badge">ORIGIN</span>
    </button>
    <button class="issue-tab" id="tab-1" onclick="switchIssue(1)">
      ISSUE #1
      <span class="badge">NEW</span>
    </button>
  </div>

  <!-- READER -->
  <div class="reader-layout">

    <!-- THUMBNAIL STRIP -->
    <div class="thumb-strip" id="thumb-strip"></div>

    <!-- MAIN VIEWER -->
    <div class="comic-viewer" id="comic-viewer">

      <!-- Chapter label -->
      <span class="chapter-label" id="chapter-label"></span>

      <!-- Comic frame -->
      <div class="comic-frame">
        <div id="page-display"></div>
      </div>

      <!-- Bottom controls -->
      <div class="bottom-controls">
        <button class="ctrl-btn" id="ctrl-prev" onclick="prevPage()">← PREV</button>
        <div class="page-dots" id="page-dots"></div>
        <button class="ctrl-btn" id="ctrl-next" onclick="nextPage()">NEXT →</button>
      </div>

      <!-- End of issue -->
      <div class="end-card" id="end-card" style="display:none">
        <h3 id="end-title">TO BE CONTINUED</h3>
        <p id="end-desc">That's the end of this issue. More is coming.</p>
        <div class="end-card-actions" id="end-actions"></div>
      </div>

    </div>

  </div>

  <!-- FLOATING ARROWS -->
  <button class="nav-arrow arrow-prev" id="arrow-prev" onclick="prevPage()">‹</button>
  <button class="nav-arrow arrow-next" id="arrow-next" onclick="nextPage()">›</button>

  <script>
    // ─────────────────────────────────────────────────────────
    //  ISSUE CONFIGURATION
    //  
    //  HOW TO ADD YOUR PAGES:
    //  1. Export each PDF page as a JPG (1200px wide recommended)
    //  2. Place in /images/comics/ folder on your Cloudflare site
    //  3. Update the pages arrays below with the actual filenames
    //
    //  For cover images, use: images/comics/issue0-cover.jpg etc.
    // ─────────────────────────────────────────────────────────

    const ISSUES = {
      0: {
        title: "WHEN VOODOO MET PLUMBING",
        subtitle: "Issue #0 · Origin Story",
        chapters: [
          { label: "When Voodoo Met Plumbing", startPage: 0 }
        ],
        pages: [
          // Cover + pages from your Issue #0 PDF
          // Replace these with actual image paths once exported:
          { src: "images/comics/issue0-cover.jpg",  label: "Cover" },
          { src: "images/comics/issue0-page01.jpg", label: "Page 1" },
          { src: "images/comics/issue0-page02.jpg", label: "Page 2" },
          { src: "images/comics/issue0-page03.jpg", label: "Page 3" },
          { src: "images/comics/issue0-page04.jpg", label: "Page 4" },
          { src: "images/comics/issue0-page05.jpg", label: "Page 5" },
        ],
        endTitle: "TO BE CONTINUED IN ISSUE #1...",
        endDesc: "Ganja just went down the drain. What happens next?",
        nextIssue: 1,
        nextLabel: "READ ISSUE #1 →"
      },
      1: {
        title: "THE SYSTEM",
        subtitle: "Issue #1 · The Sewer Arc",
        chapters: [
          { label: "The System", startPage: 0 },
          { label: "The Flow Is Off", startPage: 2 },
          { label: "Not Normal", startPage: 4 },
          { label: "The Roots", startPage: 5 },
          { label: "It's Connected", startPage: 6 },
          { label: "The Pins", startPage: 7 },
          { label: "Control", startPage: 8 },
          { label: "Clearing", startPage: 9 },
          { label: "Not Over", startPage: 10 },
        ],
        pages: [
          // Cover + pages from your Issue #1 PDF
          // Replace these with actual image paths once exported:
          { src: "images/comics/issue1-cover.jpg",  label: "Cover" },
          { src: "images/comics/issue1-page01.jpg", label: "The System" },
          { src: "images/comics/issue1-page02.jpg", label: "The System" },
          { src: "images/comics/issue1-page03.jpg", label: "The Flow Is Off" },
          { src: "images/comics/issue1-page04.jpg", label: "Not Normal" },
          { src: "images/comics/issue1-page05.jpg", label: "The Roots" },
          { src: "images/comics/issue1-page06.jpg", label: "It's Connected" },
          { src: "images/comics/issue1-page07.jpg", label: "The Pins" },
          { src: "images/comics/issue1-page08.jpg", label: "Control" },
          { src: "images/comics/issue1-page09.jpg", label: "Clearing" },
          { src: "images/comics/issue1-page10.jpg", label: "Not Over" },
        ],
        endTitle: "THIS SYSTEM RUNS DEEPER...",
        endDesc: "Issue #2 is in the pipe. Follow @pipemojo for the next drop.",
        nextIssue: null,
        nextLabel: null
      }
    };

    // ─── STATE ───
    let currentIssue = 0;
    let currentPage = 0;

    // ─── INIT ───
    function init() {
      // Read ?issue= param from URL
      const params = new URLSearchParams(window.location.search);
      const issueParam = parseInt(params.get('issue')) || 0;
      switchIssue(issueParam, true);
    }

    function switchIssue(issueNum, noHistory = false) {
      currentIssue = issueNum;
      currentPage = 0;

      // Update tabs
      document.querySelectorAll('.issue-tab').forEach(t => t.classList.remove('active'));
      const tab = document.getElementById(`tab-${issueNum}`);
      if (tab) tab.classList.add('active');

      // Update URL
      if (!noHistory) {
        const url = new URL(window.location.href);
        url.searchParams.set('issue', issueNum);
        history.pushState({}, '', url);
      }

      render();
    }

    function render() {
      const issue = ISSUES[currentIssue];
      const pages = issue.pages;
      const page = pages[currentPage];

      // Nav title
      document.getElementById('nav-issue-title').textContent = issue.title;
      document.getElementById('nav-counter').textContent = 
        `PAGE ${currentPage + 1} / ${pages.length}`;

      // Chapter label
      let chapterName = issue.subtitle;
      if (issue.chapters) {
        for (let i = issue.chapters.length - 1; i >= 0; i--) {
          if (currentPage >= issue.chapters[i].startPage) {
            chapterName = issue.chapters[i].label;
            break;
          }
        }
      }
      document.getElementById('chapter-label').textContent = chapterName;

      // Page display
      const display = document.getElementById('page-display');
      display.innerHTML = '';

      const img = document.createElement('img');
      img.className = 'comic-page-img loading';
      img.alt = `Page ${currentPage + 1}`;
      img.onload = () => img.classList.remove('loading');
      img.onerror = () => {
        // Show placeholder if image doesn't exist yet
        display.innerHTML = `
          <div class="page-placeholder">
            <span class="placeholder-page-num">${currentPage === 0 ? 'COVER' : currentPage}</span>
            <span class="placeholder-label">${page.label || 'Page ' + (currentPage + 1)}<br><br>
              Place your exported JPGs in<br>/images/comics/</span>
          </div>`;
      };
      img.src = page.src;
      display.appendChild(img);

      // End card
      const isLast = currentPage === pages.length - 1;
      const endCard = document.getElementById('end-card');
      endCard.style.display = isLast ? 'block' : 'none';
      if (isLast) {
        document.getElementById('end-title').textContent = issue.endTitle;
        document.getElementById('end-desc').textContent = issue.endDesc;
        const actions = document.getElementById('end-actions');
        actions.innerHTML = '';
        if (issue.nextIssue !== null) {
          actions.innerHTML += `<button class="end-btn end-btn-primary" onclick="switchIssue(${issue.nextIssue})">${issue.nextLabel}</button>`;
        }
        actions.innerHTML += `<a href="index.html" class="end-btn end-btn-secondary">← BACK TO HOME</a>`;
        actions.innerHTML += `<a href="https://www.tiktok.com/@pipemojo" target="_blank" class="end-btn end-btn-secondary">FOLLOW @PIPEMOJO</a>`;
      }

      // Thumbnails
      renderThumbs();

      // Page dots (show up to 12, then hide)
      const dots = document.getElementById('page-dots');
      dots.innerHTML = '';
      if (pages.length <= 16) {
        pages.forEach((_, i) => {
          const dot = document.createElement('button');
          dot.className = 'page-dot' + (i === currentPage ? ' active' : '');
          dot.title = `Page ${i + 1}`;
          dot.onclick = () => { currentPage = i; render(); };
          dots.appendChild(dot);
        });
      }

      // Button states
      document.getElementById('ctrl-prev').disabled = currentPage === 0;
      document.getElementById('ctrl-next').disabled = currentPage === pages.length - 1;
      document.getElementById('arrow-prev').disabled = currentPage === 0;
      document.getElementById('arrow-next').disabled = currentPage === pages.length - 1;

      // Scroll viewer to top
      document.getElementById('comic-viewer').scrollTo({ top: 0, behavior: 'smooth' });

      // Scroll active thumb into view
      setTimeout(() => {
        const activeThumb = document.querySelector('.thumb-item.active');
        if (activeThumb) activeThumb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }, 100);
    }

    function renderThumbs() {
      const strip = document.getElementById('thumb-strip');
      const pages = ISSUES[currentIssue].pages;
      strip.innerHTML = '';
      pages.forEach((page, i) => {
        const item = document.createElement('div');
        item.className = 'thumb-item' + (i === currentPage ? ' active' : '');
        item.onclick = () => { currentPage = i; render(); };

        const img = document.createElement('img');
        img.src = page.src;
        img.alt = `Page ${i + 1}`;
        img.onerror = () => {
          item.innerHTML = `<div class="thumb-placeholder">${i === 0 ? 'CVR' : i}</div>`;
          item.innerHTML += `<span class="thumb-num">${i + 1}</span>`;
          item.onclick = () => { currentPage = i; render(); };
        };

        const num = document.createElement('span');
        num.className = 'thumb-num';
        num.textContent = i + 1;

        item.appendChild(img);
        item.appendChild(num);
        strip.appendChild(item);
      });
    }

    function nextPage() {
      const pages = ISSUES[currentIssue].pages;
      if (currentPage < pages.length - 1) {
        currentPage++;
        render();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        render();
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
    });

    // Touch/swipe support
    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; });
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) {
        if (dx < 0) nextPage();
        else prevPage();
      }
    });

    init();
  </script>

</body>
</html>
