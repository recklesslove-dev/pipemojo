<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0a0c">
<title>Pipe Mojo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Mojo">
<style>
  :root {
    --top: #0d0a0c;
    --bottom: #140c07;
    --ink: #e8dcc4;
    --glow: #7a3fb0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]), :root[data-theme="dark"] { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--top); }
  body {
    background: linear-gradient(var(--top), var(--bottom));
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    font-family: Georgia, "Times New Roman", serif;
  }
  .stage { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; }
  .backdrop, .mojo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .backdrop { object-fit: cover; filter: blur(28px) brightness(.45) saturate(1.2); transform: scale(1.15); }
  .mojo { object-fit: contain; opacity: 0; }
  .mojo.on { opacity: 1; }
  .react { transition: opacity .4s ease; }      /* fade back to idle */
  .react.on { transition: opacity .15s ease; }  /* snap in on tap */
  /* Any portrait screen: go edge to edge */
  @media (orientation: portrait) { .mojo { object-fit: cover; } .backdrop { display: none; } }
  .mute {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(122, 63, 176, .5); background: rgba(20, 12, 7, .55);
    color: var(--ink); font-size: 18px; line-height: 38px; text-align: center;
    padding: 0; opacity: .55; z-index: 5;
  }
  .wake {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform: translateX(-50%);
    color: var(--ink); background: rgba(20, 12, 7, .72);
    border: 1px solid rgba(122, 63, 176, .6); border-radius: 999px;
    padding: 12px 22px; font-size: 17px; font-style: italic;
    box-shadow: 0 0 24px rgba(122, 63, 176, .35);
    display: none;
  }
  .wake.show { display: block; }
  @media (prefers-reduced-motion: reduce) { .backdrop { display: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video class="backdrop" id="bg" muted playsinline loop preload="auto"></video>
  <video class="mojo on" id="a" muted playsinline preload="auto"></video>
  <video class="mojo" id="b" muted playsinline preload="auto"></video>
  <video class="mojo react" id="r" muted playsinline preload="auto"></video>
  <button class="wake" id="wake" type="button">Tap to wake Mojo</button>
  <button class="mute" id="mute" type="button" aria-label="Sound on or off">🔊</button>
</div>
<script src="sounds.js"></script>
<script>
  // Clip library. Tap reactions play on tap; bits play on their own every 30-60s.
  const CLIPS = {
    idle: "idle.mp4",
    // Single tap anywhere: random from this list, never twice in a row
    reactions: ["react-glare.mp4", "react-wrench.mp4", "react-hattip.mp4",
                "react-startle.mp4", "react-shoo.mp4", "react-wrenchtap.mp4"],
    rare: "rare-thumbs.mp4",       // 1 in 10 single taps
    laugh: "special-laugh.mp4",    // triple-tap the belly
    stomp: "special-stomp.mp4",    // 5+ fast taps anywhere
    powerup: "special-powerup.mp4", // long-press (hold) anywhere
    // Voodoo magic: double-tap plays a random one; 1 in 4 idle bits are magic
    magic: ["special-powerup.mp4", "magic-rage.mp4", "magic-smoke.mp4",
            "magic-surge.mp4", "magic-levitate.mp4"],
    bits: ["bit-stretch.mp4", "bit-yawn.mp4", "bit-look.mp4", "bit-twirl.mp4"]
  };
  // Slower dissolve back to idle for clips that end further from home (seconds)
  const FADE_OUT = { "magic-surge.mp4": 0.8, "seasonal-pumpkin.mp4": 0.6 };

  // Halloween: Oct 1-31 these join the idle bits and the double-tap spells
  const HALLOWEEN = ["seasonal-pumpkin.mp4", "seasonal-bats.mp4"];
  const FORCE_HALLOWEEN = false; // set true to preview outside October
  if (FORCE_HALLOWEEN || new Date().getMonth() === 9) {
    CLIPS.bits.push(...HALLOWEEN);
    CLIPS.magic.push(...HALLOWEEN);
  }
  const MAGIC_IDLE_CHANCE = 0.25;
  // Belly zone in video pixels (video is 400x736)
  const BELLY = { x: 115, y: 360, w: 170, h: 150 };

  const a = document.getElementById("a");
  const b = document.getElementById("b");
  const bg = document.getElementById("bg");
  const wake = document.getElementById("wake");
  let front = a, back = b;
  const SWAP_EARLY = 0.06; // seconds before the end to hand off

  [a, b, bg].forEach(v => { v.src = CLIPS.idle; });

  // Double-buffered loop: when the front clip nears its end, start the
  // back one from 0 and swap. Avoids Safari's hitch on the loop attribute.
  function swap() {
    back.currentTime = 0;
    back.play().catch(() => {});
    back.classList.add("on");
    front.classList.remove("on");
    front.pause();
    [front, back] = [back, front];
    watch(front);
  }

  function watch(v) {
    if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) {
      const tick = (now, meta) => {
        if (v !== front) return;
        if (v.duration && meta.mediaTime >= v.duration - SWAP_EARLY) swap();
        else v.requestVideoFrameCallback(tick);
      };
      v.requestVideoFrameCallback(tick);
    } else {
      v.loop = true; // fallback: plain loop
    }
  }

  async function start() {
    try {
      await front.play();
      bg.play().catch(() => {});
      wake.classList.remove("show");
      if (!started) { started = true; watch(front); scheduleBit(); }
    } catch (e) {
      wake.classList.add("show");
    }
  }

  // Keep the screen awake while he's on the desk (Safari 16.4+).
  let lock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !lock) lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } catch (e) {}
  }

  // ---------- Sound ----------
  // Per clip: [sound, seconds into the clip, volume, playback speed]
  const SFX = {
    "react-glare.mp4":     [["rustle", 0.05, 0.5]],
    "react-wrench.mp4":    [["swoosh", 0.3, 0.6], ["swoosh", 1.45, 0.5]],
    "react-hattip.mp4":    [["rustle", 0.3, 0.5], ["swoosh", 0.75, 0.3]],
    "react-startle.mp4":   [["boing", 0.3, 0.6]],
    "react-shoo.mp4":      [["swoosh", 0.3, 0.45], ["swoosh", 1.7, 0.4]],
    "react-wrenchtap.mp4": [["clang", 1.12, 0.45], ["clang", 1.88, 0.5], ["clang", 2.47, 0.55]],
    "rare-thumbs.mp4":     [["ping", 1.0, 0.5]],
    "special-laugh.mp4":   [["giggle", 0.35, 0.6, 0.85], ["giggle", 1.9, 0.45, 0.8]],
    "special-stomp.mp4":   [["rustle2", 0.3, 0.4], ["thud", 0.88, 0.7], ["thud", 1.38, 0.75], ["thud", 1.83, 0.7],
                            ["thud", 2.48, 0.8], ["thud", 3.13, 0.75], ["thud", 3.53, 0.85]],
    "special-powerup.mp4": [["twinkle", 0.2, 0.3], ["buzz", 0.3, 0.35], ["zap", 1.0, 0.5]],
    "magic-rage.mp4":      [["fire", 0.1, 0.6]],
    "magic-smoke.mp4":     [["swoosh", 0.3, 0.3, 0.7], ["chime", 0.4, 0.5]],
    "magic-surge.mp4":     [["buzz", 0.4, 0.25], ["zap", 0.55, 0.45], ["zap", 1.8, 0.4]],
    "magic-levitate.mp4":  [["twinkle", 0.5, 0.5], ["chime", 2.9, 0.25]],
    "bit-look.mp4":        [["knock", 0, 0.35]],
    "bit-stretch.mp4":     [["rustle", 0.3, 0.4], ["rustle2", 3.2, 0.3]],
    "bit-yawn.mp4":        [["yawn", 0.4, 0.6, 0.8], ["rustle2", 0.3, 0.15]],
    "bit-twirl.mp4":       [["swoosh", 0.65, 0.45, 1.15]],
    "seasonal-pumpkin.mp4":[["twinkle", 1.2, 0.5], ["swoosh", 3.35, 0.4], ["chime", 3.45, 0.3]],
    "seasonal-bats.mp4":   [["wings", 0.55, 0.6]]
  };
  const HUM_VOL = 0.12, DRIP_MIN = 10, DRIP_MAX = 25; // background
  const DRIPS = ["drip1", "drip2", "drip3", "drip4"];

  let actx = null, master = null, buffers = {}, active = [], dripTimer = null;
  let muted = false;
  try { muted = localStorage.getItem("mojo-muted") === "1"; } catch (e) {}
  const muteBtn = document.getElementById("mute");
  muteBtn.textContent = muted ? "🔇" : "🔊";

  function b64ToBuf(b64) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  function decode(buf) {
    return new Promise((ok, bad) => { const p = actx.decodeAudioData(buf, ok, bad); if (p && p.then) p.then(ok, bad); });
  }

  // Must be called from a tap (iPhone only allows sound after a user gesture)
  function initAudio() {
    if (actx) { if (actx.state !== "running") actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !window.MOJO_SOUNDS) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 1;
    master.connect(actx.destination);
    Promise.all(Object.entries(window.MOJO_SOUNDS).map(([name, b64]) =>
      decode(b64ToBuf(b64)).then(b => { buffers[name] = b; }).catch(() => {})
    )).then(startAmbient);
  }

  function playSound(name, when = 0, vol = 1, rate = 1, loop = false) {
    const buf = buffers[name];
    if (!actx || !buf) return null;
    const src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = buf; src.playbackRate.value = rate; g.gain.value = vol;
    if (loop) { src.loop = true; src.loopStart = 0.05; src.loopEnd = buf.duration - 0.05; }
    src.connect(g); g.connect(master);
    src.start(actx.currentTime + when);
    return src;
  }

  function startAmbient() {
    playSound("hum", 0, HUM_VOL, 1, true);
    scheduleDrip();
  }
  function scheduleDrip() {
    clearTimeout(dripTimer);
    dripTimer = setTimeout(() => {
      if (document.visibilityState === "visible")
        playSound(DRIPS[Math.floor(Math.random() * DRIPS.length)], 0,
                  0.12 + Math.random() * 0.13, 0.9 + Math.random() * 0.2);
      scheduleDrip();
    }, (DRIP_MIN + Math.random() * (DRIP_MAX - DRIP_MIN)) * 1000);
  }

  function stopClipSounds() {
    active.forEach(s => { try { s.stop(); } catch (e) {} });
    active = [];
  }
  function clipSounds(src) {
    stopClipSounds();
    const cues = SFX[src] || SFX[src.split("/").pop()];
    if (!cues) return;
    cues.forEach(([name, t, vol, rate]) => {
      const s = playSound(name, t, vol, rate || 1);
      if (s) active.push(s);
    });
  }

  muteBtn.addEventListener("pointerdown", e => e.stopPropagation());
  muteBtn.addEventListener("click", e => {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
    try { localStorage.setItem("mojo-muted", muted ? "1" : "0"); } catch (err) {}
    initAudio();
    if (master) master.gain.setTargetAtTime(muted ? 0 : 1, actx.currentTime, 0.05);
  });

  // Overlay clips: tap reactions, specials, and idle bits (random timer).
  const r = document.getElementById("r");
  let playing = null;            // null | "react" | "bit"
  let started = false;
  const last = { react: -1, bit: -1, magic: -1 };
  const BIT_MIN = 30, BIT_MAX = 60; // seconds between idle bits
  let bitTimer = null;

  function pick(kind, list) {
    if (list.length === 1) return 0;
    let i; do { i = Math.floor(Math.random() * list.length); } while (i === last[kind]);
    last[kind] = i;
    return i;
  }

  async function playClip(src, kind) {
    clearTimeout(bitTimer);
    playing = kind;
    r.classList.remove("on");
    r.style.transition = "";
    r.dataset.fade = FADE_OUT[src.split("/").pop()] || FADE_OUT[src] || "";
    r.src = src;
    try { await r.play(); r.classList.add("on"); clipSounds(src); }
    catch (e) { playing = null; scheduleBit(); }
  }

  function scheduleBit() {
    clearTimeout(bitTimer);
    const wait = (BIT_MIN + Math.random() * (BIT_MAX - BIT_MIN)) * 1000;
    bitTimer = setTimeout(() => {
      if (!playing && document.visibilityState === "visible") {
        if (Math.random() < MAGIC_IDLE_CHANCE) playClip(CLIPS.magic[pick("magic", CLIPS.magic)], "bit");
        else playClip(CLIPS.bits[pick("bit", CLIPS.bits)], "bit");
      }
      else scheduleBit();
    }, wait);
  }

  r.addEventListener("ended", () => {
    const fade = parseFloat(r.dataset.fade) || 0.4;
    r.style.transition = `opacity ${fade}s ease`;
    r.classList.remove("on");
    const src = r.src;
    setTimeout(() => { if (r.src === src) playing = null; }, fade * 1000);
    scheduleBit();
  });

  function react() {
    if (playing === "react") return;   // let the current reaction finish
    const src = Math.random() < 0.1
      ? CLIPS.rare
      : CLIPS.reactions[pick("react", CLIPS.reactions)];
    playClip(src, "react");
  }

  function magic() { playClip(CLIPS.magic[pick("magic", CLIPS.magic)], "react"); }

  // Map a screen tap to video pixels (handles cover and contain layouts)
  function toVideo(x, y) {
    const W = window.innerWidth, H = window.innerHeight;
    const vw = front.videoWidth || 400, vh = front.videoHeight || 736;
    const fit = getComputedStyle(front).objectFit;
    const s = fit === "cover" ? Math.max(W / vw, H / vh) : Math.min(W / vw, H / vh);
    return { x: (x - (W - vw * s) / 2) / s, y: (y - (H - vh * s) / 2) / s };
  }
  function inBelly(x, y) {
    const v = toVideo(x, y);
    return v.x >= BELLY.x && v.x <= BELLY.x + BELLY.w && v.y >= BELLY.y && v.y <= BELLY.y + BELLY.h;
  }

  let taps = [], bellyTaps = [], bellyTimer = null;
  // Long-press: hold ~0.6s to power him up
  let holdTimer = null, suppressClick = false;
  const stage = document.getElementById("stage");
  stage.addEventListener("pointerdown", () => {
    initAudio();
    if (!started) return;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      suppressClick = true;
      taps = []; bellyTaps = []; clearTimeout(bellyTimer);
      playClip(CLIPS.powerup, "react");
    }, 600);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
    stage.addEventListener(ev, () => clearTimeout(holdTimer)));
  stage.addEventListener("contextmenu", e => e.preventDefault());

  function onTap(e) {
    if (suppressClick) { suppressClick = false; return; }
    initAudio();
    keepAwake();
    if (!started || front.paused) { start(); return; }
    const now = performance.now();
    taps = taps.filter(t => now - t < 2000); taps.push(now);

    // Tap spam: 5+ taps in 2 seconds, anywhere
    if (taps.length >= 5) {
      taps = []; bellyTaps = []; clearTimeout(bellyTimer);
      playClip(CLIPS.stomp, "react");
      return;
    }
    // Belly: wait a beat to see if it's a triple-tap
    if (inBelly(e.clientX, e.clientY)) {
      bellyTaps = bellyTaps.filter(t => now - t < 1000); bellyTaps.push(now);
      clearTimeout(bellyTimer);
      bellyTimer = setTimeout(() => {
        const n = bellyTaps.length; bellyTaps = [];
        if (n === 3) playClip(CLIPS.laugh, "react");
        else if (n === 2) magic();
        else if (n === 1) react();
      }, 350);
      return;
    }
    // Double-tap (exactly 2 quick taps): random voodoo magic
    if (taps.length === 2 && now - taps[0] < 350) { magic(); return; }
    react();
  }

  document.getElementById("stage").addEventListener("click", onTap);
  document.addEventListener("visibilitychange", () => {
    if (actx) { if (document.visibilityState === "visible") actx.resume(); else actx.suspend(); }
    if (document.visibilityState === "visible") { front.play().catch(() => {}); bg.play().catch(() => {}); if (lock === null) keepAwake(); }
  });

  start();
</script>
</body>
</html>
