<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0a0c">
<title>Pipe Mojo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Mojo">
<style>
  :root {
    --top: #0d0a0c;
    --bottom: #140c07;
    --ink: #e8dcc4;
    --glow: #7a3fb0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]), :root[data-theme="dark"] { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--top); }
  body {
    background: linear-gradient(var(--top), var(--bottom));
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: Georgia, "Times New Roman", serif;
  }
  .stage { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; }
  .backdrop, .mojo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .backdrop { object-fit: cover; filter: blur(28px) brightness(.45) saturate(1.2); transform: scale(1.15); }
  .mojo { object-fit: contain; opacity: 0; }
  .mojo.on { opacity: 1; }
  .react { transition: opacity .18s ease; }
  .react.bit { transition: opacity .45s ease; }
  /* Any portrait screen: go edge to edge */
  @media (orientation: portrait) { .mojo { object-fit: cover; } .backdrop { display: none; } }
  .wake {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform: translateX(-50%);
    color: var(--ink); background: rgba(20, 12, 7, .72);
    border: 1px solid rgba(122, 63, 176, .6); border-radius: 999px;
    padding: 12px 22px; font-size: 17px; font-style: italic;
    box-shadow: 0 0 24px rgba(122, 63, 176, .35);
    display: none;
  }
  .wake.show { display: block; }
  @media (prefers-reduced-motion: reduce) { .backdrop { display: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video class="backdrop" id="bg" muted playsinline loop preload="auto"></video>
  <video class="mojo on" id="a" muted playsinline preload="auto"></video>
  <video class="mojo" id="b" muted playsinline preload="auto"></video>
  <video class="mojo react" id="r" muted playsinline preload="auto"></video>
  <button class="wake" id="wake" type="button">Tap to wake Mojo</button>
</div>
<script>
  // Clip library. Tap reactions play on tap; bits play on their own every 30-60s.
  const CLIPS = {
    idle: "idle.mp4",
    reactions: ["react-glare.mp4", "react-wrench.mp4", "react-hattip.mp4"],
    bits: ["bit-stretch.mp4", "bit-yawn.mp4", "bit-look.mp4", "bit-twirl.mp4"]
  };

  const a = document.getElementById("a");
  const b = document.getElementById("b");
  const bg = document.getElementById("bg");
  const wake = document.getElementById("wake");
  let front = a, back = b;
  const SWAP_EARLY = 0.06; // seconds before the end to hand off

  [a, b, bg].forEach(v => { v.src = CLIPS.idle; });

  // Double-buffered loop: when the front clip nears its end, start the
  // back one from 0 and swap. Avoids Safari's hitch on the loop attribute.
  function swap() {
    back.currentTime = 0;
    back.play().catch(() => {});
    back.classList.add("on");
    front.classList.remove("on");
    front.pause();
    [front, back] = [back, front];
    watch(front);
  }

  function watch(v) {
    if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) {
      const tick = (now, meta) => {
        if (v !== front) return;
        if (v.duration && meta.mediaTime >= v.duration - SWAP_EARLY) swap();
        else v.requestVideoFrameCallback(tick);
      };
      v.requestVideoFrameCallback(tick);
    } else {
      v.loop = true; // fallback: plain loop
    }
  }

  async function start() {
    try {
      await front.play();
      bg.play().catch(() => {});
      wake.classList.remove("show");
      if (!started) { started = true; watch(front); scheduleBit(); }
    } catch (e) {
      wake.classList.add("show");
    }
  }

  // Keep the screen awake while he's on the desk (Safari 16.4+).
  let lock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !lock) lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } catch (e) {}
  }

  // Overlay clips: tap reactions (on tap) and idle bits (on a random timer).
  const r = document.getElementById("r");
  let playing = null;            // null | "react" | "bit"
  let started = false;
  const last = { react: -1, bit: -1 };
  const BIT_MIN = 30, BIT_MAX = 60; // seconds between idle bits
  let bitTimer = null;

  function pick(kind, list) {
    if (list.length === 1) return 0;
    let i; do { i = Math.floor(Math.random() * list.length); } while (i === last[kind]);
    last[kind] = i;
    return i;
  }

  async function playOverlay(kind) {
    const list = kind === "react" ? CLIPS.reactions : CLIPS.bits;
    if (!list.length) return;
    playing = kind;
    r.classList.toggle("bit", kind === "bit");
    r.src = list[pick(kind, list)];
    try { await r.play(); r.classList.add("on"); }
    catch (e) { playing = null; }
  }

  function scheduleBit() {
    clearTimeout(bitTimer);
    const wait = (BIT_MIN + Math.random() * (BIT_MAX - BIT_MIN)) * 1000;
    bitTimer = setTimeout(() => {
      if (!playing && document.visibilityState === "visible") playOverlay("bit");
      else scheduleBit();
    }, wait);
  }

  r.addEventListener("ended", () => {
    r.classList.remove("on");
    const was = playing;
    setTimeout(() => { if (playing === was) playing = null; }, 450);
    scheduleBit();
  });

  function react() {
    if (playing === "react") return;   // let the current reaction finish
    clearTimeout(bitTimer);            // a tap interrupts a bit
    playOverlay("react");
  }

  document.getElementById("stage").addEventListener("click", () => {
    keepAwake();
    if (!started || front.paused) { start(); return; }
    react();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { front.play().catch(() => {}); bg.play().catch(() => {}); if (lock === null) keepAwake(); }
  });

  start();
</script>
</body>
</html>
