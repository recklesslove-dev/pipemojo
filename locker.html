<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mojo's Locker | Pipe Mojo</title>
<meta name="theme-color" content="#07050c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mojo's Locker">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="image" href="/assets/locker-bg.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f2ece2;--muted:#a49bb2;--cyan:#00e5ff;--gold:#f5c842;--red:#e8281e;--rust:#b4552a;--locker:#5f7a5a;
  --title:'Pirata One',Georgia,serif;--body:Nunito,system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07050c;color:var(--ink);font-family:var(--body)}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
a{color:inherit;text-decoration:none}

/* the room: a 2:3 stage that fits any screen, with a blurred copy of the room filling the edges */
.fill{position:fixed;inset:-40px;background:url(/assets/locker-bg.jpg) center/cover;filter:blur(28px) brightness(.35)}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:2/3;height:100vh;height:100dvh;max-width:100vw;
  background:url(/assets/locker-bg.jpg) center/cover;overflow:hidden;container-type:size}
@media (max-aspect-ratio:2/3){.stage{width:100vw;height:auto}}
.flicker{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:radial-gradient(circle at 46.6% 17.8%,rgba(255,214,140,.55) 0%,rgba(255,190,110,.18) 28%,transparent 60%)}
.dark{position:absolute;inset:0;pointer-events:none;background:#000;opacity:0}
.dust{position:absolute;inset:0;pointer-events:none}
.drop{position:absolute;left:41%;top:58.4%;width:.7%;aspect-ratio:1/1.5;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 35%,#cfe9ff,#5a7fa6);opacity:0}
.ripple{position:absolute;left:41%;top:86.3%;width:6%;aspect-ratio:3/1;transform:translate(-50%,-50%) scale(.2);border-radius:50%;
  border:2px solid rgba(190,220,255,.55);opacity:0}
.steam{position:absolute;left:28%;top:56%;width:9%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(220,220,235,.5),transparent 70%);opacity:0;filter:blur(3px)}

/* Mojo, idling */
.mojo{position:absolute;left:31%;bottom:6.5%;height:50%;transform:translateX(-50%);transform-origin:50% 100%;cursor:pointer}
.mojo .shadow{position:absolute;left:50%;bottom:-1.5%;width:70%;height:6%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 70%)}
.mojo .body{height:100%;transform-origin:50% 100%;animation:sway 5.2s ease-in-out infinite}
.mojo .breath{height:100%;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.mojo img,.mojo canvas{height:100%;width:auto;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.55)) brightness(var(--lit,1));pointer-events:none}
.mojo canvas{display:none}
.mojo.live canvas{display:block}.mojo.live img{display:none}
@keyframes sway{0%,100%{transform:rotate(-1.1deg) translateX(-.6%)}50%{transform:rotate(1.1deg) translateX(.6%)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.018)}}
.mojo.live .body,.mojo.live .breath{animation:none} /* the video has its own idle */
.mojo.tilt .body{animation:tilt 1.1s ease-in-out}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}65%{transform:rotate(2.5deg)}}
.mojo.tap .body{animation:tapw .9s ease-in-out}
@keyframes tapw{0%,100%{transform:translateY(0)}20%,60%{transform:translateY(-1.2%) rotate(-1deg)}40%,80%{transform:translateY(0) rotate(.5deg)}}
.mojo.hop .body{animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(0) scale(1.05,.92)}45%{transform:translateY(-9%) scale(.96,1.05)}75%{transform:translateY(0) scale(1.04,.95)}}
.say{position:absolute;left:43%;bottom:52%;max-width:46%;background:#f2ece2;color:#140d1c;font-weight:800;font-size:clamp(.8rem,3.4cqw,1.15rem);
  padding:.55em .9em;border-radius:14px;opacity:0;transform:translateY(8px) scale(.9);transition:opacity .2s,transform .25s cubic-bezier(.2,1.5,.4,1);pointer-events:none}
.say::after{content:'';position:absolute;left:14px;bottom:-9px;border:9px solid transparent;border-top-color:#f2ece2;border-bottom:0}
.say.on{opacity:1;transform:none}

/* the locker you can tap */
.lockerHit{position:absolute;left:65.5%;top:22%;width:34%;height:66%;cursor:pointer;border-radius:6px}
.lockerHit::after{content:'';position:absolute;inset:0;border-radius:6px;box-shadow:0 0 0 2px rgba(245,200,66,.0),0 0 26px rgba(245,200,66,0);animation:hint 2.6s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 2px rgba(245,200,66,0),0 0 22px rgba(245,200,66,0)}50%{box-shadow:0 0 0 2px rgba(245,200,66,.55),0 0 26px rgba(245,200,66,.35)}}
.tag{position:absolute;left:82.5%;top:91%;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:clamp(.72rem,3cqw,1rem);
  color:var(--gold);background:rgba(10,6,14,.72);padding:.35em .8em;border-radius:999px;border:1px solid rgba(245,200,66,.35);pointer-events:none}

/* top bar */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 10px calc(12px + env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.pill{font-weight:800;font-size:.85rem;background:rgba(10,6,14,.72);border:1.5px solid rgba(255,255,255,.18);padding:7px 12px;border-radius:999px;white-space:nowrap}
.title{font-family:var(--title);font-size:1.7rem;color:var(--gold);text-shadow:0 2px 0 #000,0 0 16px rgba(245,200,66,.35)}

/* the open locker: your gear */
.gear{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,3,8,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.gear.on{opacity:1;pointer-events:auto}
.sheet{width:min(720px,100%);height:min(86vh,860px);height:min(86dvh,860px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,#4e6a4b 0%,#3c5239 6px,#1b1420 6px,#120d17 100%);border-radius:18px 18px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,1.1,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px);border-top:3px solid #6f8c6a}
.gear.on .sheet{transform:none}
.sheetHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.sheetHead h2{font-family:var(--title);font-weight:400;font-size:2rem;color:var(--gold)}
.close{font-weight:800;background:#2a2033;padding:9px 14px;border-radius:10px}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.tabs button{flex:1;min-width:84px;font-weight:800;font-size:.92rem;padding:10px 8px;border-radius:10px;background:#211a2a;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--gold);color:#1a1004}
.panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 22px}
.panel[hidden]{display:none}
.note{font-size:.88rem;color:var(--muted);line-height:1.45;margin:4px 0 12px}
.rank{text-align:center}
.rank .ins{width:min(62vw,270px);aspect-ratio:1;margin:0 auto}
.rank h3{font-family:var(--title);font-weight:400;font-size:2.2rem;line-height:1;margin-top:4px}
.rank .sub{color:var(--muted);font-weight:700;margin-top:6px}
.bar{height:12px;border-radius:999px;background:#2a2033;overflow:hidden;margin:14px auto 6px;max-width:360px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe9a3);border-radius:999px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.ladder div{text-align:center;background:#1b1522;border-radius:12px;padding:8px 4px;font-size:.75rem;font-weight:800;color:var(--muted)}
.ladder div.on{color:var(--ink);outline:2px solid var(--gold)}
.ladder svg{width:100%;aspect-ratio:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 4px;border-radius:12px;background:#1b1522;border:1px solid rgba(255,255,255,.06);font-weight:800}
.tile .badge{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a2a52,#160d22);border:3px solid var(--gold);overflow:hidden;position:relative;color:#ffb347}
.tile .badge svg{width:84%;height:84%}
.tile .badge img{height:46px;width:auto;max-width:90%;object-fit:contain}
.tile b{font-size:.8rem;line-height:1.15}
.tile small{font-size:.68rem;color:var(--muted);font-weight:600;line-height:1.2}
.tile.locked .badge{filter:grayscale(1) brightness(.55);opacity:.45;border-color:#555}
.tile.locked b{color:var(--muted)}
.tile .crown{position:absolute;top:-3px;right:-1px;font-size:1rem}
.skin .badge{border-radius:14px;background:#0f0b14;border-color:#3a3242}
.skin.earned .badge{border-color:var(--gold)}
.skin.earned small{color:var(--gold)}
.skin.worn .badge{border-color:var(--cyan);box-shadow:0 0 14px rgba(0,229,255,.5)}
.skin.worn small{color:var(--cyan)}
.ver{position:fixed;right:10px;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:4;font-size:.68rem;color:rgba(255,255,255,.3)}
.skin.locked .badge{filter:grayscale(.85) brightness(.8);opacity:.6}
.soon{display:inline-block;margin:0 0 12px;font-size:.8rem;font-weight:800;color:#1a1004;background:var(--gold);padding:4px 10px;border-radius:999px}
.mojoTab{text-align:center}
.mojoTab img{height:min(36vh,260px);width:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.mojoTab ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;text-align:left}
.mojoTab li{background:#1b1522;border-radius:12px;padding:10px 12px;font-weight:700;font-size:.88rem}
.mojoTab li b{display:block;color:var(--gold);font-size:.95rem}
@media (prefers-reduced-motion:reduce){.mojo .body,.mojo .breath,.lockerHit::after{animation:none}}
</style>
</head>
<body>
<div class="fill" aria-hidden="true"></div>
<main class="stage" id="stage" aria-label="Mojo's locker room">
  <div class="dark" id="dark"></div>
  <div class="flicker" id="flicker"></div>
  <canvas class="dust" id="dust" aria-hidden="true"></canvas>
  <div class="steam" id="steam"></div>
  <div class="drop" id="drop"></div>
  <div class="ripple" id="ripple"></div>
  <button class="mojo" id="mojo" aria-label="Pipe Mojo">
    <div class="shadow"></div>
    <div class="body"><div class="breath"><canvas id="mojoCv" width="416" height="688" aria-hidden="true"></canvas><img id="mojoImg" src="/assets/mojo-front.png" alt=""></div></div>
  </button>
  <div class="say" id="say" aria-live="polite"></div>
  <video id="mojoVid" src="/assets/mojo-idle.mp4" muted playsinline loop autoplay preload="auto" hidden></video>
  <button class="lockerHit" id="lockerHit" aria-label="Open the locker"></button>
  <div class="tag">Tap the locker</div>
</main>

<div class="top">
  <a class="pill" href="/play">‹ Games</a>
  <span class="title">Mojo's Locker</span>
  <button class="pill" id="sound" aria-pressed="true">Sound on</button>
</div>

<p class="ver">Locker v1.1</p>
<section class="gear" id="gear" aria-label="Your gear" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gearTitle">
    <div class="sheetHead"><h2 id="gearTitle">Your gear</h2><button class="close" id="close">Close</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="rank">Rank</button>
      <button role="tab" aria-selected="false" data-tab="trophies">Trophies</button>
      <button role="tab" aria-selected="false" data-tab="skins">Pipe Skins</button>
      <button role="tab" aria-selected="false" data-tab="mojo">Mojo</button>
    </div>
    <div class="panel" id="p-rank"></div>
    <div class="panel" id="p-trophies" hidden></div>
    <div class="panel" id="p-skins" hidden></div>
    <div class="panel" id="p-mojo" hidden></div>
  </div>
</section>

<script>
(function(){
const $=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- your Flow run, read from this device ---------- */
function account(){try{return JSON.parse(localStorage.getItem('pm-lb')||'null')}catch(e){return null}}
function flowSave(){
  const a=account(),key=a?'pm-flow-save:'+String(a.name).toLowerCase().replace(/ /g,''):'pm-flow-save';
  try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}
}
const save=flowSave()||{};
const level=save.solved?(save.level||1)+1:(save.level||1);
const trophies=Array.isArray(save.trophies)?save.trophies:[];
const STARS=Math.max(0,Math.floor((level-1)/100));

/* ---------- sound ---------- */
const Snd={ac:null,on:true,
  unlock(){if(!this.ac){const AC=window.AudioContext||window.webkitAudioContext;if(AC){this.ac=new AC();this.m=this.ac.createGain();this.m.gain.value=.5;this.m.connect(this.ac.destination)}}
    if(this.ac&&this.ac.state==='suspended')this.ac.resume()},
  tone(f,d,type,v,slide,delay){if(!this.on||!this.ac)return;const c=this.ac,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.05)},
  noise(d,f,v,delay,q){if(!this.on||!this.ac)return;const c=this.ac,t=c.currentTime+(delay||0),n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();
    s.buffer=b;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q||1;g.gain.value=v||.2;s.connect(bp);bp.connect(g);g.connect(this.m);s.start(t)},
  drip(){this.tone(1400,.08,'sine',.05,700)},
  creak(){this.tone(180,.6,'sawtooth',.05,120);this.tone(240,.5,'sawtooth',.03,330,.15);this.noise(.25,900,.18,.55,2);this.tone(90,.18,'square',.08,60,.62)},
  shut(){this.noise(.2,500,.3,0,1.5);this.tone(110,.2,'square',.07,70)},
  tap(){this.tone(900,.05,'triangle',.08);this.tone(1300,.06,'triangle',.06,null,.06)},
  pick(){this.tone(660,.08,'triangle',.1);this.tone(990,.12,'triangle',.08,null,.07)}
};
try{Snd.on=localStorage.getItem('pm-sound')!=='off'}catch(e){}
function syncSound(){$('sound').textContent=Snd.on?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(Snd.on))}
syncSound();
$('sound').addEventListener('click',()=>{Snd.on=!Snd.on;syncSound();Snd.unlock();try{localStorage.setItem('pm-sound',Snd.on?'on':'off')}catch(e){}});
document.addEventListener('pointerdown',()=>Snd.unlock(),{passive:true});

/* ---------- the room comes alive ---------- */
const mojo=$('mojo');
// the bulb flickers now and then, and Mojo's light flickers with it
(function flicker(){
  if(!reduced){
    const n=1+Math.floor(Math.random()*3);let k=0;
    const blink=()=>{const off=Math.random()<.5;$('flicker').style.opacity=off?.15:1;$('dark').style.opacity=off?.28:0;mojo.style.setProperty('--lit',off?.75:1);
      setTimeout(()=>{$('flicker').style.opacity=1;$('dark').style.opacity=0;mojo.style.setProperty('--lit',1);if(++k<n)setTimeout(blink,60+Math.random()*90)},50+Math.random()*90)};
    blink();
  }
  setTimeout(flicker,3500+Math.random()*6000);
})();
// water drips from the pipe into the puddle
(function drip(){
  const d=$('drop'),r=$('ripple');
  if(!reduced){
    d.animate([{opacity:0,transform:'translateY(0) scale(.6)'},{opacity:1,transform:'translateY(0) scale(1)',offset:.25},
      {opacity:1,transform:'translateY(2700%) scale(1)'}],{duration:900,easing:'cubic-bezier(.5,0,.9,.6)'}).onfinish=()=>{
      r.animate([{opacity:.9,transform:'translate(-50%,-50%) scale(.2)'},{opacity:0,transform:'translate(-50%,-50%) scale(1.4)'}],{duration:800,easing:'ease-out'});
      Snd.drip();
    };
  }
  setTimeout(drip,1600+Math.random()*1600);
})();
// a puff of steam from the joint every so often
(function steam(){
  if(!reduced)$('steam').animate([{opacity:0,transform:'translate(0,0) scale(.5)'},{opacity:.7,transform:'translate(-10%,-30%) scale(1)',offset:.3},{opacity:0,transform:'translate(-25%,-120%) scale(1.8)'}],{duration:2200,easing:'ease-out'});
  setTimeout(steam,7000+Math.random()*7000);
})();
// dust floating in the light
(function dust(){
  const cv=$('dust'),ctx=cv.getContext('2d');let W=0,H=0,ps=[];
  const size=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    ps=Array.from({length:reduced?0:38},()=>({x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.6+.4,vx:(Math.random()-.5)*6,vy:Math.random()*4+1,p:Math.random()*6}))};
  size();addEventListener('resize',size);
  let last=performance.now();
  (function step(t){const dt=Math.min(.05,(t-last)/1000);last=t;ctx.clearRect(0,0,W,H);
    for(const p of ps){p.p+=dt;p.x+=(p.vx+Math.sin(p.p)*3)*dt;p.y+=p.vy*dt;if(p.y>H*.85){p.y=0;p.x=Math.random()*W}
      const lx=W*.466,ly=H*.178,dist=Math.hypot(p.x-lx,p.y-ly)/(W*.6),a=Math.max(0,.55-dist*.5);
      ctx.fillStyle='rgba(255,226,170,'+a.toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()}
    requestAnimationFrame(step)})(last);
})();
// Mojo does a little something every few seconds
(function idle(){
  if(!reduced&&!mojo.classList.contains('live')&&!$('gear').classList.contains('on')){
    const move=Math.random()<.55?'tilt':'tap';
    mojo.classList.remove('tilt','tap','hop');void mojo.offsetWidth;mojo.classList.add(move);
    setTimeout(()=>mojo.classList.remove(move),1200);
  }
  setTimeout(idle,4000+Math.random()*4000);
})();
const LINES=[
  'Hands off the wrench.','You checkin\' out my locker?','Pressure\'s on, baby.','Who dat knockin\'?','Every pipe got a story.','Earn them stars.',
  // cocky
  'I don\'t fix pipes. Pipes fix themselves when they see me.','You call that a wrench grip?','Ganja thinks he\'s the star. Cute.',
  // plumber humor
  'Righty tighty, lefty loosey.','Water always wins, baby.','Ever seen a PEX crimp done right? Me neither.','Don\'t ask what\'s in the drain.',
  // New Orleans
  'Laissez les bons temps rouler.','Mais, look who came back.','Roux\'s been askin\' about you.'
];
/* lines that know how you're doing */
const STARS_NOW=Math.max(0,Math.floor((level-1)/100)),TO_STAR=(STARS_NOW+1)*100-level+1;
const JUST_BEAT=STARS_NOW>0&&level-STARS_NOW*100<=5&&trophies.includes('b'+STARS_NOW*100);
let away=0;try{const lastVisit=+localStorage.getItem('pm-locker-last')||0;away=lastVisit?(Date.now()-lastVisit)/86400000:0;localStorage.setItem('pm-locker-last',String(Date.now()))}catch(e){}
function progressLine(){
  if(JUST_BEAT)return 'Lucky. Real lucky.';
  if(level>1&&TO_STAR<=30)return TO_STAR+' level'+(TO_STAR===1?'':'s')+' to your next star. Don\'t choke.';
  if(STARS_NOW>=11&&STARS_NOW<=15)return 'Gold, huh? Now we talkin\'.';
  return '';
}
let lastLine='';
function nextLine(){ // sometimes a line about your progress, otherwise a random one (never the same twice in a row)
  const p=progressLine();if(p&&p!==lastLine&&Math.random()<.3)return lastLine=p;
  let l;do{l=LINES[Math.floor(Math.random()*LINES.length)]}while(l===lastLine&&LINES.length>1);
  return lastLine=l;
}
let sayT=0;

/* ---------- Mojo on video: the green screen is keyed out live, so he stands right in the room ---------- */
(function liveMojo(){
  const v=$('mojoVid'),cv=$('mojoCv');
  const CROP_Y=28/752,CROP_H=688/752; // trim the empty green above and below him
  let draw=null;
  const gl=cv.getContext('webgl',{premultipliedAlpha:false,alpha:true});
  if(gl){
    const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s};
    const p=gl.createProgram();
    gl.attachShader(p,sh(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 uv;uniform vec2 crop;void main(){uv=vec2((p.x+1.)*.5,crop.x+(1.-(p.y+1.)*.5)*crop.y);gl_Position=vec4(p,0.,1.);}'));
    gl.attachShader(p,sh(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 uv;uniform sampler2D t;void main(){vec4 c=texture2D(t,uv);float m=max(c.r,c.b);float g=c.g-m;float a=1.-smoothstep(.09,.26,g);if(g>0.)c.g=m+min(g,.03);gl_FragColor=vec4(c.rgb,a);}'));
    gl.linkProgram(p);gl.useProgram(p);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    gl.uniform2f(gl.getUniformLocation(p,'crop'),CROP_Y,CROP_H);
    const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
    for(const [k,val] of [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]])gl.texParameteri(gl.TEXTURE_2D,k,val);
    gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);
    draw=()=>{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)};
  }else{ // older devices: key it out on a regular canvas
    const c2=cv.getContext('2d',{willReadFrequently:true});
    draw=()=>{c2.drawImage(v,0,CROP_Y*752,416,688,0,0,416,688);const d=c2.getImageData(0,0,416,688),x=d.data;
      for(let i=0;i<x.length;i+=4){const m=Math.max(x[i],x[i+2]),g=x[i+1]-m;if(g>23){const a=Math.max(0,Math.min(1,(66-g)/43));x[i+3]=a*255;x[i+1]=m+Math.min(g,8)}}
      c2.putImageData(d,0,0)};
  }
  let started=false;
  const loop=()=>{if(v.readyState>=2){try{draw()}catch(e){mojo.classList.remove('live');return}
      if(!started){started=true;mojo.classList.add('live')}}
    if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(loop);else requestAnimationFrame(loop)};
  let looping=false;const kick=()=>{if(!looping){looping=true;loop()}};
  const go=()=>{const p=v.play();if(p&&p.then)p.then(kick).catch(()=>{});else kick()};
  v.addEventListener('error',()=>mojo.classList.remove('live'));
  go();
  document.addEventListener('pointerdown',()=>{if(v.paused)go()},{once:true}); // low power mode can block autoplay until the first tap
})();

/* rank: a star for every boss beaten (every 100 levels). Bronze, Silver, Gold, Diamond, then a number in the middle */
const TIERS=[
  {name:'Bronze', light:'#f3c08a', mid:'#c4813f', dark:'#6e3f17', edge:'#3b1f08'},
  {name:'Silver', light:'#ffffff', mid:'#c9ced6', dark:'#6b7280', edge:'#2b2f36'},
  {name:'Gold',   light:'#fff1a8', mid:'#e9b93a', dark:'#8a5f10', edge:'#3d2804'},
  {name:'Diamond',light:'#ffffff', mid:'#9fe8ff', dark:'#3aa7d6', edge:'#0b3550', diamond:true}
];
function starPath(cx,cy,R,r){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)}return d+'Z'}
function bevelStar(cx,cy,R,t){
  const r=R*.42;let g='';
  for(let i=0;i<10;i++){const a1=-Math.PI/2+i*Math.PI/5,a2=-Math.PI/2+(i+1)*Math.PI/5,r1=i%2?r:R,r2=(i+1)%2?r:R;
    const fill=i%2?t.dark:t.light,f2=(i>=3&&i<=6)?(i%2?t.dark:t.mid):fill;
    g+='<path d="M'+cx+' '+cy+'L'+(cx+r1*Math.cos(a1)).toFixed(1)+' '+(cy+r1*Math.sin(a1)).toFixed(1)+'L'+(cx+r2*Math.cos(a2)).toFixed(1)+' '+(cy+r2*Math.sin(a2)).toFixed(1)+'Z" fill="'+f2+'"/>'}
  g+='<path d="'+starPath(cx,cy,R,r)+'" fill="none" stroke="'+t.edge+'" stroke-width="'+(R*.06).toFixed(1)+'" stroke-linejoin="round"/>';
  if(t.diamond)g+='<circle cx="'+(cx-R*.18).toFixed(1)+'" cy="'+(cy-R*.35).toFixed(1)+'" r="'+(R*.07).toFixed(1)+'" fill="#fff"/>';
  return g;
}
function insignia(stars,forceTier){
  const tier=forceTier!=null?forceTier:Math.min(3,Math.floor(Math.max(0,stars-1)/5));
  const count=forceTier!=null?5:stars<=0?0:stars>20?5:((stars-1)%5)+1,t=TIERS[tier];
  const pos=[[100,52],[150,88],[131,146],[69,146],[50,88]];let s='';
  for(let i=0;i<5;i++){const [x,y]=pos[i];
    s+=i<count?bevelStar(x,y,34,t):'<path d="'+starPath(x,y,34,14.3)+'" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-dasharray="3 3"/>'}
  if(stars>20&&forceTier==null)s+='<circle cx="100" cy="105" r="21" fill="#0b1f2e" stroke="'+t.mid+'" stroke-width="3"/><text x="100" y="113" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#fff">'+stars+'</text>';
  return '<svg viewBox="0 0 200 200">'+s+'</svg>';
}
function renderRank(){
  const stars=Math.max(0,Math.floor((level-1)/100)),tier=Math.min(3,Math.floor(Math.max(0,stars-1)/5));
  const next=(stars+1)*100,from=stars*100,pct=Math.round((level-1-from)/(next-from)*100);
  const label=stars===0?'No rank yet':TIERS[tier].name+(stars>20?' '+stars:' · '+(((stars-1)%5)+1)+' star'+(((stars-1)%5)?'s':''));
  $('p-rank').innerHTML='<div class="rank"><div class="ins">'+insignia(stars)+'</div><h3>'+label+'</h3>'+
    '<p class="sub">Flow level '+level+' · next star when you beat Boss '+next+'</p>'+
    '<div class="bar"><i style="width:'+Math.max(2,Math.min(100,pct))+'%"></i></div><p class="note">'+(next-level+1)+' levels to go. Every boss you beat pins another star.</p>'+
    '<div class="ladder">'+TIERS.map((t,i)=>'<div class="'+(i===tier&&stars>0?'on':'')+'">'+insignia(5,i)+t.name+'<br>Lv '+(500*(i+1))+'</div>').join('')+'</div></div>';
}

function renderSkins(){
  $('p-skins').innerHTML='<p class="note">Tap an earned skin to wear it in Flow. Looks only, no advantage. Boss levels keep their gold pipes.</p>'+
    '<div class="grid">'+SKINS.map(s=>{const g=s.got(),on=g&&s.id===worn();return '<button type="button" class="tile skin'+(on?' worn':g?' earned':' locked')+'"'+(g?' data-skin="'+s.id+'"':' tabindex="-1"')+'><span class="badge">'+s.art+'</span><b>'+s.name+'</b><small>'+(on?'Equipped ✓':g?'Tap to equip':s.how)+'</small></button>'}).join('')+'</div>';
}
function renderMojo(){
  $('p-mojo').innerHTML='<div class="mojoTab"><span class="soon">Coming soon</span><br><img src="/assets/mojo-front.png" alt="Pipe Mojo">'+
    '<p class="note">Make Mojo your own. Earn new looks by playing.</p><ul>'+
    '<li><b>Colors</b>Overalls, hat band, feather</li><li><b>Hats</b>Hard hat, bowler, Mardi Gras crown</li>'+
    '<li><b>Masks</b>Goalie mask, welder\'s mask</li><li><b>Tools</b>Plunger, pipe cutter, torch</li></ul></div>';
}

/* ---------- open and close the locker ---------- */
let opened=false;
function openLocker(){
  if(opened)return;opened=true;Snd.unlock();Snd.creak();
  renderRank();renderTrophies();renderSkins();renderMojo();
  $('gear').classList.add('on');$('gear').setAttribute('aria-hidden','false');setTimeout(()=>$('close').focus(),300);
}
function closeLocker(){if(!opened)return;opened=false;Snd.shut();$('gear').classList.remove('on');$('gear').setAttribute('aria-hidden','true');$('lockerHit').focus()}
$('lockerHit').addEventListener('click',openLocker);
$('close').addEventListener('click',closeLocker);
$('gear').addEventListener('click',e=>{if(e.target===$('gear'))closeLocker()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeLocker()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-tab]').forEach(x=>{const on=x===b;x.setAttribute('aria-selected',String(on));$('p-'+x.dataset.tab).hidden=!on});Snd.pick();
}));
setTimeout(()=>say(away>=3?'Where you been? Pipes don\'t fix themselves.':progressLine()||(level>1?'Welcome back. Check your gear.':'This here\'s my locker.')),900);
})();
</script>
</body>
</html>
